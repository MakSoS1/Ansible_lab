name: AIIJC Lighting Max Score

on:
  workflow_dispatch:
  push:
    branches:
      - feature/aijc-lighting-max-score
    paths:
      - 'aijc-lighting/**'
      - '.github/workflows/aijc-lighting-max-score.yml'

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      AIJC_CNN_EPOCHS: '10'
      AIJC_CNN_FOLDS: '3'
      AIJC_CNN_BATCH: '16'
      AIJC_CNN_BACKBONE: 'efficientnet_b0'
      AIJC_EMBED_BACKBONE: 'efficientnet_b0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: aijc-lighting/requirements.txt

      - name: Cache official dataset archive
        uses: actions/cache@v4
        with:
          path: aijc-lighting/data_освещённость.zip
          key: aijc-lighting-mailru-GCsv-1BXmZPEBj-v1

      - name: Cache pretrained weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/hub/checkpoints
            ~/.cache/huggingface
          key: aijc-lighting-pretrained-v2

      - name: Install dependencies
        working-directory: aijc-lighting
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        working-directory: aijc-lighting
        run: pytest tests -q

      - name: Download and validate official Mail.ru dataset
        working-directory: aijc-lighting
        run: python scripts/download_mailru.py --keep-zip

      - name: Run five-solution experiment
        working-directory: aijc-lighting
        run: |
          python run_experiments.py \
            --data-dir data \
            --output-dir outputs \
            --vision-mode full \
            --folds 5

      - name: Print final metrics
        if: always()
        working-directory: aijc-lighting
        run: |
          if [ -f outputs/metrics.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('outputs/metrics.json').read_text())
          print('\n=== CANDIDATES ===')
          for x in sorted(m['candidates'], key=lambda z: z['oof_accuracy'], reverse=True):
              print(f"{x['slot']}: {x['oof_accuracy']:.6f}  {x['name']}  test={x['test_distribution']}")
          print('\n=== SELECTED ===')
          print(json.dumps(m['selection'], indent=2))
          PY
          fi

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aijc-lighting-results
          path: |
            aijc-lighting/outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload official dataset source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aijc-lighting-dataset-source
          path: |
            aijc-lighting/data_освещённость.zip
            aijc-lighting/data/dataset_validation.json
            aijc-lighting/data/train.csv
            aijc-lighting/data/test.csv
            aijc-lighting/data/sample_submission.csv
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
