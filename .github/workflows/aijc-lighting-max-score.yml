name: AIIJC Lighting Max Score (V1 Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aijc-lighting-v1-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      AIJC_CNN_EPOCHS: '8'
      AIJC_CNN_FOLDS: '3'
      AIJC_CNN_BATCH: '32'
      AIJC_CNN_BACKBONE: 'mobilenet_v3_small'
      AIJC_EMBED_BACKBONE: 'vit_small_patch14_dinov2.lvd142m'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: aijc-lighting/requirements.txt

      - name: Cache official dataset archive
        uses: actions/cache@v4
        with:
          path: aijc-lighting/data_освещённость.zip
          key: aijc-lighting-mailru-GCsv-1BXmZPEBj-v3

      - name: Restore DINOv2 and feature cache from fast evaluation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/hub/checkpoints
            ~/.cache/huggingface
            aijc-lighting/outputs-fast/cache
          key: aijc-lighting-fast-dinov2-v1

      - name: Install dependencies
        working-directory: aijc-lighting
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements.txt

      - name: Unit tests
        working-directory: aijc-lighting
        run: pytest tests -q

      - name: Restore official archive from private Hugging Face cache
        working-directory: aijc-lighting
        run: python scripts/hf_dataset_cache.py restore --archive data_освещённость.zip

      - name: Download official archive if cache missed
        working-directory: aijc-lighting
        run: python scripts/download_archive_only.py --zip-path data_освещённость.zip

      - name: Extract and validate official dataset
        working-directory: aijc-lighting
        run: python scripts/download_mailru.py --keep-zip

      - name: Run five-solution experiment
        working-directory: aijc-lighting
        run: |
          python run_experiments.py \
            --data-dir data \
            --output-dir outputs \
            --vision-mode full \
            --folds 5

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aijc-lighting-v1-results
          path: aijc-lighting/outputs/
          if-no-files-found: warn
          retention-days: 30
