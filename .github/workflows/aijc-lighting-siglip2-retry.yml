name: AIIJC Lighting SigLIP2 Probe

on:
  workflow_dispatch:
  push:
    branches: [feature/aijc-lighting-max-score]
    paths: ['.github/workflows/aijc-lighting-siglip2-retry.yml']

permissions:
  contents: read

jobs:
  siglip2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=5.0' huggingface_hub scikit-learn lightgbm pandas pillow
      - name: Restore data
        working-directory: aijc-lighting
        run: |
          python scripts/hf_dataset_cache.py restore --archive data_освещённость.zip
          python scripts/download_mailru.py --keep-zip
      - name: Extract and evaluate SigLIP2
        working-directory: aijc-lighting
        run: |
          mkdir -p outputs-siglip2
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import numpy as np, pandas as pd, torch
          from PIL import Image
          from transformers import AutoModel, AutoProcessor
          from sklearn.preprocessing import normalize, StandardScaler
          from sklearn.model_selection import StratifiedKFold
          from sklearn.metrics import accuracy_score, confusion_matrix
          from sklearn.linear_model import LogisticRegression
          from sklearn.svm import SVC
          from sklearn.pipeline import make_pipeline
          from sklearn.decomposition import PCA
          from lightgbm import LGBMClassifier
          from src.data import discover_layout,load_manifests,resolve_image_paths

          torch.set_num_threads(4); ckpt='google/siglip2-base-patch16-224'; t0=time.time()
          layout=discover_layout('data'); trdf,tedf,_=load_manifests(layout); trp,tep=resolve_image_paths(layout); paths=trp+tep; y=trdf.label.to_numpy(int)
          model=AutoModel.from_pretrained(ckpt).eval(); proc=AutoProcessor.from_pretrained(ckpt)
          rows=[]
          with torch.inference_mode():
              for st in range(0,len(paths),16):
                  ims=[]
                  for p in paths[st:st+16]:
                      with Image.open(p) as im: ims.append(im.convert('RGB').copy())
                  inp=proc(images=ims,return_tensors='pt')
                  out=model.get_image_features(**inp).pooler_output
                  rows.append(out.numpy()); print('image',st+len(ims),'/',len(paths),flush=True)
          E=np.concatenate(rows).astype('float32'); np.save('outputs-siglip2/embeddings.npy',E)
          X=normalize(E[:len(y)]); Xt=normalize(E[len(y):]); cv=StratifiedKFold(5,shuffle=True,random_state=42)
          models={
            'lr01':lambda:LogisticRegression(C=.1,max_iter=4000),
            'lr03':lambda:LogisticRegression(C=.3,max_iter=4000),
            'lr1':lambda:LogisticRegression(C=1,max_iter=4000),
            'rbf':lambda:make_pipeline(PCA(n_components=min(192,X.shape[1]),whiten=True,random_state=42),SVC(C=2,kernel='rbf',probability=True,random_state=42)),
            'lgb':lambda:LGBMClassifier(n_estimators=400,learning_rate=.025,num_leaves=15,max_depth=5,min_child_samples=30,reg_lambda=6,verbosity=-1,n_jobs=-1,random_state=42),
          }
          store={}; metrics={}
          for name,fac in models.items():
              o=np.zeros((len(y),3)); t=np.zeros((len(Xt),3))
              for a,b in cv.split(X,y):
                  m=fac(); m.fit(X[a],y[a]); o[b]=m.predict_proba(X[b]); t+=m.predict_proba(Xt)/5
              metrics[name]=float(accuracy_score(y,o.argmax(1))); store[name]=(o,t); print(name,metrics[name],flush=True)

          # Prompt ensembles: evaluate several wording families on train without test labels.
          prompt_sets={
            'illumination':[
              ['a very dimly illuminated scene','a dark low-light scene','a scene under weak ambient illumination'],
              ['a normally illuminated scene','a scene under moderate ordinary illumination','a scene with normal ambient light'],
              ['a very brightly illuminated scene','a scene under strong bright illumination','a scene with high ambient light'],
            ],
            'exposure':[
              ['an underexposed dark photograph','a photo with very low exposure','an image with crushed dark shadows'],
              ['a correctly exposed photograph','a photo with normal exposure','a balanced exposure image'],
              ['an overexposed bright photograph','a photo with high exposure','a washed-out brightly exposed image'],
            ],
            'surveillance':[
              ['a surveillance camera scene with poor dim lighting','a CCTV scene in darkness','a low-light security camera view'],
              ['a surveillance camera scene with normal lighting','a CCTV scene with ordinary light','a normally lit security camera view'],
              ['a surveillance camera scene with strong bright lighting','a brightly lit CCTV scene','a high-light security camera view'],
            ],
          }
          all_prompts=[]; spans={}; pos=0
          for family,groups in prompt_sets.items():
              flat=sum(groups,[]); spans[family]=(pos,pos+len(flat),len(groups[0])); all_prompts+=flat; pos+=len(flat)
          with torch.inference_mode():
              tin=proc(text=all_prompts,padding='max_length',return_tensors='pt')
              T=model.get_text_features(**tin).pooler_output.numpy()
          En=normalize(E); Tn=normalize(T); sim=En@Tn.T
          for family,(lo,hi,k) in spans.items():
              s=sim[:,lo:hi]; cls=np.column_stack([s[:,c*k:(c+1)*k].mean(1) for c in range(3)])
              ex=np.exp((cls-cls.max(1,keepdims=True))*20); p=ex/ex.sum(1,keepdims=True)
              metrics['zs_'+family]=float(accuracy_score(y,p[:len(y)].argmax(1))); store['zs_'+family]=(p[:len(y)],p[len(y):]); print('zs',family,metrics['zs_'+family],flush=True)
          # Combine prompt families then search pair blends with learned heads.
          zavg=sum(store['zs_'+f][0] for f in prompt_sets)/len(prompt_sets); zt=sum(store['zs_'+f][1] for f in prompt_sets)/len(prompt_sets)
          metrics['zs_avg']=float(accuracy_score(y,zavg.argmax(1))); store['zs_avg']=(zavg,zt)
          bestn=max(metrics,key=metrics.get); besta=metrics[bestn]; best=store[bestn]
          names=list(store)
          for i in range(len(names)):
              for j in range(i+1,len(names)):
                  for alpha in np.arange(.1,1,.1):
                      oo=alpha*store[names[i]][0]+(1-alpha)*store[names[j]][0]; acc=accuracy_score(y,oo.argmax(1))
                      if acc>besta: besta=acc; bestn=f'{names[i]}+{names[j]}@{alpha:.1f}'; best=(oo,alpha*store[names[i]][1]+(1-alpha)*store[names[j]][1])
          metrics.update(selected_name=bestn,selected_accuracy=float(besta),confusion_matrix=confusion_matrix(y,best[0].argmax(1)).tolist(),seconds=time.time()-t0)
          np.save('outputs-siglip2/oof_probs.npy',best[0]); np.save('outputs-siglip2/test_probs.npy',best[1]); pd.DataFrame({'id':tedf.id,'label':best[1].argmax(1)}).to_csv('outputs-siglip2/submission.csv',index=False); Path('outputs-siglip2/metrics.json').write_text(json.dumps(metrics,indent=2)); print(json.dumps(metrics,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siglip2-probe
          path: aijc-lighting/outputs-siglip2/
          retention-days: 14
