name: AIIJC Lighting Transformer Probe

on:
  push:
    branches:
      - feature/aijc-lighting-transformers
    paths:
      - 'aijc-lighting/train_transformer.py'
      - '.github/workflows/aijc-lighting-transformer-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        backbone: [swin_tiny, deit3_small, maxvit_tiny]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU training dependencies
        working-directory: aijc-lighting
        run: |
          python -m pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q timm pandas scikit-learn huggingface_hub pillow pytest
      - name: Transformer unit tests
        working-directory: aijc-lighting
        run: pytest tests/test_transformer_solution.py -q
      - name: Restore official data
        working-directory: aijc-lighting
        run: |
          python scripts/hf_dataset_cache.py restore --archive data_освещённость.zip
          python scripts/download_mailru.py --keep-zip
      - name: Train fixed-fold transformer probe
        working-directory: aijc-lighting
        run: |
          python train_transformer.py \
            --backbone '${{ matrix.backbone }}' \
            --data data \
            --output outputs-transformer \
            --splits 3 --fold 0 --seed 42 \
            --head-epochs 1 --tune-epochs 5 \
            --batch-size 12 --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transformer-${{ matrix.backbone }}
          path: aijc-lighting/outputs-transformer/${{ matrix.backbone }}/
          retention-days: 14
