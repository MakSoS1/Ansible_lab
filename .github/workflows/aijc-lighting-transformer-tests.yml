name: AIIJC Lighting TDD

on:
  push:
    branches:
      - feature/aijc-lighting-transformers
    paths:
      - 'aijc-lighting/tests/test_transformer_solution.py'
      - 'aijc-lighting/src/transformer_solution.py'
      - 'aijc-lighting/tests/test_semantic_neighbors.py'
      - 'aijc-lighting/src/semantic_neighbors.py'
      - 'aijc-lighting/tests/test_structural_split.py'
      - 'aijc-lighting/src/structural_split.py'
      - 'aijc-lighting/src/original_manifest_order.py'
      - '.github/workflows/aijc-lighting-transformer-tests.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        working-directory: aijc-lighting
        run: |
          python -m pip install -q pytest pillow numpy scikit-learn
          python -m pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        working-directory: aijc-lighting
        run: pytest tests/test_transformer_solution.py tests/test_semantic_neighbors.py tests/test_structural_split.py -q
