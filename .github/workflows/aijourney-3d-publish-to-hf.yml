name: Publish AI Journey 3D dataset to Hugging Face

on:
  workflow_dispatch:
  push:
    paths:
      - "hackathon-3d/upload-trigger.txt"

permissions:
  contents: read

concurrency:
  group: ai-journey-3d-hf-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_SLUG: ai-journey-3d-mesh-quality-2026
      AIC_TAR_URL: https://rndml-team-xr.obs.ru-moscow-1.hc.sbercloud.ru/mazurov/AIC_data.tar

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==0.36.0"

      - name: Resolve private HF dataset
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          owner = api.whoami()["name"]
          repo_id = f"{owner}/{os.environ['HF_DATASET_SLUG']}"
          api.create_repo(repo_id=repo_id, repo_type="dataset", private=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"HF_DATASET_ID={repo_id}\n")
          print(repo_id)
          PY

      - name: Download official archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/aic"
          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "${RUNNER_TEMP}/aic/AIC_data.tar" \
            "${AIC_TAR_URL}"
          test -s "${RUNNER_TEMP}/aic/AIC_data.tar"
          sha256sum "${RUNNER_TEMP}/aic/AIC_data.tar" | tee "${RUNNER_TEMP}/aic/source.sha256"
          ls -lh "${RUNNER_TEMP}/aic/AIC_data.tar"

      - name: Unpack dataset
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/aic/hf"
          data="${root}/data"
          meta="${root}/metadata"
          mkdir -p "${data}" "${meta}"

          tar -xf "${RUNNER_TEMP}/aic/AIC_data.tar" -C "${data}"

          while IFS= read -r -d '' zipfile; do
            out="${zipfile%.zip}"
            mkdir -p "${out}"
            unzip -q "${zipfile}" -d "${out}"
            rm -f "${zipfile}"
          done < <(find "${data}" -type f -iname '*.zip' -print0)

          cp "${RUNNER_TEMP}/aic/source.sha256" "${meta}/source.sha256"
          rm -f "${RUNNER_TEMP}/aic/AIC_data.tar"

          find "${data}" -type f | wc -l
          test "$(find "${data}" -type f | wc -l)" -gt 0

      - name: Validate labels and create metadata
        shell: bash
        run: |
          set -euo pipefail
          export HF_ROOT="${RUNNER_TEMP}/aic/hf"
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["HF_ROOT"])
          data = root / "data"
          meta = root / "metadata"

          targets = [
              "abstract", "artifacts", "intersection", "lowpoly", "noisy",
              "open", "partial", "scale", "set", "simple",
          ]
          expected_train = ["item_id", *targets, "quality"]

          train_files = list(data.rglob("train.csv"))
          test_files = list(data.rglob("test.csv"))
          if len(train_files) != 1:
              raise RuntimeError(f"Expected one train.csv, found {train_files}")
          if len(test_files) != 1:
              raise RuntimeError(f"Expected one test.csv, found {test_files}")

          with train_files[0].open(newline="", encoding="utf-8-sig") as fh:
              train_rows = list(csv.DictReader(fh))
              train_fields = list(train_rows[0].keys()) if train_rows else []
          with test_files[0].open(newline="", encoding="utf-8-sig") as fh:
              test_rows = list(csv.DictReader(fh))
              test_fields = list(test_rows[0].keys()) if test_rows else []

          if train_fields != expected_train:
              raise RuntimeError(f"Unexpected train columns: {train_fields}")
          if test_fields != ["item_id"]:
              raise RuntimeError(f"Unexpected test columns: {test_fields}")
          if len(train_rows) != 8964:
              raise RuntimeError(f"Expected 8964 train rows, got {len(train_rows)}")
          if len(test_rows) != 669:
              raise RuntimeError(f"Expected 669 test rows, got {len(test_rows)}")

          mismatches = 0
          positives = {name: 0 for name in [*targets, "quality"]}
          for row in train_rows:
              values = {name: int(row[name]) for name in [*targets, "quality"]}
              if any(value not in (0, 1) for value in values.values()):
                  raise RuntimeError(f"Non-binary label in item {row['item_id']}")
              for name, value in values.items():
                  positives[name] += value
              expected_quality = int(sum(values[name] for name in targets) == 0)
              mismatches += int(values["quality"] != expected_quality)
          if mismatches:
              raise RuntimeError(f"quality rule mismatches: {mismatches}")

          sample_path = meta / "sample_submission.csv"
          with sample_path.open("w", newline="", encoding="utf-8") as fh:
              writer = csv.DictWriter(fh, fieldnames=expected_train)
              writer.writeheader()
              for row in test_rows:
                  out = {"item_id": row["item_id"], **{name: 0 for name in targets}, "quality": 1}
                  writer.writerow(out)

          file_count = sum(1 for p in data.rglob("*") if p.is_file())
          total_bytes = sum(p.stat().st_size for p in data.rglob("*") if p.is_file())
          manifest = {
              "source_url": os.environ["AIC_TAR_URL"],
              "train_rows": len(train_rows),
              "test_rows": len(test_rows),
              "targets": targets,
              "quality_rule_verified": True,
              "positive_counts": positives,
              "file_count": file_count,
              "total_bytes": total_bytes,
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "github_sha": os.environ["GITHUB_SHA"],
          }
          (meta / "dataset_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload to Hugging Face
        shell: bash
        run: |
          set -euo pipefail
          hf upload-large-folder \
            "${HF_DATASET_ID}" \
            "${RUNNER_TEMP}/aic/hf" \
            --repo-type dataset \
            --private \
            --num-workers 8

      - name: Verify remote dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.dataset_info(os.environ["HF_DATASET_ID"], files_metadata=True)
          names = {f.rfilename for f in info.siblings}
          required = {"metadata/source.sha256", "metadata/dataset_manifest.json", "metadata/sample_submission.csv"}
          missing = sorted(required - names)
          if info.private is not True:
              raise RuntimeError("HF dataset is not private")
          if missing:
              raise RuntimeError(f"Missing remote files: {missing}")
          if len(names) < 10:
              raise RuntimeError(f"Remote dataset unexpectedly small: {len(names)} files")
          print(f"HF_DATASET_URL=https://huggingface.co/datasets/{os.environ['HF_DATASET_ID']}")
          print(f"REMOTE_FILE_COUNT={len(names)}")
          PY
