name: AIOS CI

"on":
  pull_request:
  push:
    branches: [main, aios-track2-models]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Typecheck
        run: python -m mypy src
      - name: Test
        run: python -m pytest -q --ignore=tests/test_end_to_end.py
      - name: Bake-off five controllers on Apple Silicon
        if: github.event_name == 'push' && github.ref == 'refs/heads/aios-track2-models'
        run: python -m aios_track2.cli bakeoff --seed 42 --preset m1 --out runs/train
      - name: Upload bake-off artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/aios-track2-models'
        uses: actions/upload-artifact@v4
        with:
          name: aios-track2-bakeoff
          path: runs/train
          if-no-files-found: error
