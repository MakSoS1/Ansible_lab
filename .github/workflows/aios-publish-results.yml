name: AIOS publish results

"on":
  workflow_dispatch:
    inputs:
      artifact_dir:
        default: runs/local/bakeoff

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e "."
      - run: python scripts/resolve_hf_dataset.py
      - run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from aios_track2.hfpub import publish_run
          folder = Path("${{ inputs.artifact_dir }}")
          if not folder.exists():
              folder.mkdir(parents=True)
              (folder / "README.md").write_text("empty publish placeholder\n", encoding="utf-8")
          print(publish_run(folder))
          PY
