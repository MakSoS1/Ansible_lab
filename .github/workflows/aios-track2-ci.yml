name: AIOS Track 2 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/aios_track2/**'
      - 'tests/**'
      - 'configs/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/aios-track2-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest -q
      - name: Ruff
        run: ruff check src tests scripts
      - name: Top-5 smoke bake-off
        run: python scripts/smoke_bakeoff.py | tee bakeoff.json
      - name: Compute benchmark
        run: python -m aios_track2.cli benchmark | tee compute-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-track2-${{ matrix.os }}-diagnostics
          path: |
            bakeoff.json
            compute-benchmark.json
