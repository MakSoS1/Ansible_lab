name: AIOS Track 2 Economics Source Inspect

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/inspect_chdd_package.py'
      - 'src/aios_track2/economics.py'
      - 'aios-track2/materials/35_CHDD_PYTHON.zip'
      - 'aios-track2/materials/48_Расчет ЧДД через OPM Flow Model_Z.xlsx'
      - '.github/workflows/aios-track2-economics-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Inspect supplied CHDD Python package
        run: |
          python scripts/inspect_chdd_package.py 'aios-track2/materials/35_CHDD_PYTHON.zip' | tee chdd-package.json
      - name: Inspect control workbook
        run: |
          python - <<'PY' | tee chdd-control-workbook.json
          import json
          from openpyxl import load_workbook
          path = 'aios-track2/materials/48_Расчет ЧДД через OPM Flow Model_Z.xlsx'
          wb = load_workbook(path, read_only=True, data_only=False)
          out = {'sheets': []}
          for ws in wb.worksheets:
              rows = []
              for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row, 20), values_only=True):
                  rows.append(list(row))
              out['sheets'].append({'title': ws.title, 'max_row': ws.max_row, 'max_column': ws.max_column, 'head': rows})
          wb.close()
          print(json.dumps(out, ensure_ascii=False, default=str, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chdd-source-inspection
          path: |
            chdd-package.json
            chdd-control-workbook.json
