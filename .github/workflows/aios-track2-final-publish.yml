name: AIOS Track 2 Final Publish

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Recovery run containing verified evaluation, winner and clean rerun artifacts
        required: true
        default: '33925326455'
      experiment_git_sha:
        description: Immutable experiment head SHA recorded by the verified recovery run
        required: true
        default: '9ad40738134d1fc0beb1df62214d09bc9ea8d114'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: src
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  EXPERIMENT_GIT_SHA: ${{ inputs.experiment_git_sha }}
  MODEL_Z_ARCHIVE: aios-track2/materials/41_Model_Z_final_OPM.zip
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  publish:
    name: Verify and publish recovered final submission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true
      - name: Pull Model Z LFS object only
        run: git lfs pull --include="$MODEL_Z_ARCHIVE" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification and publishing dependencies
        run: |
          python -m pip install -e . --no-deps
          python -m pip install 'numpy>=2.0,<3' 'huggingface-hub>=0.27,<2' 'pyarrow>=17,<22' 'pytest>=8,<9'
      - name: Run HF store regression test
        run: python -m pytest -q tests/test_hfstore.py
      - name: Require Hugging Face token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo 'HF_TOKEN secret is missing' >&2
            exit 1
          fi
      - name: Resolve authenticated private dataset target
        run: python scripts/resolve_hf_dataset.py
      - name: Download verified challenge evaluation
        uses: actions/download-artifact@v4
        with:
          name: challenge-evaluation
          path: runs/evaluation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download verified winner
        uses: actions/download-artifact@v4
        with:
          name: challenge-winner
          path: runs/selection
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download verified clean rerun
        uses: actions/download-artifact@v4
        with:
          name: challenge-clean-rerun
          path: runs/clean
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Re-verify immutable final package
        run: |
          python scripts/verify_final_submission.py \
            --winner runs/selection/winner.json \
            --clean-dir runs/clean \
            --archive "$MODEL_Z_ARCHIVE" \
            --evaluation runs/evaluation/challenge-evaluation.json \
            --tournament-authorization runs/evaluation/tournament-authorization.json \
            --output-dir final-submission \
            --git-sha "$EXPERIMENT_GIT_SHA" \
            --github-run-id "$SOURCE_RUN_ID" \
            --dataset-id "$HF_DATASET_ID"
      - name: Upload immutable final run to Hugging Face
        run: python scripts/upload_hf_run.py final-submission final-submission/hf-run-manifest.json
      - name: Verify uploaded manifest byte-for-byte
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from huggingface_hub import hf_hub_download

          manifest_path = Path('final-submission/hf-run-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          prefix = f"runs/{manifest['git_sha'][:12]}-{manifest['github_run_id']}/{manifest['run_id']}"
          filename = f"{prefix}/final-submission-manifest.json"
          remote_path = Path(
              hf_hub_download(
                  repo_id=manifest['dataset_id'],
                  filename=filename,
                  repo_type='dataset',
                  token=os.environ['HF_TOKEN'],
                  force_download=True,
              )
          )
          local_path = Path('final-submission/final-submission-manifest.json')
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          local_sha = sha(local_path)
          remote_sha = sha(remote_path)
          print(f'HF dataset: {manifest["dataset_id"]}')
          print(f'HF path: {filename}')
          print(f'local sha256:  {local_sha}')
          print(f'remote sha256: {remote_sha}')
          if local_sha != remote_sha:
              raise SystemExit('uploaded final manifest differs from verified local manifest')
          PY
      - name: Upload final GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-track2-final-submission
          retention-days: 90
          if-no-files-found: error
          path: final-submission
