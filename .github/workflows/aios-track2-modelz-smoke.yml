name: AIOS Model Z / OPM Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/aios_track2/**'
      - 'scripts/inspect_model_z.py'
      - 'scripts/validate_model_z.py'
      - 'aios-track2/materials/41_Model_Z_final_OPM.zip'
      - '.github/workflows/aios-track2-modelz-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install OPM Flow 2026 binary packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common mpi-default-bin
          sudo add-apt-repository -y ppa:opm/ppa
          sudo apt-get update -y
          sudo apt-get install -y libopm-simulators-bin python3-opm-common
      - name: Inspect archive, deck and OPM bindings
        run: |
          python scripts/inspect_model_z.py 'aios-track2/materials/41_Model_Z_final_OPM.zip' --extract-to /tmp/model-z | tee model-z-inventory.json
          flow --version
      - name: Contract-check real Model Z
        run: python scripts/validate_model_z.py 'aios-track2/materials/41_Model_Z_final_OPM.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: model-z-inventory
          path: model-z-inventory.json
