name: AIOS OPM Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[hf]'
      - name: Install OPM Flow
        run: |
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common mpi-default-bin
          sudo add-apt-repository -y ppa:opm/ppa
          sudo apt-get update -y
          sudo apt-get install -y libopm-simulators-bin python3-opm-common
      - name: Run immutable Model Z baseline
        run: python scripts/opm_baseline.py 'aios-track2/materials/41_Model_Z_final_OPM.zip' --output runs/baseline
      - uses: actions/upload-artifact@v4
        with:
          name: model-z-opm-baseline
          path: runs/baseline
