name: AIOS OPM Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/opm_baseline.py'
      - 'scripts/inspect_opm_summary.py'
      - 'src/aios_track2/opm.py'
      - 'src/aios_track2/economics.py'
      - 'src/aios_track2/economics_official.py'
      - '.github/workflows/aios-track2-opm-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Track 2 and OPM Python bindings
        run: python -m pip install -e '.[hf]' 'opm==2026.4'
      - name: Install OPM Flow 2026.04
        run: |
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common mpi-default-bin
          sudo add-apt-repository -y ppa:opm/ppa
          sudo apt-get update -y
          sudo apt-get install -y libopm-simulators-bin
          flow --version
      - name: Run immutable Model Z baseline
        shell: bash
        run: |
          set -o pipefail
          python scripts/opm_baseline.py 'aios-track2/materials/41_Model_Z_final_OPM.zip' --output runs/baseline --timeout 9000 | tee runs/baseline-run.json
      - name: Inspect OPM summary contract
        shell: bash
        run: |
          set -o pipefail
          python scripts/inspect_opm_summary.py runs/baseline --output runs/baseline/summary-contract.json | tee runs/summary-contract.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-z-opm-baseline
          path: |
            runs/baseline
            runs/baseline-run.json
            runs/summary-contract.log
