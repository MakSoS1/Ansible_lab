name: AIOS train surrogate on Apple Silicon

"on":
  workflow_dispatch:
    inputs:
      seed:
        description: RNG seed
        required: true
        default: '42'
      config_path:
        description: Model config
        required: true
        default: configs/models/graph.yaml
      dataset_revision:
        description: HF dataset revision
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  train:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test
        run: python -m pytest -q --ignore=tests/test_end_to_end.py
      - name: Bake-off five controllers on MPS
        run: python -m aios_track2.cli bakeoff --seed ${{ inputs.seed }} --preset m1 --out runs/train
      - name: Resolve private HF dataset
        run: python scripts/resolve_hf_dataset.py
      - name: Publish immutable run
        run: python -c "from pathlib import Path; from aios_track2.hfpub import publish_run; print(publish_run(Path('runs/train')))"
