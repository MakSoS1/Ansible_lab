name: AIOS validate candidate

"on":
  workflow_dispatch:
    inputs:
      seed:
        default: '42'

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: bash scripts/run_smoke.sh ${{ inputs.seed }} runs/validate
      - run: python scripts/resolve_hf_dataset.py
      - run: python -c "from pathlib import Path; from aios_track2.hfpub import publish_run; print(publish_run(Path('runs/validate')))"
