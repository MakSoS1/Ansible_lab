name: Browser connectivity diagnostics

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/browser-connectivity-diagnostics.yml'

permissions:
  contents: read

jobs:
  network:
    name: Network ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Raw TCP, HTTP and HTTPS diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import os, socket, ssl, time

          host = "176.109.106.246"
          path = "/content"
          print("OS proxy environment:")
          for k in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"):
              if os.environ.get(k):
                  print(f"  {k}={os.environ[k]}")

          print("\nTCP connectivity:")
          for port in (80, 443, 8080, 8443):
              t0 = time.time()
              try:
                  with socket.create_connection((host, port), timeout=7):
                      print(f"  {host}:{port} OPEN ({time.time()-t0:.3f}s)")
              except Exception as e:
                  print(f"  {host}:{port} FAIL ({time.time()-t0:.3f}s): {type(e).__name__}: {e}")

          def raw_http(port, tls=False, ua="diag"):
              label = f"{'HTTPS' if tls else 'HTTP'}:{port} UA={ua[:20]}"
              t0 = time.time()
              try:
                  s = socket.create_connection((host, port), timeout=8)
                  s.settimeout(8)
                  if tls:
                      ctx = ssl.create_default_context()
                      ctx.check_hostname = False
                      ctx.verify_mode = ssl.CERT_NONE
                      s = ctx.wrap_socket(s, server_hostname=host)
                      print(f"\n{label}: TLS {s.version()} cipher={s.cipher()}")
                  req = (
                      f"GET {path} HTTP/1.1\r\n"
                      f"Host: {host}\r\n"
                      f"User-Agent: {ua}\r\n"
                      "Accept: text/html,*/*\r\n"
                      "Connection: close\r\n\r\n"
                  ).encode()
                  s.sendall(req)
                  chunks = []
                  total = 0
                  while total < 8192:
                      b = s.recv(min(4096, 8192-total))
                      if not b:
                          break
                      chunks.append(b)
                      total += len(b)
                  data = b"".join(chunks)
                  print(f"{label}: received {len(data)} bytes in {time.time()-t0:.3f}s")
                  print(data.decode("utf-8", "replace")[:4000])
                  s.close()
              except Exception as e:
                  print(f"\n{label}: FAIL in {time.time()-t0:.3f}s: {type(e).__name__}: {e}")

          uas = [
              "Mozilla/5.0 Chrome/148.0.0.0 Safari/537.36",
              "Mozilla/5.0 Firefox/153.0",
          ]
          for ua in uas:
              raw_http(80, False, ua)
              raw_http(443, True, ua)
          PY

  browsers:
    name: Headless Chrome and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show installed browsers
        shell: bash
        run: |
          google-chrome --version || true
          firefox --version || true
          python --version

      - name: Test with Selenium in Chrome and Firefox
        shell: bash
        run: |
          python -m pip install --quiet selenium
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options as ChromeOptions
          from selenium.webdriver.firefox.options import Options as FirefoxOptions

          urls = [
              "http://176.109.106.246/content",
              "https://176.109.106.246/content",
          ]

          def run_browser(name, factory):
              print(f"\n===== {name} =====")
              try:
                  driver = factory()
              except Exception as e:
                  print(f"START FAIL: {type(e).__name__}: {e}")
                  return
              try:
                  driver.set_page_load_timeout(18)
                  for url in urls:
                      print(f"\nGET {url}")
                      t0 = time.time()
                      try:
                          driver.get(url)
                          print(f"OK {time.time()-t0:.2f}s")
                      except Exception as e:
                          print(f"NAV FAIL {time.time()-t0:.2f}s: {type(e).__name__}: {e}")
                      try:
                          print("current_url:", driver.current_url)
                          print("title:", driver.title)
                          src = driver.page_source or ""
                          print("page_source_prefix:", src[:2500].replace("\n", " "))
                      except Exception as e:
                          print("READ FAIL:", type(e).__name__, e)
              finally:
                  driver.quit()

          def chrome():
              o = ChromeOptions()
              o.add_argument("--headless=new")
              o.add_argument("--no-sandbox")
              o.add_argument("--disable-gpu")
              o.add_argument("--ignore-certificate-errors")
              o.add_argument("--disable-quic")
              return webdriver.Chrome(options=o)

          def firefox():
              o = FirefoxOptions()
              o.add_argument("-headless")
              o.accept_insecure_certs = True
              return webdriver.Firefox(options=o)

          run_browser("Chrome", chrome)
          run_browser("Firefox", firefox)
          PY
