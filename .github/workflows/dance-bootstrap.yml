name: Bootstrap and verify dance game

on:
  push:
    branches: ["feat/dance-game-realtime"]
    paths:
      - ".dance-bootstrap/**"
      - ".github/workflows/dance-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cross-platform:
    name: Backend + desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source payload
        run: python -c "import base64,pathlib,zipfile; p=pathlib.Path('.dance-bootstrap/payload.b64'); z=pathlib.Path('payload.zip'); z.write_bytes(base64.b64decode(p.read_text())); zipfile.ZipFile(z).extractall('.'); z.unlink()"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: remote_dance_game/requirements-ci.txt
      - name: Install backend test dependencies
        working-directory: remote_dance_game
        run: python -m pip install -r requirements-ci.txt
      - name: Compile backend
        working-directory: remote_dance_game
        run: python -m compileall -q backend tests
      - name: Run backend/scoring tests
        working-directory: remote_dance_game
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remote_dance_game/desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: remote_dance_game/desktop
        run: npm ci
      - name: Type-check desktop
        working-directory: remote_dance_game/desktop
        run: npx tsc --noEmit
      - name: Build desktop UI
        working-directory: remote_dance_game/desktop
        run: npm run build

  media-smoke:
    name: FFmpeg media pipeline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source payload
        run: python -c "import base64,pathlib,zipfile; p=pathlib.Path('.dance-bootstrap/payload.b64'); z=pathlib.Path('payload.zip'); z.write_bytes(base64.b64decode(p.read_text())); zipfile.ZipFile(z).extractall('.'); z.unlink()"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend test dependencies
        working-directory: remote_dance_game
        run: python -m pip install -r requirements-ci.txt
      - name: Run media smoke test
        working-directory: remote_dance_game
        run: python tests/media_smoke.py

  android:
    name: Android tracker APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source payload
        run: python -c "import base64,pathlib,zipfile; p=pathlib.Path('.dance-bootstrap/payload.b64'); z=pathlib.Path('payload.zip'); z.write_bytes(base64.b64decode(p.read_text())); zipfile.ZipFile(z).extractall('.'); z.unlink()"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: remote_dance_game/mobile-android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dance-coach-mobile-debug-bootstrap
          path: remote_dance_game/mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-source:
    name: Publish verified source
    needs: [cross-platform, media-smoke, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source payload
        run: python -c "import base64,pathlib,zipfile; p=pathlib.Path('.dance-bootstrap/payload.b64'); z=pathlib.Path('payload.zip'); z.write_bytes(base64.b64decode(p.read_text())); zipfile.ZipFile(z).extractall('.'); z.unlink()"
      - name: Replace bootstrap with normal source tree
        run: |
          rm -rf .dance-bootstrap
          rm -f .github/workflows/dance-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement realtime dance game"
          git push origin HEAD:feat/dance-game-realtime
