name: Dance game CI

concurrency:
  group: dance-game-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "remote_dance_game/**"
      - ".github/workflows/dance-game-ci.yml"
  push:
    branches:
      - "feat/dance-game-*"
    paths:
      - "remote_dance_game/**"
      - ".github/workflows/dance-game-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: remote_dance_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: remote_dance_game/requirements-ci.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile backend
        run: python -m compileall -q backend tests tools
      - name: Run scoring and package tests
        run: python -m pytest -q tests

  frontend:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: remote_dance_game/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remote_dance_game/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Check phone tracker JavaScript
        shell: bash
        run: |
          node --check ../mobile/app.js
          node --check ../mobile-android/app/src/main/assets/mobile/app.js
      - name: Build Vite desktop UI
        run: npm run build

  media-smoke:
    name: FFmpeg + HQ video master
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: remote_dance_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install media test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Exercise probe, normalize and preview pipeline
        run: python tests/media_smoke.py

  android:
    name: Android tracker build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: remote_dance_game/mobile-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 34 components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dance-coach-mobile-debug
          path: remote_dance_game/mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  showcase:
    name: Record TV gameplay showcase
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: remote_dance_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remote_dance_game/desktop/package-lock.json
      - name: Install FFmpeg and Python media dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-ci.txt
      - name: Generate source and compiled showcase videos
        env:
          DANCE_DISABLE_YOLO: "1"
        run: python tools/make_showcase_assets.py
      - name: Install desktop and browser recorder
        working-directory: remote_dance_game/desktop
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start TV UI and record walkthrough
        shell: bash
        run: |
          cd desktop
          npm run dev -- --host 127.0.0.1 > /tmp/dance-vite.log 2>&1 &
          npx wait-on http://127.0.0.1:5173
          node tools/record_showcase.mjs
      - name: Add preview/game audio and encode MP4
        shell: bash
        run: |
          mkdir -p artifacts/final
          ffmpeg -y \
            -i desktop/artifacts/showcase.webm \
            -stream_loop 2 -i desktop/public/showcase/game.mp4 \
            -filter_complex "[1:a]asplit=2[p][g];[p]atrim=0:6,volume=0.10,adelay=10000:all=1[pd];[g]atrim=0:10,volume=0.62,adelay=24500:all=1[gd];[pd][gd]amix=inputs=2:normalize=0[a]" \
            -map 0:v:0 -map "[a]" -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -c:a aac -b:a 160k -shortest \
            artifacts/final/dance-game-showcase.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: dance-game-showcase-video
          path: remote_dance_game/artifacts/final/dance-game-showcase.mp4
          if-no-files-found: error


  unity-project:
    name: Unity project contract
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: remote_dance_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Unity preflight dependencies
        run: python -m pip install pytest
      - name: Validate Unity project and backend bridge
        run: python -m pytest -q tests/unity_project_smoke.py
