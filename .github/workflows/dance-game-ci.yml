name: Dance game CI

on:
  pull_request:
    paths:
      - "remote_dance_game/**"
      - ".github/workflows/dance-game-ci.yml"
  push:
    branches:
      - "feat/dance-game-*"
    paths:
      - "remote_dance_game/**"
      - ".github/workflows/dance-game-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: remote_dance_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: remote_dance_game/requirements-ci.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile backend
        run: python -m compileall -q backend tests
      - name: Run scoring and package tests
        run: python -m pytest -q tests

  frontend:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: remote_dance_game/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remote_dance_game/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build Vite desktop UI
        run: npm run build

  media-smoke:
    name: FFmpeg media smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: remote_dance_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Exercise probe, normalize and preview pipeline
        run: python tests/media_smoke.py

  android:
    name: Android tracker build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: remote_dance_game/mobile-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 34 components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dance-coach-mobile-debug
          path: remote_dance_game/mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
