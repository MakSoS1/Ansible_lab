name: E-CUP baseline archives mirror

on:
  workflow_dispatch:
  push:
    branches:
      - ecup-matching-2026
    paths:
      - ".github/workflows/ecup-baselines.yml"
      - "ecup_matching/baseline_sync.py"
      - "ecup_matching/tests/test_baseline_sync.py"

permissions:
  contents: read

jobs:
  mirror-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
      HF_XET_HIGH_PERFORMANCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Run baseline mirror tests
        run: python -m pytest ecup_matching/tests/test_baseline_sync.py ecup_matching/tests/test_hf_sync.py -q

      - name: Require Hugging Face write token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::Missing repository Actions secret HF_TOKEN"
            exit 1
          fi

      - name: Mirror official baseline archives
        env:
          ECUP_BASELINE_MIRROR_DIR: ${{ runner.temp }}/ecup-baseline-mirror
        run: python -m ecup_matching.baseline_sync

      - name: Remove baseline archives from runner
        if: always()
        run: rm -rf "${RUNNER_TEMP}/ecup-baseline-mirror"
