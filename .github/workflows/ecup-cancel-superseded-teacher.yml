name: E-CUP cancel superseded teacher recovery

on:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-cancel-superseded-teacher.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded recovery run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: '31504195144'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/cancel")
          cat /tmp/body || true
          if [[ "$code" != "202" && "$code" != "409" ]]; then
            echo "unexpected HTTP status: $code" >&2
            exit 1
          fi
          echo "cancel status=$code run=$RUN_ID"
