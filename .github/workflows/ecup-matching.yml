name: E-CUP matching workspace

on:
  workflow_dispatch:
  push:
    branches:
      - ecup-matching-2026
    paths:
      - ".github/workflows/ecup-matching.yml"
      - "ecup_matching/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Run tests
        run: python -m pytest ecup_matching/tests -q
