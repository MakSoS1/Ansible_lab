name: E-CUP matching workspace

on:
  workflow_dispatch:
  push:
    branches:
      - ecup-matching-2026
    paths:
      - ".github/workflows/ecup-matching.yml"
      - "ecup_matching/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Run tests
        run: python -m pytest ecup_matching/tests -q

  profile-human:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Download human-labelled data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ecup-human"
          curl -fL --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/ecup-human/matches.parquet" \
            "https://storage.yandexcloud.net/ozon-ecup-2026/Matching/matches.parquet"
          curl -fL --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/ecup-human/items_human.parquet" \
            "https://storage.yandexcloud.net/ozon-ecup-2026/Matching/items_human.parquet"
          test -s "${RUNNER_TEMP}/ecup-human/matches.parquet"
          test -s "${RUNNER_TEMP}/ecup-human/items_human.parquet"

      - name: Build aggregate profile
        run: |
          mkdir -p "${RUNNER_TEMP}/ecup-profile"
          python -m ecup_matching.profile_human \
            --matches "${RUNNER_TEMP}/ecup-human/matches.parquet" \
            --items "${RUNNER_TEMP}/ecup-human/items_human.parquet" \
            --json-out "${RUNNER_TEMP}/ecup-profile/profile.json" \
            --md-out "${RUNNER_TEMP}/ecup-profile/profile.md"

      - name: Upload aggregate profile artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecup-human-profile
          path: |
            ${{ runner.temp }}/ecup-profile/profile.json
            ${{ runner.temp }}/ecup-profile/profile.md
          if-no-files-found: error
          retention-days: 7

      - name: Remove competition data from runner
        if: always()
        run: rm -rf "${RUNNER_TEMP}/ecup-human" "${RUNNER_TEMP}/ecup-profile"

  mirror-hf:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
      HF_XET_HIGH_PERFORMANCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Require Hugging Face write token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::Missing repository Actions secret HF_TOKEN. Add a Hugging Face write token as Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Mirror all organizer parquet files to private Hugging Face dataset
        env:
          ECUP_MIRROR_DIR: ${{ runner.temp }}/ecup-mirror
        run: python -m ecup_matching.hf_sync

      - name: Remove competition data from runner
        if: always()
        run: rm -rf "${RUNNER_TEMP}/ecup-mirror"
