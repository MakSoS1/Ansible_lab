name: E-CUP hardened Memora memory

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - ".github/workflows/ecup-memora-memory.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/copilot-instructions.md"
      - "docs/agent-memory/**"
      - "tools/memora_hardened/**"
      - "scripts/memory*.py"
      - "scripts/memora*.py"
      - "scripts/memora*.sh"
      - "ecup_matching/experiments/**"
      - "ecup_matching/tests/test_memora_hardening.py"
      - "ecup_matching/tests/test_memory_policy.py"

permissions:
  contents: read

jobs:
  memory-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - name: Install repository test dependencies
        run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Run complete repository test suite
        run: python -m pytest ecup_matching/tests -q
