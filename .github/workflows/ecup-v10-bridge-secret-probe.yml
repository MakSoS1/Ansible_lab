name: E-CUP v10 bridge secret probe

on:
  push:
    branches: [ecup-v10-distilled-fast]
    paths: [.github/workflows/ecup-v10-bridge-secret-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      GPU_DISPATCH_TOKEN: ${{ secrets.GPU_DISPATCH_TOKEN }}
      GPU_DISPATCH_PAT: ${{ secrets.GPU_DISPATCH_PAT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      REPO_PAT: ${{ secrets.REPO_PAT }}
    steps:
      - name: Print presence booleans only
        shell: bash
        run: |
          set -euo pipefail
          for name in GPU_DISPATCH_TOKEN GPU_DISPATCH_PAT GH_PAT GITHUB_PAT PRIVATE_REPO_TOKEN REPO_PAT; do
            if [[ -n "${!name:-}" ]]; then echo "$name=true"; else echo "$name=false"; fi
          done
