name: E-CUP v10 full verification

on:
  workflow_dispatch:
  push:
    branches: [ecup-v10-distilled-fast]
    paths:
      - ".github/workflows/**"
      - "ecup_matching/**"
      - "docs/agent-memory/**"
      - "AGENTS.md"
      - "scripts/memory_policy.py"
      - "scripts/release_policy.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Full repository E-CUP test suite
        run: python -m pytest ecup_matching/tests -q
      - name: Canonical memory policy
        run: python scripts/memory_policy.py
      - name: Forbid GitHub Releases and prereleases
        run: python scripts/release_policy.py
