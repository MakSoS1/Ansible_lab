name: E-CUP v10 publish exact keeper to HF

on:
  push:
    branches: [ecup-v10-distilled-fast]
    paths:
      - 'ecup_matching/experiments/v10/V10_HF_PUBLISH_REQUEST.json'

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  HF_PREFIX: submissions/v10/final

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Read frozen keeper request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('ecup_matching/experiments/v10/V10_HF_PUBLISH_REQUEST.json')
          r=json.loads(p.read_text())
          required=('release_tag','filename','sha256','bytes','source_sha','runtime_gate_run_id','public_115k_wall_seconds','private_275k_wall_seconds')
          missing=[k for k in required if r.get(k) in (None,'')]
          if missing: raise SystemExit(f'missing keeper request fields: {missing}')
          if r.get('runtime_gate_passed') is not True: raise SystemExit('runtime gate is not frozen as passed')
          if r.get('teacher_checkpoint_packaged') is not False: raise SystemExit('teacher checkpoint contract violated')
          if float(r['public_115k_wall_seconds']) >= 120: raise SystemExit('115k internal acceptance gate violated')
          if float(r['private_275k_wall_seconds']) >= 250: raise SystemExit('275k internal acceptance gate violated')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for key,env in [('release_tag','RELEASE_TAG'),('filename','ARCHIVE_NAME'),('sha256','ARCHIVE_SHA'),('bytes','ARCHIVE_BYTES')]:
                  f.write(f'{env}={r[key]}\n')
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Download and verify exact immutable release bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 20 --retry-delay 2 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ARCHIVE_NAME}" \
            -o "$RUNNER_TEMP/$ARCHIVE_NAME"
          test "$(stat -c '%s' "$RUNNER_TEMP/$ARCHIVE_NAME")" = "$ARCHIVE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/$ARCHIVE_NAME" | awk '{print $1}')" = "$ARCHIVE_SHA"
          python - "$RUNNER_TEMP/$ARCHIVE_NAME" <<'PY'
          import stat,sys,zipfile
          from pathlib import PurePosixPath
          z=sys.argv[1]
          with zipfile.ZipFile(z) as a:
              assert a.testzip() is None
              names=a.namelist()
              assert 'run.py' in names
              assert 'NO_TEACHER_KEEPER.json' in names
              assert not any(n.startswith('model_v5_teacher/') for n in names)
              for info in a.infolist():
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert not stat.S_ISLNK((info.external_attr>>16)&0xffff)
          print('exact_archive_contract_ok')
          PY
      - name: Build final HF keeper manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('ecup_matching/experiments/v10/V10_HF_PUBLISH_REQUEST.json').read_text())
          keeper={
            'version':'v10',
            'status':'completed',
            'candidate':'no_teacher+frozen_graph',
            'filename':r['filename'],
            'bytes':int(r['bytes']),
            'sha256':r['sha256'],
            'source_sha':r['source_sha'],
            'release_tag':r['release_tag'],
            'strict_raw_oof_macro_ap':0.5931387077244183,
            'strict_graph_oof_macro_ap':0.5950413762943735,
            'target_stress_graph_mean':0.44961526826354,
            'teacher_checkpoint_packaged':False,
            'cpu_gpu_overlap':True,
            'contrastive_only_text_cache':True,
            'runtime_gate_run_id':int(r['runtime_gate_run_id']),
            'public_115k_wall_seconds':float(r['public_115k_wall_seconds']),
            'private_275k_wall_seconds':float(r['private_275k_wall_seconds']),
            'public_115k_internal_acceptance_seconds':120.0,
            'private_275k_internal_acceptance_seconds':250.0,
            'gpu':'NVIDIA GeForce RTX 2060 SUPER',
            'sealed_gold_opened':False,
            'sealed_gold_rows_scored':0,
            'leaderboard_score':None,
            'leaderboard_score_claimed':False,
          }
          Path('/tmp/V10_KEEPER.json').write_text(json.dumps(keeper,indent=2,sort_keys=True)+'\n')
          print(json.dumps(keeper,indent=2,sort_keys=True))
          PY
      - name: Upload exact keeper and manifest to private HF dataset
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'huggingface_hub>=1.0,<2'
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          repo=os.environ['HF_REPO_ID']; prefix=os.environ['HF_PREFIX']
          archive=os.path.join(os.environ['RUNNER_TEMP'],os.environ['ARCHIVE_NAME'])
          api.upload_file(path_or_fileobj=archive,path_in_repo=f"{prefix}/{os.environ['ARCHIVE_NAME']}",repo_id=repo,repo_type='dataset',commit_message='v10: publish exact runtime-gated keeper')
          api.upload_file(path_or_fileobj='/tmp/V10_KEEPER.json',path_in_repo=f'{prefix}/V10_KEEPER.json',repo_id=repo,repo_type='dataset',commit_message='v10: add keeper provenance')
          files=set(api.list_repo_files(repo_id=repo,repo_type='dataset'))
          required={f"{prefix}/{os.environ['ARCHIVE_NAME']}",f'{prefix}/V10_KEEPER.json'}
          missing=required-files
          if missing: raise SystemExit(f'HF verification failed: {sorted(missing)}')
          print('HF_VERIFIED')
          for p in sorted(required): print(p)
          PY
