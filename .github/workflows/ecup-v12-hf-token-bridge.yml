name: E-CUP v12 encrypted HF token bridge

on:
  push:
    branches: [ecup-v12-puregpu-main]
    paths:
      - .github/workflows/ecup-v12-hf-token-bridge.yml
      - ecup_matching/experiments/v12/V12_HF_BRIDGE_REQUEST.json

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PUBLIC_PEM_B64: 
    steps:
      - name: Encrypt HF token for the private RTX runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          printf '%s' "$PUBLIC_PEM_B64" | base64 -d > /tmp/public.pem
          openssl pkey -pubin -in /tmp/public.pem -noout >/dev/null
          printf '%s' "$HF_TOKEN" | openssl pkeyutl -encrypt -pubin -inkey /tmp/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > /tmp/token.enc
          printf 'V12_HF_TOKEN_CIPHERTEXT_B64='
          base64 -w0 /tmp/token.enc
          printf '\n'
          rm -f /tmp/token.enc /tmp/public.pem
