name: E-CUP v12 canonical snapshot fingerprint

on:
  push:
    branches: [ecup-v12-puregpu-main]
    paths: ['.github/workflows/ecup-v12-snapshot-fingerprint.yml']

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'huggingface_hub>=1,<2'
      - name: Fingerprint exact private-HF inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          out={}
          for name in ('matches.parquet','items_human.parquet','matches_llm.parquet','items.parquet'):
              p=Path(hf_hub_download(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',filename=name,token=os.environ['HF_TOKEN']))
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(8<<20),b''): h.update(chunk)
              out[name]={'bytes':p.stat().st_size,'sha256':h.hexdigest()}
          print('V12_CANONICAL_FINGERPRINT='+json.dumps(out,sort_keys=True))
          PY
