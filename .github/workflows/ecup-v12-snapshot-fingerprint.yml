name: E-CUP v12 canonical snapshot fingerprint

on:
  push:
    branches: [ecup-v12-puregpu-main]
    paths: ['.github/workflows/ecup-v12-snapshot-fingerprint.yml']

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  PUBLIC_BASE: https://storage.yandexcloud.net/ozon-ecup-2026/Matching

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'huggingface_hub>=1,<2'
      - name: Compare exact private-HF and current official inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          names=('matches.parquet','items_human.parquet','matches_llm.parquet','items.parquet')
          root=Path(os.environ['RUNNER_TEMP'])/'v12-public'; root.mkdir()
          def digest(p):
              h=hashlib.sha256()
              with Path(p).open('rb') as f:
                  for chunk in iter(lambda:f.read(8<<20),b''): h.update(chunk)
              return {'bytes':Path(p).stat().st_size,'sha256':h.hexdigest()}
          private={}; public={}
          for name in names:
              hp=Path(hf_hub_download(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',filename=name,token=os.environ['HF_TOKEN']))
              private[name]=digest(hp)
              pp=root/name
              with urllib.request.urlopen(os.environ['PUBLIC_BASE'].rstrip('/')+'/'+name,timeout=120) as r, pp.open('wb') as f:
                  while True:
                      chunk=r.read(8<<20)
                      if not chunk: break
                      f.write(chunk)
              public[name]=digest(pp)
          equal={name:private[name]==public[name] for name in names}
          print('V12_CANONICAL_FINGERPRINT='+json.dumps(private,sort_keys=True))
          print('V12_PUBLIC_FINGERPRINT='+json.dumps(public,sort_keys=True))
          print('V12_PUBLIC_EQUALS_CANONICAL='+json.dumps(equal,sort_keys=True))
          PY
