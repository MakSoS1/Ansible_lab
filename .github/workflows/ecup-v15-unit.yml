name: E-CUP v15 unit contract

on:
  push:
    branches: [ecup-v15-field-aware]
    paths: ['ecup_matching/experiments/v15/TDD_TRIGGER.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install unit dependencies
        run: python -m pip install -q pytest numpy pandas scikit-learn
      - name: Run v15 unit tests
        run: |
          python -m pytest \
            ecup_matching/tests/test_v15_fields.py \
            ecup_matching/tests/test_v15_pair_features.py \
            ecup_matching/tests/test_v15_serialization.py \
            ecup_matching/tests/test_v15_validation.py \
            ecup_matching/tests/test_v15_distill.py \
            ecup_matching/tests/test_v15_runtime.py -q
