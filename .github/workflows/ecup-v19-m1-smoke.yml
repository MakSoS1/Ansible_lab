name: E-CUP v19 anti-forgetting M1 smoke

on:
  push:
    branches: [ecup-v19-antiforget]
    paths:
      - v19_m1_smoke_job.json
      - ecup_matching/ml/v19_*.py
      - ecup_matching/ml/run_v19_*.py
      - tests/test_v19_*.py
      - .github/workflows/ecup-v19-m1-smoke.yml

permissions:
  contents: read

concurrency:
  group: ecup-v19-m1-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Show runner and install lightweight test stack
        shell: bash
        run: |
          set -euo pipefail
          uname -a; uname -m; python3 -VV
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q pytest pandas numpy pyarrow torch transformers scikit-learn
      - name: Probe MPS capability
        shell: bash
        run: |
          python3 - <<'PY'
          import json,platform,torch
          p={'machine':platform.machine(),'torch_version':torch.__version__,'mps_built':bool(torch.backends.mps.is_built()),'mps_available':bool(torch.backends.mps.is_available())}
          print('V19_M1_CAPABILITY='+json.dumps(p,sort_keys=True))
          open('/tmp/v19-m1-capability.json','w').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
      - name: Compile v19 and inherited v18 training modules
        run: python3 -m py_compile ecup_matching/ml/v18_*.py ecup_matching/ml/run_v18_*.py ecup_matching/ml/v19_*.py ecup_matching/ml/run_v19_*.py
      - name: Run v19 gate plus inherited v18 smoke tests
        run: python3 -m pytest -q tests/test_v19_*.py tests/test_v18_*.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: v19-m1-smoke-${{ github.run_id }}
          path: /tmp/v19-m1-capability.json
          retention-days: 7
          if-no-files-found: warn
