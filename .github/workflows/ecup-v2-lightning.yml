name: E-CUP v2 Lightning GPU reranker

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v2-lightning.yml

permissions:
  contents: write

jobs:
  lightning-reranker:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
      TARGET_BRANCH: ecup-matching-2026
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact v2 GPU source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Verify repository before requesting credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r ecup_matching/requirements-ci.txt
          python -m pytest ecup_matching/tests -q
          python scripts/memory_policy.py
          test -n "${HF_TOKEN:-}" || { echo '::error::Missing HF_TOKEN Actions secret'; exit 1; }

      - name: Install bridge dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'cryptography>=43,<47' 'lightning-sdk>=0.2,<1'

      - name: Generate ephemeral RSA bridge key and publish public half only
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PRIVATE_KEY="${RUNNER_TEMP}/lightning-${BRIDGE_ID}.private.pem"
          REQUEST_PATH=".lightning-bridge/request-${BRIDGE_ID}.pem"
          RESPONSE_PATH=".lightning-bridge/response-${BRIDGE_ID}.b64"
          mkdir -p .lightning-bridge
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$PRIVATE_KEY" >/dev/null 2>&1
          openssl pkey -in "$PRIVATE_KEY" -pubout -out "$REQUEST_PATH" >/dev/null 2>&1
          chmod 600 "$PRIVATE_KEY"
          git config user.name 'ecup-lightning-bridge'
          git config user.email 'ecup-lightning-bridge@users.noreply.github.com'
          git add "$REQUEST_PATH"
          git commit -m "ci: publish ephemeral Lightning bridge public key ${BRIDGE_ID}"
          git push origin "HEAD:${TARGET_BRANCH}"
          {
            echo "bridge_id=$BRIDGE_ID"
            echo "private_key=$PRIVATE_KEY"
            echo "request_path=$REQUEST_PATH"
            echo "response_path=$RESPONSE_PATH"
            echo "ciphertext=${RUNNER_TEMP}/lightning-${BRIDGE_ID}.ciphertext.b64"
          } >> "$GITHUB_OUTPUT"
          echo "Ephemeral Lightning public key published for bridge $BRIDGE_ID"

      - name: Wait for RSA-OAEP encrypted credential response
        shell: bash
        env:
          RESPONSE_PATH: ${{ steps.bridge.outputs.response_path }}
          CIPHERTEXT: ${{ steps.bridge.outputs.ciphertext }}
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 180); do
            git fetch --quiet origin "$TARGET_BRANCH"
            if git cat-file -e "origin/${TARGET_BRANCH}:${RESPONSE_PATH}" 2>/dev/null; then
              git show "origin/${TARGET_BRANCH}:${RESPONSE_PATH}" > "$CIPHERTEXT"
              chmod 600 "$CIPHERTEXT"
              found=1
              break
            fi
            sleep 5
          done
          if [ "$found" -ne 1 ]; then
            echo '::error::Encrypted Lightning credential response was not received in time'
            exit 1
          fi
          test -s "$CIPHERTEXT"
          echo 'Encrypted Lightning credential response received'

      - name: Run Lightning GPU training through in-memory credential bridge
        shell: bash
        env:
          PRIVATE_KEY: ${{ steps.bridge.outputs.private_key }}
          CIPHERTEXT: ${{ steps.bridge.outputs.ciphertext }}
          BRIDGE_ID: ${{ steps.bridge.outputs.bridge_id }}
          OUT_DIR: ${{ runner.temp }}/lightning-v2-output
          RESULT_JSON: ${{ runner.temp }}/lightning-v2-result.json
        run: |
          set -euo pipefail
          python scripts/lightning_secure_runner.py \
            --private-key "$PRIVATE_KEY" \
            --ciphertext "$CIPHERTEXT" \
            --repo-url 'https://github.com/MakSoS1/Ansible_lab.git' \
            --branch "$TARGET_BRANCH" \
            --sha "$TARGET_SHA" \
            --output-dir "$OUT_DIR" \
            --studio-name "ecup-v2-${BRIDGE_ID}" \
            --result-json "$RESULT_JSON"
          test -f "$OUT_DIR/metrics.json"
          test -f "$OUT_DIR/model/config.json"
          test -f "$OUT_DIR/validation_predictions.parquet"

      - name: Validate GPU metrics
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/lightning-v2-output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          metrics = json.loads((Path(os.environ['OUT_DIR']) / 'metrics.json').read_text())
          assert metrics['data_report']['validation_item_overlap'] == 0
          score = float(metrics['selected_macro_average_precision'])
          assert math.isfinite(score) and 0.0 <= score <= 1.0
          assert len(metrics['stage1']['per_category_ap']) == 20
          if metrics['stage2'] is not None:
              assert len(metrics['stage2']['per_category_ap']) == 20
          print('selected_stage', metrics['selected_stage'])
          print('selected_macro_average_precision', score)
          print('delta_vs_v1', metrics['delta_vs_v1'])
          print('cuda_device', metrics['cuda_device'])
          PY

      - name: Upload reranker artifacts to private Hugging Face
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/lightning-v2-output
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          out = Path(os.environ['OUT_DIR'])
          repo = os.environ['HF_REPO_ID']
          remote = f"experiments/v2/reranker/{os.environ['TARGET_SHA'][:12]}"
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_folder(
              folder_path=str(out),
              path_in_repo=remote,
              repo_id=repo,
              repo_type='dataset',
              commit_message='Upload E-CUP v2 Lightning reranker artifacts',
          )
          visible = set(api.list_repo_files(repo_id=repo, repo_type='dataset'))
          required = [
              f'{remote}/metrics.json',
              f'{remote}/model/config.json',
              f'{remote}/validation_predictions.parquet',
          ]
          for path in required:
              if path not in visible:
                  raise RuntimeError(f'private HF verification failed: {path}')
              print('verified_private_hf', path)
          print('private_artifact_prefix', remote)
          PY

      - name: Upload non-secret GPU metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecup-v2-lightning-reranker-metrics
          path: |
            ${{ runner.temp }}/lightning-v2-output/metrics.json
            ${{ runner.temp }}/lightning-v2-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup credential material and downloaded model from runner
        if: always()
        shell: bash
        run: |
          rm -f "${{ steps.bridge.outputs.private_key }}" || true
          rm -f "${{ steps.bridge.outputs.ciphertext }}" || true
          rm -rf "${RUNNER_TEMP}/lightning-v2-output" || true
          rm -f "${RUNNER_TEMP}/lightning-v2-result.json" || true
