name: E-CUP v2 optimized runtime benchmark

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v2-rebenchmark.yml

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  ORGANIZER_IMAGE: odsai/ecup26-matching-baseline:1.0
  STRUCTURED_PREFIX: experiments/v2/structured/3ad39ca999e0

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - name: Verify optimized source
        run: |
          python -m pip install -r ecup_matching/requirements-ci.txt
          python -m pytest ecup_matching/tests -q
          python scripts/memory_policy.py
      - name: Require private HF token
        run: test -n "${HF_TOKEN:-}" || exit 1
      - name: Fetch retained v2 model and benchmark data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v2/model" "$RUNNER_TEMP/v2/data" "$RUNNER_TEMP/v2/pkg" "$RUNNER_TEMP/v2/bench"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          root=Path(os.environ['RUNNER_TEMP'])/'v2'; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; prefix=os.environ['STRUCTURED_PREFIX']
          for remote,target in {
            f'{prefix}/model.joblib':root/'model/model.joblib',
            f'{prefix}/manifest.json':root/'model/manifest.json',
            f'{prefix}/metrics.json':root/'model/metrics.json',
            'matches.parquet':root/'data/matches.parquet',
            'items_human.parquet':root/'data/items_human.parquet',
          }.items():
            src=Path(hf_hub_download(repo_id=repo,filename=remote,repo_type='dataset',token=token)); target.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(src,target)
          PY
      - name: Pull organizer image and build optimized ZIP
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ORGANIZER_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$RUNNER_TEMP/v2/model:/model:ro" -v "$RUNNER_TEMP/v2:/out" -w /workspace "$ORGANIZER_IMAGE" \
            python -m ecup_matching.build_submission_v2 --model /model/model.joblib --manifest /model/manifest.json --output /out/ecup-v2-submission.zip
          unzip -q "$RUNNER_TEMP/v2/ecup-v2-submission.zip" -d "$RUNNER_TEMP/v2/pkg"
      - name: Create 275k benchmark slice
        shell: bash
        run: |
          docker run --rm -i -v "$RUNNER_TEMP/v2/data:/data:ro" -v "$RUNNER_TEMP/v2/bench:/bench" "$ORGANIZER_IMAGE" python - <<'PY'
          import pandas as pd
          m=pd.read_parquet('/data/matches.parquet')[['id1','id2']].iloc[:275000].reset_index(drop=True)
          items=pd.read_parquet('/data/items_human.parquet'); ids=set(m.id1)|set(m.id2); items=items[items.id.isin(ids)]
          assert len(m)==275000
          m.to_parquet('/bench/matches.parquet',index=False); items.to_parquet('/bench/items.parquet',index=False)
          print('benchmark_pairs',len(m),'items',len(items))
          PY
      - name: Run optimized 275k benchmark offline
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker run --rm --network none -v "$RUNNER_TEMP/v2/pkg:/submission:ro" -v "$RUNNER_TEMP/v2/bench:/bench" -w /submission "$ORGANIZER_IMAGE" \
            python -u run.py --items_path /bench/items.parquet --matches_path /bench/matches.parquet --output_path /bench/prediction.csv
          end=$(date +%s); runtime=$((end-start)); echo "$runtime" > "$RUNNER_TEMP/v2/runtime.txt"
          docker run --rm --network none -i -v "$RUNNER_TEMP/v2/bench:/bench:ro" "$ORGANIZER_IMAGE" python - <<'PY'
          import numpy as np,pandas as pd
          p=pd.read_csv('/bench/prediction.csv');m=pd.read_parquet('/bench/matches.parquet')
          assert len(p)==len(m)==275000 and list(p.columns)==['id1','id2','predict']; assert p[['id1','id2']].equals(m); assert np.isfinite(p.predict).all() and p.predict.between(0,1).all()
          print('optimized_output_ok')
          PY
      - name: Record runtime and replace private v2 submit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from huggingface_hub import HfApi
          root=Path(os.environ['RUNNER_TEMP'])/'v2'; runtime=int((root/'runtime.txt').read_text()); metrics=json.loads((root/'model/metrics.json').read_text())
          payload={'benchmark_pairs':275000,'offline_runtime_seconds':runtime,'private_limit_seconds':780,'headroom_seconds':780-runtime,'headroom_fraction':(780-runtime)/780,'passes_25pct_headroom':runtime<=585,'submission_zip_bytes':(root/'ecup-v2-submission.zip').stat().st_size,'validation_macro_ap':metrics['selected_macro_average_precision'],'selected_candidate':metrics['selected_candidate'],'runtime_optimization':'single full legacy feature pass plus reverse-only fuzzy ratios','source_sha':os.environ['GITHUB_SHA']}
          path=root/'v2-package-metrics.json'; path.write_text(json.dumps(payload,indent=2)); print(json.dumps(payload,indent=2))
          if runtime>=780: raise SystemExit(f'runtime {runtime}s exceeds private limit')
          api=HfApi(token=os.environ['HF_TOKEN']);repo=os.environ['HF_REPO_ID']
          for local,remote in [(root/'ecup-v2-submission.zip','submissions/v2/ecup-v2-submission.zip'),(path,'submissions/v2/v2-package-metrics.json')]:
            api.upload_file(path_or_fileobj=str(local),path_in_repo=remote,repo_id=repo,repo_type='dataset',commit_message=f'Update optimized E-CUP v2 artifact: {remote}')
          visible=set(api.list_repo_files(repo_id=repo,repo_type='dataset'))
          assert 'submissions/v2/ecup-v2-submission.zip' in visible and 'submissions/v2/v2-package-metrics.json' in visible
          print('optimized_private_v2_verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecup-v2-optimized-runtime
          path: ${{ runner.temp }}/v2/v2-package-metrics.json
          retention-days: 7
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/v2"
