name: E-CUP v2 structured 2024 transfer

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v2-structured.yml

permissions:
  contents: read

jobs:
  train-v2-structured:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
      ECUP_BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
    steps:
      - name: Checkout v2 source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Run repository tests before expensive training
        run: |
          python -m pytest ecup_matching/tests -q
          python scripts/memory_policy.py

      - name: Require private HF token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo '::error::Missing HF_TOKEN Actions secret'; exit 1; }

      - name: Download organizer training data
        shell: bash
        env:
          DATA_DIR: ${{ runner.temp }}/ecup-v2-data
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR"
          for file in matches.parquet items_human.parquet matches_llm.parquet items.parquet; do
            echo "Downloading $file"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "$DATA_DIR/$file" "$ECUP_BASE_URL/$file"
            test -s "$DATA_DIR/$file"
          done
          du -h "$DATA_DIR"/*

      - name: Train v2a v2b v2c on fixed item-disjoint validation
        shell: bash
        env:
          DATA_DIR: ${{ runner.temp }}/ecup-v2-data
          OUT_DIR: ${{ runner.temp }}/ecup-v2-structured
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python -m ecup_matching.ml.train_v2_structured \
            --human-items "$DATA_DIR/items_human.parquet" \
            --human-matches "$DATA_DIR/matches.parquet" \
            --llm-matches "$DATA_DIR/matches_llm.parquet" \
            --full-items "$DATA_DIR/items.parquet" \
            --output-dir "$OUT_DIR" \
            --weak-presample-rows 450000 \
            --weak-final-rows 300000 \
            --transitive-cap 2000 \
            --chunk-size 25000 \
            --max-iter 350 \
            --hard-negative-boost 3.0

      - name: Validate v2 metrics and artifact contents
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/ecup-v2-structured
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          out = Path(os.environ['OUT_DIR'])
          metrics = json.loads((out / 'metrics.json').read_text())
          assert metrics['validation_item_overlap'] == 0
          assert len(metrics['candidates']) >= 3
          for c in metrics['candidates']:
              assert math.isfinite(c['macro_average_precision'])
              assert len(c['per_category_ap']) == 20
          assert (out / 'model.joblib').is_file()
          assert (out / 'manifest.json').is_file()
          assert (out / 'validation_predictions.parquet').is_file()
          print('selected_candidate', metrics['selected_candidate'])
          print('selected_macro_average_precision', metrics['selected_macro_average_precision'])
          print('delta_vs_v1', metrics['delta_vs_v1'])
          print('accepted_as_improvement', metrics['accepted_as_improvement'])
          for c in metrics['candidates']:
              print(c['candidate'], c['macro_average_precision'])
          PY

      - name: Upload v2 structured artifacts to private Hugging Face
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/ecup-v2-structured
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          out = Path(os.environ['OUT_DIR'])
          repo = os.environ['HF_REPO_ID']
          sha = os.environ['GITHUB_SHA'][:12]
          remote = f'experiments/v2/structured/{sha}'
          for name in ('model.joblib', 'manifest.json', 'metrics.json', 'metrics.md', 'validation_predictions.parquet'):
              api.upload_file(
                  path_or_fileobj=str(out / name),
                  path_in_repo=f'{remote}/{name}',
                  repo_id=repo,
                  repo_type='dataset',
                  commit_message=f'Upload E-CUP v2 structured artifact {name}',
              )
          files = set(api.list_repo_files(repo_id=repo, repo_type='dataset'))
          for name in ('model.joblib', 'manifest.json', 'metrics.json', 'metrics.md', 'validation_predictions.parquet'):
              path = f'{remote}/{name}'
              if path not in files:
                  raise RuntimeError(f'private HF verification failed: {path}')
              print('verified_private_hf', path)
          print('private_artifact_prefix', remote)
          PY

      - name: Upload non-model metrics as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecup-v2-structured-metrics
          path: |
            ${{ runner.temp }}/ecup-v2-structured/metrics.json
            ${{ runner.temp }}/ecup-v2-structured/metrics.md
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup raw data and private model from runner
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/ecup-v2-data"
          rm -rf "${RUNNER_TEMP}/ecup-v2-structured"
