name: E-CUP v20.2 public verify

on:
  push:
    branches: [ecup-v20-data-centric]
    paths:
      - v20_2_public_verify_request.json

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 45165e9f6a1e49728531b899e7644bece6b0a473

      - name: Publish start status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; token=os.environ['GH_TOKEN']; run=os.environ['GITHUB_RUN_ID']
          payload=json.dumps({'state':'pending','context':'ecup/v20.2-public-verify','description':'run '+run+' started','target_url':f'https://github.com/{repo}/actions/runs/{run}'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=payload,method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'v20-2-public-verify'})
          urllib.request.urlopen(req,timeout=30).read()

      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==8.4.2 \
            pandas==2.3.2 \
            pyarrow==21.0.0 \
            scikit-learn==1.7.1 \
            transformers==4.55.4 \
            huggingface-hub==0.34.4 \
            tokenizers==0.21.4 \
            safetensors==0.6.2 \
            torch==2.8.0

      - name: Verify frozen source and run tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "45165e9f6a1e49728531b899e7644bece6b0a473"
          python -m py_compile ecup_matching/ml/v20_*.py ecup_matching/ml/run_v20_*.py
          python -m pytest -q tests/test_v20_*.py

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: python
        run: |
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; token=os.environ['GH_TOKEN']; run=os.environ['GITHUB_RUN_ID']
          ok=os.environ.get('TEST_OUTCOME')=='success'
          payload=json.dumps({'state':'success' if ok else 'error','context':'ecup/v20.2-public-verify','description':'all v20 tests green' if ok else 'v20 public verification failed','target_url':f'https://github.com/{repo}/actions/runs/{run}'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=payload,method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'v20-2-public-verify'})
          urllib.request.urlopen(req,timeout=30).read()
