name: E-CUP v20 pull-request regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'ecup_matching/ml/v20_*.py'
      - 'ecup_matching/ml/run_v20_*.py'
      - 'tests/test_v20_*.py'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install v20 test dependencies
        run: python -m pip install -q pytest==8.4.2 numpy pandas scikit-learn pyarrow torch transformers safetensors
      - name: Compile v20 modules
        run: python -m py_compile ecup_matching/ml/v20_*.py ecup_matching/ml/run_v20_*.py
      - name: Run v20 regression suite
        run: python -m pytest -q tests/test_v20_*.py
