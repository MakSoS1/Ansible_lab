name: E-CUP v20.3 private Actions probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GPU_DISPATCH_TOKEN: ${{ secrets.GPU_DISPATCH_TOKEN }}
      GPU_DISPATCH_PAT: ${{ secrets.GPU_DISPATCH_PAT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      REPO_PAT: ${{ secrets.REPO_PAT }}
      TARGET_SHA: f96836bcd0621b314a9bfcb557bdd317a7796c93
    steps:
      - name: Query private gpu-dispatch v20.3 run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          candidates=['GPU_DISPATCH_TOKEN','GPU_DISPATCH_PAT','GH_PAT','GITHUB_PAT','PRIVATE_REPO_TOKEN','REPO_PAT']
          chosen=next((n for n in candidates if os.environ.get(n)),None)
          print('TOKEN_SOURCE='+str(chosen))
          if not chosen:
              raise SystemExit('NO_PRIVATE_REPO_TOKEN')
          token=os.environ[chosen]; target=os.environ['TARGET_SHA']; repo='MakSoS1/gpu-dispatch'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ecup-v20-private-probe'}
          url=f'https://api.github.com/repos/{repo}/actions/runs?branch=ecup-v20-executor&event=push&per_page=100'
          runs=json.loads(urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30).read()).get('workflow_runs',[])
          matches=[r for r in runs if r.get('head_sha')==target]
          print('MATCHES='+json.dumps([{k:r.get(k) for k in ('id','name','path','event','status','conclusion','run_number','created_at','updated_at','html_url')} for r in matches],sort_keys=True))
          if not matches:
              print('RECENT='+json.dumps([{k:r.get(k) for k in ('id','name','path','head_sha','status','conclusion','created_at','updated_at')} for r in runs[:20]],sort_keys=True))
              raise SystemExit('CANONICAL_V20_3_RUN_NOT_FOUND')
          run=next((r for r in matches if 'v20' in str(r.get('name','')).lower()),matches[0])
          rid=int(run['id'])
          jobs=json.loads(urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/jobs?per_page=100',headers=headers),timeout=30).read()).get('jobs',[])
          print('CANONICAL_RUN_ID='+str(rid))
          print('JOBS='+json.dumps([{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'started_at':j.get('started_at'),'completed_at':j.get('completed_at'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion'),'number':s.get('number')} for s in (j.get('steps') or [])]} for j in jobs],sort_keys=True))
          arts=json.loads(urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/artifacts?per_page=100',headers=headers),timeout=30).read()).get('artifacts',[])
