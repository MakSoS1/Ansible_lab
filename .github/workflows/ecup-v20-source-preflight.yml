name: E-CUP v20 exact corrected-source preflight

on:
  push:
    branches: [main]
    paths:
      - ecup_v20_source_preflight_request.json

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish start status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; run=os.environ['GITHUB_RUN_ID']; token=os.environ['GH_TOKEN']
          payload=json.dumps({'state':'pending','context':'ecup/v20-source-preflight','description':f'run {run} started','target_url':f'https://github.com/{repo}/actions/runs/{run}'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=payload,method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ecup-v20-preflight'})
          urllib.request.urlopen(req,timeout=30).read()
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 82535479f4322f1abf28936c624313fdc9ab6ef9
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install v20 test dependencies
        run: python -m pip install -q pytest==8.4.2 numpy pandas scikit-learn pyarrow torch transformers safetensors
      - name: Compile all v20 modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ecup_matching/ml/v20_*.py ecup_matching/ml/run_v20_*.py
      - name: Run complete v20 unit suite
        run: python -m pytest -q tests/test_v20_*.py
      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; run=os.environ['GITHUB_RUN_ID']; token=os.environ['GH_TOKEN']; outcome=os.environ['JOB_STATUS']
          payload=json.dumps({'state':'success' if outcome=='success' else 'failure','context':'ecup/v20-source-preflight','description':f'run {run} {outcome}','target_url':f'https://github.com/{repo}/actions/runs/{run}'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=payload,method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ecup-v20-preflight'})
          urllib.request.urlopen(req,timeout=30).read()
          PY
