name: E-CUP v21 LB-calibrated preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install -q pytest==8.4.2 numpy pandas scikit-learn
      - name: Compile v21 modules
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(ecup_matching/ml/v21_*.py ecup_matching/ml/run_v21_*.py)
          test ${#files[@]} -gt 0
          python -m py_compile "${files[@]}"
      - name: Run preregistered v21 tests
        run: python -m pytest -q tests/test_v21_public_calibration.py tests/test_v21_promotion.py
