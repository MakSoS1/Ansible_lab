name: E-CUP v21 exact source preflight

on:
  push:
    branches: [main]
    paths:
      - ecup_v21_source_preflight_request.json

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish preflight start status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; run=os.environ['GITHUB_RUN_ID']; token=os.environ['GH_TOKEN']
          payload=json.dumps({'state':'pending','context':'ecup/v21-source-preflight','description':f'run {run} started','target_url':f'https://github.com/{repo}/actions/runs/{run}'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=payload,method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ecup-v21-preflight'})
          urllib.request.urlopen(req,timeout=30).read()
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f4a6f0473109a0e777bf1a46b08df0c4389ff522
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install -q pytest==8.4.2 numpy pandas scikit-learn pyarrow
      - name: Compile exact v21 modules
        run: python -m py_compile ecup_matching/ml/v21_public_calibration.py ecup_matching/ml/v21_promotion.py ecup_matching/ml/v21_selection.py ecup_matching/ml/run_v21_anchor_proxy.py
      - name: Run all v21 unit tests
        run: python -m pytest -q tests/test_v21_public_calibration.py tests/test_v21_promotion.py tests/test_v21_selection.py
      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; run=os.environ['GITHUB_RUN_ID']; token=os.environ['GH_TOKEN']; outcome=os.environ.get('JOB_STATUS','success')
          state='success' if outcome=='success' else 'failure'
          payload=json.dumps({'state':state,'context':'ecup/v21-source-preflight','description':f'run {run} {outcome}','target_url':f'https://github.com/{repo}/actions/runs/{run}'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=payload,method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ecup-v21-preflight'})
          urllib.request.urlopen(req,timeout=30).read()
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
