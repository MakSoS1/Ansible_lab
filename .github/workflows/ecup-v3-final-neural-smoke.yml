name: E-CUP v3 FINAL neural execution smoke

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v3-final-neural-smoke.yml

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  STRUCTURED_PREFIX: experiments/v2/structured/3ad39ca999e0
  NEURAL_PREFIX: experiments/v3/neural/2d31cb18a06e
  ORGANIZER_IMAGE: odsai/ecup26-matching-baseline:1.0

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal fetch stack
        run: python -m pip install 'huggingface_hub>=1,<2'
      - name: Fetch private models and 1k data subset inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/smoke/structured" "$RUNNER_TEMP/smoke/neural/model" "$RUNNER_TEMP/smoke/data" "$RUNNER_TEMP/smoke/pkg"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          root=Path(os.environ['RUNNER_TEMP'])/'smoke'; api=HfApi(token=os.environ['HF_TOKEN']); repo=os.environ['HF_REPO_ID']; sp=os.environ['STRUCTURED_PREFIX']; np=os.environ['NEURAL_PREFIX']; visible=set(api.list_repo_files(repo_id=repo,repo_type='dataset'))
          scalar={f'{sp}/model.joblib':root/'structured/model.joblib',f'{sp}/manifest.json':root/'structured/manifest.json',f'{np}/manifest.json':root/'neural/manifest.json','matches.parquet':root/'data/matches.parquet','items_human.parquet':root/'data/items_human.parquet'}
          for remote,target in scalar.items():
            src=Path(hf_hub_download(repo_id=repo,repo_type='dataset',filename=remote,token=os.environ['HF_TOKEN'])); target.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(src,target)
          for remote in sorted(p for p in visible if p.startswith(f'{np}/model/')):
            rel=Path(remote).relative_to(f'{np}/model'); target=root/'neural/model'/rel; src=Path(hf_hub_download(repo_id=repo,repo_type='dataset',filename=remote,token=os.environ['HF_TOKEN'])); target.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(src,target)
          PY
      - name: Build ZIP and 1k benchmark in exact organizer image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ORGANIZER_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$RUNNER_TEMP/smoke/structured:/structured:ro" -v "$RUNNER_TEMP/smoke/neural:/neural:ro" -v "$RUNNER_TEMP/smoke:/out" -w /workspace "$ORGANIZER_IMAGE" \
            python -m ecup_matching.build_submission_v3 --structured-model /structured/model.joblib --structured-manifest /structured/manifest.json --neural-model-dir /neural/model --neural-manifest /neural/manifest.json --output /out/v3.zip
          unzip -q "$RUNNER_TEMP/smoke/v3.zip" -d "$RUNNER_TEMP/smoke/pkg"
          docker run --rm -i -v "$RUNNER_TEMP/smoke/data:/data:ro" -v "$RUNNER_TEMP/smoke:/out" "$ORGANIZER_IMAGE" python - <<'PY'
          import pandas as pd
          m=pd.read_parquet('/data/matches.parquet')[['id1','id2']].iloc[:1000].reset_index(drop=True); items=pd.read_parquet('/data/items_human.parquet'); ids=set(m.id1)|set(m.id2); items=items[items.id.isin(ids)]; m.to_parquet('/out/matches1k.parquet',index=False); items.to_parquet('/out/items1k.parquet',index=False)
          PY
      - name: Require real neural execution offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$RUNNER_TEMP/smoke/pkg:/submission:ro" -v "$RUNNER_TEMP/smoke:/bench" -w /submission "$ORGANIZER_IMAGE" \
            python -u run.py --items_path /bench/items1k.parquet --matches_path /bench/matches1k.parquet --output_path /bench/prediction.csv 2>&1 | tee "$RUNNER_TEMP/smoke/run.log"
          grep -F 'neural device=cpu rows=1,000' "$RUNNER_TEMP/smoke/run.log"
          grep -F 'neural_pairs=1,000' "$RUNNER_TEMP/smoke/run.log"
          python - <<'PY'
          import os,pandas as pd,numpy as np
          from pathlib import Path
          p=pd.read_csv(Path(os.environ['RUNNER_TEMP'])/'smoke/prediction.csv'); assert len(p)==1000 and p.predict.between(0,1).all() and np.isfinite(p.predict).all() and p.predict.nunique()>100
          print('final_neural_smoke_verified')
          PY
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/smoke"
