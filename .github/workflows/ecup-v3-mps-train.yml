name: E-CUP v3 free Apple MPS reranker training

on:
  workflow_dispatch:
    inputs:
      prepared_prefix:
        description: Private HF prefix containing prepared v3 parquet files
        required: false
        default: experiments/v3/prepared/e8fbebbdcf57
      stage1_steps:
        description: Stage-1 optimization steps
        required: false
        default: '2400'
      stage2_steps:
        description: Hard-negative fine-tune steps
        required: false
        default: '450'
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v3-mps-train.yml

permissions:
  contents: read

jobs:
  train-mps:
    runs-on: macos-15
    timeout-minutes: 330
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
      PREPARED_PREFIX: ${{ inputs.prepared_prefix || 'experiments/v3/prepared/e8fbebbdcf57' }}
      STAGE1_STEPS: ${{ inputs.stage1_steps || '2400' }}
      STAGE2_STEPS: ${{ inputs.stage2_steps || '450' }}
      PYTORCH_ENABLE_MPS_FALLBACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require private HF token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo '::error::Missing HF_TOKEN'; exit 1; }
      - name: Install MPS training dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'torch==2.9.1' \
            'transformers>=4.55,<5' \
            'huggingface_hub>=1.0,<2' \
            'pandas>=2.2,<3' \
            'pyarrow>=17,<24' \
            'scikit-learn>=1.5,<2' \
            'safetensors>=0.4,<1'
      - name: Verify Apple GPU before touching private training data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, platform, torch
          result = {
              'machine': platform.machine(),
              'torch': torch.__version__,
              'mps_built': bool(torch.backends.mps.is_built()),
              'mps_available': bool(torch.backends.mps.is_available()),
              'mps_device_count': int(torch.mps.device_count()),
          }
          print(json.dumps(result, indent=2))
          if platform.machine() != 'arm64' or not torch.backends.mps.is_available():
              raise RuntimeError(f'free GitHub Apple MPS GPU unavailable: {result}')
          a = torch.randn(1024, 1024, device='mps')
          b = torch.randn(1024, 1024, device='mps')
          _ = a @ b
          torch.mps.synchronize()
          print('mps_preflight_ok')
          PY
      - name: Download compact private prepared data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3-prepared" "$RUNNER_TEMP/v3-neural"
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          repo = os.environ['HF_REPO_ID']
          token = os.environ['HF_TOKEN']
          prefix = os.environ['PREPARED_PREFIX'].strip('/')
          root = Path(os.environ['RUNNER_TEMP']) / 'v3-prepared'
          names = [
              'train_examples.parquet',
              'validation_examples.parquet',
              'structured_validation_predictions.parquet',
              'manifest.json',
          ]
          for name in names:
              remote = f'{prefix}/{name}'
              local = hf_hub_download(
                  repo_id=repo,
                  repo_type='dataset',
                  filename=remote,
                  token=token,
                  local_dir=root,
              )
              print('downloaded_private', remote, 'bytes', Path(local).stat().st_size)
          PY
      - name: Train RuBERT-tiny2 and model-mine hard negatives on MPS
        shell: bash
        run: |
          set -euo pipefail
          python -m ecup_matching.ml.train_v3_reranker \
            --train "$RUNNER_TEMP/v3-prepared/$PREPARED_PREFIX/train_examples.parquet" \
            --validation "$RUNNER_TEMP/v3-prepared/$PREPARED_PREFIX/validation_examples.parquet" \
            --structured-validation "$RUNNER_TEMP/v3-prepared/$PREPARED_PREFIX/structured_validation_predictions.parquet" \
            --output-dir "$RUNNER_TEMP/v3-neural" \
            --model cointegrated/rubert-tiny2 \
            --max-length 160 \
            --train-batch-size 24 \
            --eval-batch-size 64 \
            --stage1-steps "$STAGE1_STEPS" \
            --stage2-steps "$STAGE2_STEPS" \
            --stage1-lr 2e-5 \
            --stage2-lr 8e-6 \
            --hard-negative-count 12000
      - name: Validate fixed-split result before upload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          import pandas as pd
          root = Path(os.environ['RUNNER_TEMP']) / 'v3-neural'
          metrics = json.loads((root / 'metrics.json').read_text())
          pred = pd.read_parquet(root / 'validation_predictions.parquet')
          assert metrics['accelerator'] == 'mps'
          assert metrics['validation_item_overlap'] == 0
          assert metrics['validation_rows'] == 73131
          assert len(pred) == 73131
          assert len(metrics['selected_per_category_ap']) == 20
          assert math.isfinite(metrics['selected_macro_average_precision'])
          assert pred['selected_score'].between(0.0, 1.0).all()
          assert (root / 'model' / 'model.safetensors').exists()
          print('selected_candidate', metrics['selected_candidate'])
          print('selected_macro_ap', metrics['selected_macro_average_precision'])
          print('delta_vs_v2', metrics['delta_vs_v2'])
          print('stage1_macro_ap', metrics['stage1_validation']['macro_average_precision'])
          print('stage2_macro_ap', metrics['stage2_validation']['macro_average_precision'])
          print('hard_negative_mining', metrics['hard_negative_mining'])
          print('training_seconds', metrics['total_seconds'])
          PY
      - name: Upload model, metrics and validation predictions to private HF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          repo = os.environ['HF_REPO_ID']
          token = os.environ['HF_TOKEN']
          sha = os.environ['GITHUB_SHA'][:12]
          prefix = f'experiments/v3/neural/{sha}'
          root = Path(os.environ['RUNNER_TEMP']) / 'v3-neural'
          api = HfApi(token=token)
          api.upload_folder(
              repo_id=repo,
              repo_type='dataset',
              folder_path=str(root),
              path_in_repo=prefix,
              commit_message=f'Store E-CUP v3 MPS reranker {sha}',
          )
          visible = set(api.list_repo_files(repo_id=repo, repo_type='dataset'))
          required = [
              f'{prefix}/metrics.json',
              f'{prefix}/manifest.json',
              f'{prefix}/validation_predictions.parquet',
              f'{prefix}/model/model.safetensors',
              f'{prefix}/model/config.json',
          ]
          for remote in required:
              if remote not in visible:
                  raise RuntimeError(f'private HF verification failed: {remote}')
              print('verified_private_hf', remote)
          print('neural_prefix', prefix)
          PY
      - name: Upload non-secret neural metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecup-v3-mps-neural-metrics
          path: |
            ${{ runner.temp }}/v3-neural/metrics.json
            ${{ runner.temp }}/v3-neural/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup private data and model from runner
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/v3-prepared" "$RUNNER_TEMP/v3-neural"
