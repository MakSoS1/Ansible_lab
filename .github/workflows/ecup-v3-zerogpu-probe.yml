name: E-CUP v3 ZeroGPU probe

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - ".github/workflows/ecup-v3-zerogpu-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPACE_REPO_ID: Maksim123321/ecup-2026-v3-reranker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current HF/Gradio clients
        run: python -m pip install --quiet 'huggingface_hub>=1.0,<2' 'gradio_client>=1.13,<3'
      - name: Require private HF write token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo '::error::Missing HF_TOKEN'; exit 1; }
      - name: Create private Space and request ZeroGPU only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["SPACE_REPO_ID"]
          api = HfApi(token=token)
          print("probe_space", repo_id)
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              private=True,
              exist_ok=True,
          )
          with tempfile.TemporaryDirectory(prefix="zerogpu-probe-") as tmp:
              root = Path(tmp)
              (root / "README.md").write_text(
                  "---\ntitle: E-CUP v3 private ZeroGPU probe\nsdk: gradio\napp_file: app.py\npinned: false\n---\n",
                  encoding="utf-8",
              )
              (root / "requirements.txt").write_text(
                  "gradio>=5,<7\nspaces>=0.42\ntorch>=2.8\n",
                  encoding="utf-8",
              )
              (root / "app.py").write_text(
                  '''import gradio as gr\nimport spaces\n\n@spaces.GPU(duration=10)\ndef probe():\n    import torch\n    return {\"cuda\": bool(torch.cuda.is_available()), \"device\": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None}\n\ndemo = gr.Interface(fn=probe, inputs=[], outputs=gr.JSON(), api_name=\"probe\")\ndemo.launch()\n''',
                  encoding="utf-8",
              )
              api.upload_folder(repo_id=repo_id, repo_type="space", folder_path=root)
          try:
              runtime = api.request_space_hardware(repo_id=repo_id, hardware="zero-a10g")
              print("requested_hardware", runtime.requested_hardware)
          except Exception as exc:
              print("ZEROGPU_REQUEST_FAILED", type(exc).__name__, str(exc))
              try:
                  api.pause_space(repo_id=repo_id)
              except Exception:
                  pass
              raise
          runtime = api.wait_for_space(repo_id=repo_id, timeout=600)
          print("space_stage", runtime.stage)
          print("space_hardware", runtime.hardware)
          print("space_requested_hardware", runtime.requested_hardware)
          if runtime.hardware != "zero-a10g" and runtime.requested_hardware != "zero-a10g":
              raise RuntimeError(f"ZeroGPU was not assigned: {runtime}")
          PY
      - name: Call private GPU endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import inspect
          from gradio_client import Client

          kwargs = {"src": os.environ["SPACE_REPO_ID"], "verbose": False}
          parameters = inspect.signature(Client).parameters
          if "token" in parameters:
              kwargs["token"] = os.environ["HF_TOKEN"]
          else:
              kwargs["hf_token"] = os.environ["HF_TOKEN"]
          client = Client(**kwargs)
          result = client.predict(api_name="/probe")
          print("zerogpu_probe_result", json.dumps(result, ensure_ascii=False))
          if not isinstance(result, dict) or not result.get("cuda"):
              raise RuntimeError(f"ZeroGPU endpoint did not expose CUDA: {result!r}")
          PY
      - name: Pause probe Space
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          try:
              HfApi(token=os.environ.get("HF_TOKEN")).pause_space(repo_id=os.environ["SPACE_REPO_ID"])
              print("probe_space_paused")
          except Exception as exc:
              print("probe_pause_skipped", type(exc).__name__)
          PY
