name: E-CUP v4 shrunk-blend diagnostic

on:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v4-shrunk-blend-diagnostic.yml

permissions:
  contents: read

jobs:
  blend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
      V3_VALIDATION: experiments/v3/neural/2d31cb18a06e/validation_predictions.parquet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install minimal stack
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=17,<24' 'scikit-learn>=1.5,<2' 'huggingface_hub>=0.34,<1'
      - name: Download frozen v3 validation predictions
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id=os.environ['HF_REPO_ID'], repo_type='dataset',
              filename=os.environ['V3_VALIDATION'], token=os.environ['HF_TOKEN'],
              local_dir=Path(os.environ['RUNNER_TEMP']) / 'v4blend',
          )
          print(path)
          PY
      - name: Evaluate global and shrinkage family
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from ecup_matching.ml.metrics import macro_average_precision
          from ecup_matching.ml.v3_selection import select_best_blend
          from ecup_matching.ml.train_v4_reranker import shrink_category_alphas

          root = Path(os.environ['RUNNER_TEMP']) / 'v4blend'
          path = root / os.environ['V3_VALIDATION']
          df = pd.read_parquet(path)
          required = {'target','category','selected_neural','v2b-weak-curriculum'}
          missing = required - set(df.columns)
          if missing:
              raise RuntimeError(f'missing frozen v3 validation columns: {sorted(missing)}')
          y = df['target'].to_numpy(float)
          category = df['category'].astype(str).to_numpy()
          structured = df['v2b-weak-curriculum'].to_numpy(float)
          neural = df['selected_neural'].to_numpy(float)
          grid = tuple(value / 40 for value in range(41))
          global_result = select_best_blend(structured, neural, y, category, alphas=grid)
          global_alpha = float(global_result['alpha_neural'])
          global_macro = float(global_result['macro_average_precision'])

          raw = {}
          support = {}
          for cat in sorted(set(category)):
              mask = category == cat
              local = select_best_blend(structured[mask], neural[mask], y[mask], category[mask], alphas=grid)
              raw[cat] = float(local['alpha_neural'])
              support[cat] = int(mask.sum())

          candidates = []
          for prior in (250, 500, 1000, 2000, 4000, 8000, 16000):
              alphas = shrink_category_alphas(raw, global_alpha=global_alpha, category_support=support, prior_strength=prior)
              score = structured.copy()
              for cat, alpha in alphas.items():
                  mask = category == cat
                  score[mask] = (1.0-alpha) * structured[mask] + alpha * neural[mask]
              macro, per = macro_average_precision(y, score, category)
              candidates.append({
                  'prior_strength': prior,
                  'macro_average_precision': float(macro),
                  'delta_vs_v3': float(macro - 0.5254642645846543),
                  'category_alphas': alphas,
                  'per_category_ap': per,
              })
          best = max(candidates, key=lambda x: x['macro_average_precision'])
          payload = {
              'version': 'v4-shrunk-blend-diagnostic',
              'validation_rows': int(len(df)),
              'global_alpha_neural_grid025': global_alpha,
              'global_macro_average_precision_grid025': global_macro,
              'retained_v3_macro_average_precision': 0.5254642645846543,
              'raw_category_alphas': raw,
              'category_support': support,
              'candidates': candidates,
              'best': best,
          }
          out = root / 'metrics.json'
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Upload safe diagnostic metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ecup-v4-shrunk-blend
          path: ${{ runner.temp }}/v4blend/metrics.json
          if-no-files-found: error
          retention-days: 7
