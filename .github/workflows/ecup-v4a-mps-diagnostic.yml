name: E-CUP v4a full-human MPS diagnostic

on:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v4a-mps-diagnostic.yml

permissions:
  contents: read

jobs:
  v4a-mps:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
      STRUCTURED_REMOTE: experiments/v3/prepared/13edb087498b/structured_validation_predictions.parquet
      MODEL_REPO: ai-forever/ruBert-base
      MODEL_REVISION: 43be4261797042e172adf7476c558734f3cbb2a0
      PYTORCH_ENABLE_MPS_FALLBACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pytest==9.1.1' \
            'torch==2.9.1' \
            'transformers==4.57.1' \
            'huggingface_hub>=0.34,<1' \
            'pandas>=2.2,<3' \
            'pyarrow>=17,<24' \
            'scikit-learn>=1.5,<2' \
            'safetensors>=0.4,<1'
      - name: Verify MPS and source
        run: |
          python -m pytest ecup_matching/tests -q
          python scripts/memory_policy.py
          python - <<'PY'
          import platform, torch
          print('machine', platform.machine())
          print('mps_available', torch.backends.mps.is_available())
          assert platform.machine() == 'arm64'
          assert torch.backends.mps.is_available()
          torch.mps.empty_cache()
          x = torch.ones(64, 64, device='mps')
          y = x + x
          torch.mps.synchronize()
          assert float(y[0, 0].cpu()) == 2.0
          del x, y
          torch.mps.empty_cache()
          print('v4a_mps_preflight_ok')
          PY
      - name: Download authoritative human data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v4a/raw" "$RUNNER_TEMP/v4a/prepared" "$RUNNER_TEMP/v4a/model-base" "$RUNNER_TEMP/v4a/out"
          curl --fail --location --retry 3 \
            'https://storage.yandexcloud.net/ozon-ecup-2026/Matching/items_human.parquet' \
            --output "$RUNNER_TEMP/v4a/raw/items_human.parquet"
          curl --fail --location --retry 3 \
            'https://storage.yandexcloud.net/ozon-ecup-2026/Matching/matches.parquet' \
            --output "$RUNNER_TEMP/v4a/raw/matches.parquet"
      - name: Prepare complete human neural curriculum
        run: |
          python -m ecup_matching.v3_prepare \
            --human-only \
            --human-items "$RUNNER_TEMP/v4a/raw/items_human.parquet" \
            --human-matches "$RUNNER_TEMP/v4a/raw/matches.parquet" \
            --output-dir "$RUNNER_TEMP/v4a/prepared" \
            --max-train-rows 1000000 \
            --max-attrs 10 \
            --max-chars 700
      - name: Download frozen structured validation and exact base model
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download, snapshot_download
          root = Path(os.environ['RUNNER_TEMP']) / 'v4a'
          hf_hub_download(
              repo_id=os.environ['HF_REPO_ID'], repo_type='dataset',
              filename=os.environ['STRUCTURED_REMOTE'], token=os.environ['HF_TOKEN'],
              local_dir=root / 'private',
          )
          snapshot_download(
              repo_id=os.environ['MODEL_REPO'], revision=os.environ['MODEL_REVISION'],
              local_dir=root / 'model-base',
              allow_patterns=['config.json','model.safetensors','pytorch_model.bin','tokenizer.json','tokenizer_config.json','vocab.txt','special_tokens_map.json'],
          )
          print('exact_model_revision', os.environ['MODEL_REVISION'])
          PY
      - name: Train stronger v4a encoder on MPS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, os, time
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from ecup_matching.ml.metrics import macro_average_precision
          from ecup_matching.ml.train_v3_reranker import (
              _predict, _select_accelerator, _set_seed, _train_steps,
          )
          from ecup_matching.ml.train_reranker_v2 import _require_torch_transformers
          from ecup_matching.ml.v3_selection import select_best_blend

          root = Path(os.environ['RUNNER_TEMP']) / 'v4a'
          train = pd.read_parquet(root / 'prepared/train_examples.parquet')
          valid = pd.read_parquet(root / 'prepared/validation_examples.parquet')
          structured_path = root / 'private' / os.environ['STRUCTURED_REMOTE']
          structured = pd.read_parquet(structured_path)
          key = ['id1','id2']
          joined = valid[key + ['target','category']].merge(
              structured[key + ['v2b-weak-curriculum']], on=key, how='left', validate='one_to_one'
          )
          assert len(joined) == 73131
          assert not joined['v2b-weak-curriculum'].isna().any()

          torch, _, _, AutoModelForSequenceClassification, AutoTokenizer, _ = _require_torch_transformers()
          accelerator = _select_accelerator(torch)
          assert accelerator == 'mps'
          device = torch.device('mps')
          _set_seed(torch, 2026)
          torch.mps.empty_cache()
          tokenizer = AutoTokenizer.from_pretrained(root / 'model-base', local_files_only=True)
          model = AutoModelForSequenceClassification.from_pretrained(
              root / 'model-base', num_labels=1, ignore_mismatched_sizes=True, local_files_only=True
          )
          model.to(device)
          started = time.perf_counter()
          training = _train_steps(
              model, tokenizer, train,
              torch=torch, device=device, max_length=128, batch_size=2,
              learning_rate=1.5e-5, max_steps=6000, seed=2026,
          )
          torch.mps.empty_cache()
          neural = _predict(
              model, tokenizer, valid,
              torch=torch, device=device, max_length=128, batch_size=8,
          )
          target = joined['target'].to_numpy(float)
          category = joined['category'].astype(str).to_numpy()
          structured_score = joined['v2b-weak-curriculum'].to_numpy(float)
          neural_macro, neural_per = macro_average_precision(target, neural, category)
          blend = select_best_blend(
              structured_score, neural, target, category,
              alphas=(0.0,0.15,0.30,0.45,0.60,0.75,0.90,1.0),
          )
          score = np.asarray(blend['scores'], dtype=float)
          selected_macro, selected_per = macro_average_precision(target, score, category)
          out = root / 'out'
          model.save_pretrained(out / 'model', safe_serialization=True)
          tokenizer.save_pretrained(out / 'model')
          pd.DataFrame({
              'id1': joined['id1'], 'id2': joined['id2'], 'target': target,
              'category': category, 'neural': neural, 'selected_score': score,
          }).to_parquet(out / 'validation_predictions.parquet', index=False)
          payload = {
              'version': 'v4a-mps-diagnostic',
              'source_sha': os.environ['GITHUB_SHA'],
              'model': os.environ['MODEL_REPO'],
              'model_revision': os.environ['MODEL_REVISION'],
              'accelerator': 'mps',
              'train_rows': int(len(train)),
              'validation_rows': int(len(valid)),
              'validation_item_overlap': 0,
              'max_length': 128,
              'batch_size': 2,
              'steps': 6000,
              'training': training,
              'neural_macro_ap': float(neural_macro),
              'neural_per_category_ap': neural_per,
              'global_alpha_neural': float(blend['alpha_neural']),
              'selected_macro_average_precision': float(selected_macro),
              'selected_per_category_ap': selected_per,
              'delta_vs_v3': float(selected_macro - 0.5254642645846543),
              'beats_v3': bool(selected_macro > 0.5254642645846543),
              'seconds': float(time.perf_counter() - started),
          }
          (out / 'metrics.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Upload diagnostic privately
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          root = Path(os.environ['RUNNER_TEMP']) / 'v4a/out'
          prefix = f"experiments/v4/mps-diagnostic/{os.environ['GITHUB_SHA'][:12]}"
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_folder(
              repo_id=os.environ['HF_REPO_ID'], repo_type='dataset',
              folder_path=str(root), path_in_repo=prefix,
              commit_message=f"Store E-CUP v4a MPS diagnostic {os.environ['GITHUB_SHA'][:12]}",
          )
          print('private_prefix', prefix)
          PY
      - name: Upload safe metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ecup-v4a-mps-diagnostic
          path: ${{ runner.temp }}/v4a/out/metrics.json
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/v4a"
