name: E-CUP v5 attribute schema audit
on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v5-attribute-schema-audit.yml
      - ecup_matching/attribute_schema_audit.py
permissions: {contents: read}
env:
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Verify audit contract
        run: python -m pytest ecup_matching/tests/test_attribute_schema_audit.py -q
      - name: Download human item metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
      - name: Audit raw attribute JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m ecup_matching.attribute_schema_audit \
            --items "$RUNNER_TEMP/data/items_human.parquet" \
            --output "$RUNNER_TEMP/out/attribute-schema-audit.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'out'/'attribute-schema-audit.json').read_text())
          print('rows',report['rows'])
          print('parse_success_rate',report['parse_success_rate'])
          print('top_level_types',report['top_level_types'])
          print('list_dict_item_rate',report['list_dict_item_rate'])
          print('leaf_collision_item_rate',report['leaf_collision_item_rate'])
          print('typed_quantity_item_rate',report['typed_quantity_item_rate'])
          print('top_colliding_leaf_keys',report['top_colliding_leaf_keys'][:20])
          print('typed_dimensions',report['typed_dimensions'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecup-v5-attribute-schema-audit
          path: ${{ runner.temp }}/out/attribute-schema-audit.json
          retention-days: 14
      - if: always()
        run: rm -rf "$RUNNER_TEMP/data" "$RUNNER_TEMP/out"
