name: E-CUP v5 build best submit

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v5-build-best-submit.yml
      - ecup_matching/build_submission_v5.py
      - ecup_matching/submission/predict_v5.py
      - ecup_matching/submission/run_v5.py
      - ecup_matching/ml/train_v5_production_structured.py
      - ecup_matching/ml/train_v5_production_contrastive.py
      - ecup_matching/ml/train_v5_production_teacher.py
      - ecup_matching/ml/v5_production.py
      - ecup_matching/ml/v5_category_specialists.py
      - ecup_matching/ml/v5_explicit_attributes.py

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
  LEGACY_COMMIT: cb350b4e7ba6
  CONTRASTIVE_MODEL_ID: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  CONTRASTIVE_MODEL_REVISION: e8f8c21
  TEACHER_MODEL_ID: ai-forever/ruBert-base
  TEACHER_MODEL_REVISION: 43be4261797042e172adf7476c558734f3cbb2a0

jobs:
  structured:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Build exact legacy runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/legacy/legacy_ecup"
          mkdir -p "$root/ml"
          : > "$root/__init__.py"
          : > "$root/ml/__init__.py"
          for file in textnorm.py features.py category_attrs.py features_v2.py v5_item_text.py v5_sparse.py; do
            git show "$LEGACY_COMMIT:ecup_matching/ml/$file" > "$root/ml/$file"
          done
      - name: Download sealed development inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
          for file in matches.parquet items_human.parquet matches_llm.parquet items.parquet; do
            curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/$file" "$BASE_URL/$file"
            test -s "$RUNNER_TEMP/data/$file"
          done
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          root=os.environ['RUNNER_TEMP']; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; prefix=os.environ['VALIDATION_PREFIX']
          for name in ('split-manifest.json','development-oof.parquet'):
              hf_hub_download(repo_id=repo,repo_type='dataset',filename=f'{prefix}/{name}',token=token,local_dir=os.path.join(root,'private'))
          PY
      - name: Train persistent structured bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m ecup_matching.ml.train_v5_production_structured \
            --human-items "$RUNNER_TEMP/data/items_human.parquet" \
            --full-items "$RUNNER_TEMP/data/items.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --weak-matches "$RUNNER_TEMP/data/matches_llm.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --base-oof "$RUNNER_TEMP/private/$VALIDATION_PREFIX/development-oof.parquet" \
            --legacy-package-dir "$RUNNER_TEMP/legacy/legacy_ecup" \
            --output "$RUNNER_TEMP/out/model_v5_structured.joblib" \
            --expected-split-sha "$SPLIT_SHA"
          ls -lh "$RUNNER_TEMP/out/model_v5_structured.joblib"
      - uses: actions/upload-artifact@v4
        with:
          name: v5-prod-structured
          path: |
            ${{ runner.temp }}/out/model_v5_structured.joblib
            ${{ runner.temp }}/legacy/legacy_ecup
          retention-days: 3

  contrastive:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTORCH_ENABLE_MPS_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install neural dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<3' 'pandas<3' 'pyarrow<24' 'scikit-learn<2' 'huggingface_hub>=1.0,<2' 'torch>=2.3' 'transformers>=4.45,<6'
      - name: Verify MPS and build legacy runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          print('mps_available',torch.backends.mps.is_available())
          assert torch.backends.mps.is_available()
          PY
          root="$RUNNER_TEMP/legacy/legacy_ecup"; mkdir -p "$root/ml"; : > "$root/__init__.py"; : > "$root/ml/__init__.py"
          for file in textnorm.py features.py category_attrs.py features_v2.py v5_item_text.py v5_sparse.py; do git show "$LEGACY_COMMIT:ecup_matching/ml/$file" > "$root/ml/$file"; done
      - name: Download data, sealed split and pinned base model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/model" "$RUNNER_TEMP/out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, snapshot_download
          root=os.environ['RUNNER_TEMP']; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; prefix=os.environ['VALIDATION_PREFIX']
          for name in ('split-manifest.json','development-oof.parquet'):
              hf_hub_download(repo_id=repo,repo_type='dataset',filename=f'{prefix}/{name}',token=token,local_dir=os.path.join(root,'private'))
          snapshot_download(repo_id=os.environ['CONTRASTIVE_MODEL_ID'],revision=os.environ['CONTRASTIVE_MODEL_REVISION'],local_dir=os.path.join(root,'model'),allow_patterns=['*.json','*.safetensors','*.model','*.txt'])
          PY
      - name: Train production contrastive model
        shell: bash
        run: |
          set -euo pipefail
          python -m ecup_matching.ml.train_v5_production_contrastive \
            --items "$RUNNER_TEMP/data/items_human.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --base-oof "$RUNNER_TEMP/private/$VALIDATION_PREFIX/development-oof.parquet" \
            --legacy-package-dir "$RUNNER_TEMP/legacy/legacy_ecup" \
            --model-dir "$RUNNER_TEMP/model" \
            --output-dir "$RUNNER_TEMP/out" \
            --expected-split-sha "$SPLIT_SHA" \
            --device mps --batch-size 96 --max-steps 800
          du -sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: v5-prod-contrastive
          path: ${{ runner.temp }}/out
          retention-days: 3

  teacher:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTORCH_ENABLE_MPS_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install neural dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<3' 'pandas<3' 'pyarrow<24' 'scikit-learn<2' 'huggingface_hub>=1.0,<2' 'torch>=2.3' 'transformers>=4.45,<6'
      - name: Verify MPS and build legacy runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          print('mps_available',torch.backends.mps.is_available())
          assert torch.backends.mps.is_available()
          PY
          root="$RUNNER_TEMP/legacy/legacy_ecup"; mkdir -p "$root/ml"; : > "$root/__init__.py"; : > "$root/ml/__init__.py"
          for file in textnorm.py features.py category_attrs.py features_v2.py v5_item_text.py v5_sparse.py; do git show "$LEGACY_COMMIT:ecup_matching/ml/$file" > "$root/ml/$file"; done
      - name: Download data, sealed split and pinned base model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/model" "$RUNNER_TEMP/out"
          for file in matches.parquet items_human.parquet matches_llm.parquet items.parquet; do
            curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/$file" "$BASE_URL/$file"
            test -s "$RUNNER_TEMP/data/$file"
          done
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, snapshot_download
          root=os.environ['RUNNER_TEMP']; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; prefix=os.environ['VALIDATION_PREFIX']
          for name in ('split-manifest.json','development-oof.parquet'):
              hf_hub_download(repo_id=repo,repo_type='dataset',filename=f'{prefix}/{name}',token=token,local_dir=os.path.join(root,'private'))
          snapshot_download(repo_id=os.environ['TEACHER_MODEL_ID'],revision=os.environ['TEACHER_MODEL_REVISION'],local_dir=os.path.join(root,'model'),allow_patterns=['*.json','*.safetensors','*.model','*.txt'])
          PY
      - name: Train production field-aware teacher
        shell: bash
        run: |
          set -euo pipefail
          python -m ecup_matching.ml.train_v5_production_teacher \
            --human-items "$RUNNER_TEMP/data/items_human.parquet" \
            --full-items "$RUNNER_TEMP/data/items.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --weak-matches "$RUNNER_TEMP/data/matches_llm.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --base-oof "$RUNNER_TEMP/private/$VALIDATION_PREFIX/development-oof.parquet" \
            --legacy-package-dir "$RUNNER_TEMP/legacy/legacy_ecup" \
            --model-dir "$RUNNER_TEMP/model" \
            --output-dir "$RUNNER_TEMP/out" \
            --expected-split-sha "$SPLIT_SHA" \
            --device mps --max-steps 800
          du -sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: v5-prod-teacher
          path: ${{ runner.temp }}/out
          retention-days: 3

  package:
    needs: [structured, contrastive, teacher]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: v5-prod-structured
          path: ${{ runner.temp }}/artifacts/structured
      - uses: actions/download-artifact@v4
        with:
          name: v5-prod-contrastive
          path: ${{ runner.temp }}/artifacts/contrastive
      - uses: actions/download-artifact@v4
        with:
          name: v5-prod-teacher
          path: ${{ runner.temp }}/artifacts/teacher
      - name: Full test suite before packaging
        run: python -m pytest ecup_matching/tests -q
      - name: Build final submission ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final"
          python -m ecup_matching.build_submission_v5 \
            --structured-model "$RUNNER_TEMP/artifacts/structured/model_v5_structured.joblib" \
            --contrastive-model-dir "$RUNNER_TEMP/artifacts/contrastive" \
            --teacher-model-dir "$RUNNER_TEMP/artifacts/teacher" \
            --legacy-runtime-dir "$RUNNER_TEMP/artifacts/structured/legacy_ecup" \
            --output "$RUNNER_TEMP/final/ecup-v5-best-submission.zip"
          sha256sum "$RUNNER_TEMP/final/ecup-v5-best-submission.zip" | tee "$RUNNER_TEMP/final/SHA256SUMS.txt"
          ls -lh "$RUNNER_TEMP/final/ecup-v5-best-submission.zip"
      - name: Prepare organizer smoke inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-out" "$RUNNER_TEMP/submission"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/smoke/matches-full.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/smoke/items-full.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os, pandas as pd
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'smoke'
          pairs=pd.read_parquet(root/'matches-full.parquet',columns=['id1','id2']).head(32).copy()
          ids=set(pairs.id1)|set(pairs.id2)
          items=pd.read_parquet(root/'items-full.parquet',columns=['id','name','attributes','category'])
          items=items[items.id.isin(ids)].copy()
          assert ids <= set(items.id)
          pairs.to_parquet(root/'matches.parquet',index=False)
          items.to_parquet(root/'items.parquet',index=False)
          PY
          unzip -q "$RUNNER_TEMP/final/ecup-v5-best-submission.zip" -d "$RUNNER_TEMP/submission"
      - name: Exact organizer-image offline smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,size=2g \
            -v "$RUNNER_TEMP/submission:/submission:ro" \
            -v "$RUNNER_TEMP/smoke:/data:ro" \
            -v "$RUNNER_TEMP/smoke-out:/out:rw" \
            odsai/ecup26-matching-baseline:1.0 \
            python -u /submission/run.py \
              --output_path /out/submit.csv \
              --items_path /data/items.parquet \
              --matches_path /data/matches.parquet
          python - <<'PY'
          import os, numpy as np, pandas as pd
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          inp=pd.read_parquet(root/'smoke'/'matches.parquet',columns=['id1','id2'])
          out=pd.read_csv(root/'smoke-out'/'submit.csv')
          assert list(out.columns)==['id1','id2','predict']
          assert len(out)==len(inp)==32
          assert out[['id1','id2']].equals(inp[['id1','id2']])
          score=out.predict.to_numpy(float)
          assert np.isfinite(score).all() and ((score>=0)&(score<=1)).all()
          assert len(np.unique(score))>1
          print('organizer_smoke_rows',len(out),'unique_predictions',len(np.unique(score)))
          PY
      - name: Persist canonical ZIP privately
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from huggingface_hub import HfApi
          root=Path(os.environ['RUNNER_TEMP'])/'final'; path=root/'ecup-v5-best-submission.zip'
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          prefix=f'submissions/v5-best/canonical/{digest}'
          api=HfApi(token=os.environ['HF_TOKEN'])
          for name in ('ecup-v5-best-submission.zip','SHA256SUMS.txt'):
              api.upload_file(path_or_fileobj=str(root/name),path_in_repo=f'{prefix}/{name}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'Freeze v5 best submit {digest[:12]}')
          print('canonical_prefix',prefix)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecup-v5-best-submission
          path: |
            ${{ runner.temp }}/final/ecup-v5-best-submission.zip
            ${{ runner.temp }}/final/SHA256SUMS.txt
          retention-days: 14
