name: E-CUP v5 category-shrunk HGB equal-rank fusion

on:
  push:
    branches: [ecup-v5-meta-060]
    paths:
      - .github/workflows/ecup-v5-category-hgb-fusion.yml
      - ecup_matching/ml/run_v5_category_hgb_fusion.py

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  CATEGORY_PREFIX: experiments/v5/category-shrunk/efa629cc0435
  HGB_PREFIX: experiments/v5/hgb-meta-stack/84a934484619
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching

jobs:
  fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - name: Install CI stack
        run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Verify metric contract
        run: python -m pytest ecup_matching/tests/test_metrics.py -q
      - name: Download immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          root=os.environ['RUNNER_TEMP']; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']
          for filename in (
              f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",
              f"{os.environ['CATEGORY_PREFIX']}/v5-category-shrunk-oof.parquet",
              f"{os.environ['HGB_PREFIX']}/v5-hgb-stack-oof.parquet",
          ):
              print(hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=os.path.join(root,'private')))
          PY
      - name: Score frozen equal-rank fusion
        shell: bash
        run: |
          python -u -m ecup_matching.ml.run_v5_category_hgb_fusion \
            --items "$RUNNER_TEMP/data/items_human.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --category-shrunk-oof "$RUNNER_TEMP/private/$CATEGORY_PREFIX/v5-category-shrunk-oof.parquet" \
            --hgb-oof "$RUNNER_TEMP/private/$HGB_PREFIX/v5-hgb-stack-oof.parquet" \
            --output-dir "$RUNNER_TEMP/out" \
            --expected-split-sha "$SPLIT_SHA"
      - name: Print gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'out'/'v5-category-hgb-fusion-metrics.json').read_text())
          print('category_shrunk',m['category_shrunk_macro_ap'])
          print('hgb',m['hgb_stack_macro_ap'])
          print('equal_rank_fusion',m['equal_rank_fusion_macro_ap'])
          print('delta_vs_category_shrunk',m['delta_vs_category_shrunk'])
          print('keep',m['keep'])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v5-category-hgb-equal-rank-fusion
          path: |
            ${{ runner.temp }}/out/v5-category-hgb-fusion-metrics.json
            ${{ runner.temp }}/out/v5-category-hgb-fusion-oof.parquet
          if-no-files-found: error
          retention-days: 14
      - name: Persist privately
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          out=Path(os.environ['RUNNER_TEMP'])/'out'; api=HfApi(token=os.environ['HF_TOKEN'])
          prefix=f"experiments/v5/category-hgb-fusion/{os.environ['GITHUB_SHA'][:12]}"
          for name in ('v5-category-hgb-fusion-metrics.json','v5-category-hgb-fusion-oof.parquet'):
              api.upload_file(path_or_fileobj=str(out/name),path_in_repo=f'{prefix}/{name}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'Store v5 category-HGB fusion {name}')
          print('private_prefix',prefix)
          PY
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
