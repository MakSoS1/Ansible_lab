name: E-CUP v5 category-shrunk final submit

on:
  push:
    branches: [ecup-v5-meta-060]
    paths:
      - .github/workflows/ecup-v5-category-shrunk-final-submit.yml
      - ecup_matching/ml/v5_category_shrunk.py
      - ecup_matching/ml/run_v5_category_shrunk_production.py
      - ecup_matching/ml/v5_production.py
      - ecup_matching/submission/predict_v5.py
      - ecup_matching/submission/run_v5.py
      - ecup_matching/tests/test_v5_category_shrunk.py
      - ecup_matching/tests/test_v5_production.py

permissions:
  contents: read
  actions: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  ANCHOR_PREFIX: experiments/v5/fixed-blend/8a017cc12776
  TYPED_FUSION_PREFIX: experiments/v5/typed-explicit-fusion/681ce53c6967
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
  FALLBACK_ARTIFACT_ID: '9112337546'
  FALLBACK_INNER_ZIP: ecup-v5-six-signal-0.5975445721-submission.zip
  FINAL_NAME: ecup-v5-category-shrunk-0.6009542418-submission.zip
  HF_SUBMISSION_PREFIX: submissions/v5/0.6009542418

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Install CI stack
        run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Verify selected ensemble contracts
        run: |
          python -m pytest \
            ecup_matching/tests/test_v5_category_shrunk.py \
            ecup_matching/tests/test_v5_production.py \
            ecup_matching/tests/test_metrics.py -q

      - name: Download immutable development inputs and OOF sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/final" "$RUNNER_TEMP/fallback" "$RUNNER_TEMP/submission" "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          root=os.environ['RUNNER_TEMP']; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']
          for filename in (
              f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",
              f"{os.environ['ANCHOR_PREFIX']}/v5-fixed-blend-oof.parquet",
              f"{os.environ['TYPED_FUSION_PREFIX']}/v5-typed-explicit-fusion-oof.parquet",
          ):
              print(hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=os.path.join(root,'private')))
          PY

      - name: Fit deterministic production category weights
        shell: bash
        run: |
          set -euo pipefail
          python -u -m ecup_matching.ml.run_v5_category_shrunk_production \
            --items "$RUNNER_TEMP/data/items_human.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --anchor-oof "$RUNNER_TEMP/private/$ANCHOR_PREFIX/v5-fixed-blend-oof.parquet" \
            --typed-fusion-oof "$RUNNER_TEMP/private/$TYPED_FUSION_PREFIX/v5-typed-explicit-fusion-oof.parquet" \
            --output "$RUNNER_TEMP/final/model_v5_category_shrunk.json" \
            --expected-split-sha "$SPLIT_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'final'/'model_v5_category_shrunk.json'
          m=json.loads(p.read_text(encoding='utf-8'))
          assert abs(m['strict_selected_oof_macro_ap']-0.60095424180184) < 1e-15
          assert len(m['category_weights']) == 20
          assert m['prior_strength'] == 8000.0
          assert m['selection_gold_metric_opened'] is False
          print('global_weights',m['global_weights'])
          print('categories',len(m['category_weights']))
          PY

      - name: Download exact verified six-signal fallback
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$FALLBACK_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/fallback/actions-artifact.zip"
          unzip -q "$RUNNER_TEMP/fallback/actions-artifact.zip" -d "$RUNNER_TEMP/fallback/outer"
          test -f "$RUNNER_TEMP/fallback/outer/$FALLBACK_INNER_ZIP"
          observed="$(sha256sum "$RUNNER_TEMP/fallback/outer/$FALLBACK_INNER_ZIP" | awk '{print $1}')"
          expected="ee6fec40fe7e79095c33b5a2ed8a1c6cb40e01c3a8e90850c7459d5f1afad06e"
          echo "fallback_inner_sha256=$observed"
          test "$observed" = "$expected"
          unzip -q "$RUNNER_TEMP/fallback/outer/$FALLBACK_INNER_ZIP" -d "$RUNNER_TEMP/submission"

      - name: Patch only final fusion runtime and weights
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/submission/metadata.json"
          test -f "$RUNNER_TEMP/submission/run.py"
          test -f "$RUNNER_TEMP/submission/ecup_matching/ml/v5_production.py"
          test -f "$RUNNER_TEMP/submission/ecup_matching/submission/predict_v5.py"
          test -f "$RUNNER_TEMP/submission/model_v5_structured.joblib"
          test -d "$RUNNER_TEMP/submission/model_v5_contrastive"
          test -d "$RUNNER_TEMP/submission/model_v5_teacher"
          cp ecup_matching/ml/v5_production.py "$RUNNER_TEMP/submission/ecup_matching/ml/v5_production.py"
          cp ecup_matching/submission/predict_v5.py "$RUNNER_TEMP/submission/ecup_matching/submission/predict_v5.py"
          cp ecup_matching/submission/run_v5.py "$RUNNER_TEMP/submission/run.py"
          cp "$RUNNER_TEMP/final/model_v5_category_shrunk.json" "$RUNNER_TEMP/submission/model_v5_category_shrunk.json"
          python -m py_compile \
            "$RUNNER_TEMP/submission/run.py" \
            "$RUNNER_TEMP/submission/ecup_matching/ml/v5_production.py" \
            "$RUNNER_TEMP/submission/ecup_matching/submission/predict_v5.py"
          cd "$RUNNER_TEMP/submission"
          zip -qr "$RUNNER_TEMP/final/$FINAL_NAME" .
          cd - >/dev/null
          unzip -t "$RUNNER_TEMP/final/$FINAL_NAME" >/dev/null
          sha256sum "$RUNNER_TEMP/final/$FINAL_NAME" | tee "$RUNNER_TEMP/final/SHA256SUMS.txt"
          ls -lh "$RUNNER_TEMP/final/$FINAL_NAME"

      - name: Prepare exact smoke input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          root=Path(os.environ['RUNNER_TEMP'])
          pairs=pd.read_parquet(root/'data'/'matches.parquet',columns=['id1','id2']).head(64).copy()
          ids=set(pairs.id1.tolist()) | set(pairs.id2.tolist())
          items=pd.read_parquet(root/'data'/'items_human.parquet',columns=['id','name','attributes','category'])
          items=items[items.id.isin(ids)].copy()
          assert ids <= set(items.id.tolist())
          pairs.to_parquet(root/'smoke'/'matches.parquet',index=False)
          items.to_parquet(root/'smoke'/'items.parquet',index=False)
          PY

      - name: Exact organizer-image offline smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,size=2g \
            -v "$RUNNER_TEMP/submission:/submission:ro" \
            -v "$RUNNER_TEMP/smoke:/data:ro" \
            -v "$RUNNER_TEMP/smoke-out:/out:rw" \
            odsai/ecup26-matching-baseline:1.0 \
            python -u /submission/run.py \
              --output_path /out/submit.csv \
              --items_path /data/items.parquet \
              --matches_path /data/matches.parquet
          python - <<'PY'
          import os
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root=Path(os.environ['RUNNER_TEMP'])
          expected=pd.read_parquet(root/'smoke'/'matches.parquet',columns=['id1','id2'])
          actual=pd.read_csv(root/'smoke-out'/'submit.csv')
          assert list(actual.columns)==['id1','id2','predict'], actual.columns.tolist()
          assert len(actual)==len(expected)==64
          assert actual[['id1','id2']].equals(expected[['id1','id2']])
          score=pd.to_numeric(actual['predict'],errors='raise').to_numpy(dtype=float)
          assert np.isfinite(score).all()
          assert len(np.unique(score)) > 1
          print('smoke_rows',len(actual),'unique_predict',len(np.unique(score)),'min',score.min(),'max',score.max())
          PY

      - name: Full repository test suite after smoke
        run: python -m pytest ecup_matching/tests -q

      - name: Upload exact final ZIP to private Hugging Face dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from huggingface_hub import HfApi
          root=Path(os.environ['RUNNER_TEMP'])/'final'
          submission=root/os.environ['FINAL_NAME']
          sha=hashlib.sha256(submission.read_bytes()).hexdigest()
          provenance={
              'version':'v5-category-shrunk-0.6009542418',
              'strict_outer_oof_macro_ap':0.60095424180184,
              'split_sha256':os.environ['SPLIT_SHA'],
              'fixed_prior_strength':8000.0,
              'sealed_gold_opened':False,
              'sealed_gold_rows_scored':0,
              'source_verified_fallback_artifact_id':int(os.environ['FALLBACK_ARTIFACT_ID']),
              'source_verified_fallback_inner_sha256':'ee6fec40fe7e79095c33b5a2ed8a1c6cb40e01c3a8e90850c7459d5f1afad06e',
              'submission_filename':submission.name,
              'submission_sha256':sha,
              'organizer_image':'odsai/ecup26-matching-baseline:1.0',
              'offline_smoke_passed':True,
              'runtime_change':'final category-shrunk rank fusion only; six underlying production signals unchanged',
              'source_commit':os.environ['GITHUB_SHA'],
          }
          prov=root/'PROVENANCE-HF.json'; prov.write_text(json.dumps(provenance,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          sums=root/'SHA256SUMS-HF.txt'; sums.write_text(f'{sha}  {submission.name}\n',encoding='utf-8')
          api=HfApi(token=os.environ['HF_TOKEN']); prefix=os.environ['HF_SUBMISSION_PREFIX']
          for path in (submission,root/'model_v5_category_shrunk.json',prov,sums):
              api.upload_file(path_or_fileobj=str(path),path_in_repo=f'{prefix}/{path.name}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'Publish verified E-CUP v5 category-shrunk: {path.name}')
          print('hf_repo',os.environ['HF_REPO_ID'])
          print('hf_prefix',prefix)
          print('submission_sha256',sha)
          PY

      - name: Upload GitHub Actions final artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v5-category-shrunk-0.6009542418-submission
          path: |
            ${{ runner.temp }}/final/${{ env.FINAL_NAME }}
            ${{ runner.temp }}/final/model_v5_category_shrunk.json
            ${{ runner.temp }}/final/SHA256SUMS.txt
            ${{ runner.temp }}/final/PROVENANCE-HF.json
            ${{ runner.temp }}/final/SHA256SUMS-HF.txt
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/fallback" "$RUNNER_TEMP/submission" "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-out" "$RUNNER_TEMP/final"
