name: E-CUP v5 collect safe metrics

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v5-collect-safe-metrics.yml

permissions:
  contents: write

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecup-matching-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub>=1.0,<2'
      - name: Collect aggregate-only metrics from private storage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from huggingface_hub.errors import EntryNotFoundError

          repo = os.environ['HF_REPO_ID']
          token = os.environ['HF_TOKEN']
          specs = {
              'validation': ('experiments/v5/validation/93e439633099/v5a-audit-metrics.json',),
              'category_specialists': ('experiments/v5/category/e885961388d1/v5b-category-metrics.json',),
              'attribute_evidence': ('experiments/v5/attribute/f19e58475dd8/v5b-attribute-metrics.json',),
              'pretrained_biencoder': ('experiments/v5/pretrained/d812ad8d6a00/v5c-pretrained-metrics.json',),
              'weighted_specialists': ('experiments/v5/weighted-specialists/b249fb17fa0c/aggregate/v5b-weighted-specialist-metrics.json',),
              'contrastive_sprint': ('experiments/v5/contrastive-sprint/b30821f613bf/aggregate/v5d-contrastive-sprint-metrics.json',),
          }
          result = {
              'policy': 'aggregate metrics only; no product text, IDs, labels, OOF rows, or model weights',
              'experiments': {},
          }
          cache = Path(os.environ['RUNNER_TEMP']) / 'metrics-cache'
          cache.mkdir(parents=True, exist_ok=True)
          for key, filenames in specs.items():
              filename = filenames[0]
              try:
                  local = hf_hub_download(
                      repo_id=repo,
                      repo_type='dataset',
                      filename=filename,
                      token=token,
                      local_dir=cache,
                  )
              except EntryNotFoundError:
                  result['experiments'][key] = {'status': 'not_available_yet', 'private_path': filename}
                  continue
              payload = json.loads(Path(local).read_text(encoding='utf-8'))
              # Metrics files produced by v5 workflows contain aggregate counts,
              # scores and hashes only. Keep a second defensive deny-list anyway.
              forbidden_fragments = ('row_index', 'id1', 'id2', 'product', 'text', 'name_value')
              serialized = json.dumps(payload, ensure_ascii=False).lower()
              if any(fragment in serialized for fragment in forbidden_fragments):
                  raise RuntimeError(f'unsafe aggregate metrics payload for {key}')
              result['experiments'][key] = {
                  'status': 'available',
                  'private_path': filename,
                  'metrics': payload,
              }

          target = Path('ecup_matching/experiments/v5/SAFE_METRICS.json')
          target.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(target.read_text(encoding='utf-8'))
          PY
      - name: Commit safe metrics snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ecup_matching/experiments/v5/SAFE_METRICS.json; then
            echo 'No safe metric changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ecup_matching/experiments/v5/SAFE_METRICS.json
          git commit -m 'docs: snapshot public-safe v5 metrics'
          git push origin HEAD:ecup-matching-2026
