name: E-CUP v5 contrastive outer-CV sprint

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v5-contrastive-sprint.yml
      - ecup_matching/ml/train_v5_biencoder_fold.py
      - ecup_matching/ml/run_v5_contrastive_aggregate.py
      - ecup_matching/ml/v5_contrastive_data.py

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  CATEGORY_PREFIX: experiments/v5/category/e885961388d1
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  MODEL_ID: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  MODEL_REVISION: e8f8c21
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching

jobs:
  train-fold:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fold: [0, 1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy<3' 'pandas<3' 'pyarrow<24' 'scikit-learn<2' \
            'huggingface_hub>=1.0,<2' 'torch>=2.3' \
            'transformers>=4.45,<6' 'sentence-transformers>=3,<6' 'pytest>=8,<10'
      - name: Verify objective and MPS
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            ecup_matching/tests/test_train_v5_biencoder_fold.py \
            ecup_matching/tests/test_v5_contrastive_data.py \
            ecup_matching/tests/test_v5_pretrained_biencoder.py -q
          python - <<'PY'
          import torch
          print('mps_available',torch.backends.mps.is_available())
          assert torch.backends.mps.is_available()
          PY
      - name: Download data, sealed split and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/data" "${RUNNER_TEMP}/private" "${RUNNER_TEMP}/model" "${RUNNER_TEMP}/out"
          curl -fL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, snapshot_download
          token=os.environ['HF_TOKEN']; repo=os.environ['HF_REPO_ID']; prefix=os.environ['VALIDATION_PREFIX']
          for name in ('split-manifest.json','development-oof.parquet'):
              hf_hub_download(repo_id=repo,repo_type='dataset',filename=f'{prefix}/{name}',token=token,local_dir=os.path.join(os.environ['RUNNER_TEMP'],'private'))
          snapshot_download(repo_id=os.environ['MODEL_ID'],revision=os.environ['MODEL_REVISION'],local_dir=os.path.join(os.environ['RUNNER_TEMP'],'model'),allow_patterns=['*.json','*.safetensors','*.model','*.txt'])
          PY
      - name: Train held-fold item encoder sprint
        shell: bash
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: '1'
        run: |
          set -euo pipefail
          python -m ecup_matching.ml.train_v5_biencoder_fold \
            --items "${RUNNER_TEMP}/data/items_human.parquet" \
            --matches "${RUNNER_TEMP}/data/matches.parquet" \
            --manifest "${RUNNER_TEMP}/private/${VALIDATION_PREFIX}/split-manifest.json" \
            --base-oof "${RUNNER_TEMP}/private/${VALIDATION_PREFIX}/development-oof.parquet" \
            --model-dir "${RUNNER_TEMP}/model" \
            --output-dir "${RUNNER_TEMP}/out" \
            --expected-split-sha "$SPLIT_SHA" \
            --held-fold ${{ matrix.fold }} \
            --device mps --batch-size 96 --encode-batch-size 256 \
            --max-seq-length 96 --last-n-layers 4 \
            --learning-rate 2e-5 --negative-margin 0.30 --max-steps 800
      - name: Persist held-fold OOF privately
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          fold='${{ matrix.fold }}'; out=Path(os.environ['RUNNER_TEMP'])/'out'; api=HfApi(token=os.environ['HF_TOKEN'])
          prefix=f"experiments/v5/contrastive-sprint/{os.environ['GITHUB_SHA'][:12]}/fold-{fold}"
          for name in (f'v5d-fold-{fold}-oof.parquet',f'v5d-fold-{fold}-metrics.json'):
              api.upload_file(path_or_fileobj=str(out/name),path_in_repo=f'{prefix}/{name}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'Store v5 contrastive sprint fold {fold}')
          print('private_prefix',prefix)
          PY
      - if: always()
        run: rm -rf "${RUNNER_TEMP}/data" "${RUNNER_TEMP}/private" "${RUNNER_TEMP}/model" "${RUNNER_TEMP}/out"

  aggregate:
    needs: train-fold
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Download aggregate inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/data" "${RUNNER_TEMP}/private" "${RUNNER_TEMP}/folds" "${RUNNER_TEMP}/out"
          curl -fL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; root=os.environ['RUNNER_TEMP']
          hf_hub_download(repo_id=repo,repo_type='dataset',filename=f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",token=token,local_dir=os.path.join(root,'private'))
          hf_hub_download(repo_id=repo,repo_type='dataset',filename=f"{os.environ['CATEGORY_PREFIX']}/v5b-category-oof.parquet",token=token,local_dir=os.path.join(root,'private'))
          prefix=f"experiments/v5/contrastive-sprint/{os.environ['GITHUB_SHA'][:12]}"
          for fold in range(5):
              name=f'v5d-fold-{fold}-oof.parquet'
              path=hf_hub_download(repo_id=repo,repo_type='dataset',filename=f'{prefix}/fold-{fold}/{name}',token=token,local_dir=os.path.join(root,'folds'))
              print('fold_file',path)
          PY
      - name: Aggregate strict semantic OOF over category anchor
        shell: bash
        run: |
          python -m ecup_matching.ml.run_v5_contrastive_aggregate \
            --fold-dir "${RUNNER_TEMP}/folds" \
            --items "${RUNNER_TEMP}/data/items_human.parquet" \
            --matches "${RUNNER_TEMP}/data/matches.parquet" \
            --manifest "${RUNNER_TEMP}/private/${VALIDATION_PREFIX}/split-manifest.json" \
            --category-oof "${RUNNER_TEMP}/private/${CATEGORY_PREFIX}/v5b-category-oof.parquet" \
            --output-dir "${RUNNER_TEMP}/out" \
            --expected-split-sha "$SPLIT_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'out'/'v5d-contrastive-sprint-metrics.json').read_text())
          assert m['gold_metric_opened'] is False and m['gold_rows_scored']==0
          print('category_base_oof_macro_ap',m['category_base_oof_macro_ap'])
          print('contrastive_cosine_oof_macro_ap',m['contrastive_cosine_oof_macro_ap'])
          print('stack_oof_macro_ap',m['stack_oof_macro_ap'])
          print('delta_vs_category_base',m['delta_vs_category_base'])
          print('folds',[(x['fold'],x['macro_average_precision'],x['delta_vs_base']) for x in m['fold_reports']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecup-v5-contrastive-sprint-metrics
          path: ${{ runner.temp }}/out/v5d-contrastive-sprint-metrics.json
          retention-days: 14
      - name: Persist aggregate OOF privately
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN']); out=Path(os.environ['RUNNER_TEMP'])/'out'
          prefix=f"experiments/v5/contrastive-sprint/{os.environ['GITHUB_SHA'][:12]}/aggregate"
          for name in ('v5d-contrastive-sprint-metrics.json','v5d-contrastive-sprint-oof.parquet'):
              api.upload_file(path_or_fileobj=str(out/name),path_in_repo=f'{prefix}/{name}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'Store v5 contrastive sprint aggregate {name}')
          print('private_prefix',prefix)
          PY
      - if: always()
        run: rm -rf "${RUNNER_TEMP}/data" "${RUNNER_TEMP}/private" "${RUNNER_TEMP}/folds" "${RUNNER_TEMP}/out"
