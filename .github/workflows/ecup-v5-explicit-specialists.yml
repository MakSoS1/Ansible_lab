name: E-CUP v5 explicit attribute specialists
on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths: [.github/workflows/ecup-v5-explicit-specialists.yml, ecup_matching/ml/v5_explicit_attributes.py, ecup_matching/ml/run_v5_explicit_specialist_fold.py, ecup_matching/ml/run_v5_explicit_specialist_aggregate.py, ecup_matching/ml/textnorm.py, ecup_matching/ml/features.py, ecup_matching/ml/features_v2.py]
permissions: {contents: read}
env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  CATEGORY_PREFIX: experiments/v5/category/e885961388d1
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
jobs:
  fold:
    strategy: {fail-fast: false, max-parallel: 5, matrix: {fold: [0,1,2,3,4]}}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: ecup_matching/requirements-ci.txt}
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - run: python -m pytest ecup_matching/tests/test_v5_explicit_attributes.py -q
      - name: Inputs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          hf_hub_download(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',filename=f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",token=os.environ['HF_TOKEN'],local_dir=os.path.join(os.environ['RUNNER_TEMP'],'private'))
          PY
      - name: Fold
        run: python -m ecup_matching.ml.run_v5_explicit_specialist_fold --items "$RUNNER_TEMP/data/items_human.parquet" --matches "$RUNNER_TEMP/data/matches.parquet" --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" --output-dir "$RUNNER_TEMP/out" --expected-split-sha "$SPLIT_SHA" --held-fold ${{ matrix.fold }}
      - name: Persist
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          f='${{ matrix.fold }}';o=Path(os.environ['RUNNER_TEMP'])/'out';p=f"experiments/v5/explicit-specialists/{os.environ['GITHUB_SHA'][:12]}/fold-{f}";api=HfApi(token=os.environ['HF_TOKEN'])
          for n in (f'v5-explicit-fold-{f}-oof.parquet',f'v5-explicit-fold-{f}-metrics.json'):api.upload_file(path_or_fileobj=str(o/n),path_in_repo=f'{p}/{n}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'v5 explicit fold {f}')
          PY
  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: ecup_matching/requirements-ci.txt}
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Inputs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/folds" "$RUNNER_TEMP/out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          r=os.environ['HF_REPO_ID'];t=os.environ['HF_TOKEN'];root=os.environ['RUNNER_TEMP']
          for p in (f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",f"{os.environ['CATEGORY_PREFIX']}/v5b-category-oof.parquet"):hf_hub_download(repo_id=r,repo_type='dataset',filename=p,token=t,local_dir=os.path.join(root,'private'))
          pref=f"experiments/v5/explicit-specialists/{os.environ['GITHUB_SHA'][:12]}"
          for f in range(5):hf_hub_download(repo_id=r,repo_type='dataset',filename=f'{pref}/fold-{f}/v5-explicit-fold-{f}-oof.parquet',token=t,local_dir=os.path.join(root,'folds'))
          PY
      - name: Aggregate
        shell: bash
        run: |
          python -m ecup_matching.ml.run_v5_explicit_specialist_aggregate --fold-dir "$RUNNER_TEMP/folds" --items "$RUNNER_TEMP/data/items_human.parquet" --matches "$RUNNER_TEMP/data/matches.parquet" --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" --category-oof "$RUNNER_TEMP/private/$CATEGORY_PREFIX/v5b-category-oof.parquet" --output-dir "$RUNNER_TEMP/out" --expected-split-sha "$SPLIT_SHA"
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'out'/'v5-explicit-specialist-metrics.json').read_text());print('base',m['category_base_oof_macro_ap'],'candidate',m['explicit_specialist_oof_macro_ap'],'delta',m['delta_vs_category_base'],'folds',[(x['fold'],x['delta_vs_base']) for x in m['fold_reports']])
          PY
      - uses: actions/upload-artifact@v4
        with: {name: ecup-v5-explicit-specialist-metrics, path: "${{ runner.temp }}/out/v5-explicit-specialist-metrics.json", retention-days: 14}
