name: E-CUP v5 fixed label-free blend
on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v5-fixed-blend.yml
      - ecup_matching/ml/run_v5_fixed_blend.py
      - ecup_matching/ml/v5_fixed_blend.py
permissions: {contents: read}
env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  CATEGORY_PREFIX: experiments/v5/category/e885961388d1
  WEAK_PREFIX: experiments/v5/weak-specialists/319993a469cf/aggregate
  SPARSE_PREFIX: experiments/v5/sparse-specialists/634ee66890c3
  EXPLICIT_PREFIX: experiments/v5/explicit-specialists/cb350b4e7ba6
  CONTRASTIVE_PREFIX: experiments/v5/contrastive-sprint/b30821f613bf/aggregate
  TEACHER2_PREFIX: experiments/v5/teacher2/411a5349fe73
  WEIGHTED_PREFIX: experiments/v5/weighted-specialists/9df24f7ee133/aggregate
  PRETRAINED_PREFIX: experiments/v5/pretrained/d812ad8d6a00
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
jobs:
  fixed-blend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Verify fixed-blend contract
        run: python -m pytest ecup_matching/tests/test_metrics.py ecup_matching/tests/test_v5_evaluation.py ecup_matching/tests/test_v5_fixed_blend.py -q
      - name: Download frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/sparse" "$RUNNER_TEMP/explicit" "$RUNNER_TEMP/teacher2" "$RUNNER_TEMP/out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; root=os.environ['RUNNER_TEMP']
          fixed=[
              (f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json", 'private'),
              (f"{os.environ['CATEGORY_PREFIX']}/v5b-category-oof.parquet", 'private'),
              (f"{os.environ['WEAK_PREFIX']}/v5e-weak-specialist-oof.parquet", 'private'),
              (f"{os.environ['CONTRASTIVE_PREFIX']}/v5d-contrastive-sprint-oof.parquet", 'private'),
              (f"{os.environ['WEIGHTED_PREFIX']}/v5b-weighted-specialist-oof.parquet", 'private'),
              (f"{os.environ['PRETRAINED_PREFIX']}/v5c-pretrained-oof.parquet", 'private'),
          ]
          for filename, local in fixed:
              print('download', hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=os.path.join(root,local)))
          for fold in range(5):
              sparse=f"{os.environ['SPARSE_PREFIX']}/fold-{fold}/v5-sparse-fold-{fold}-oof.parquet"
              explicit=f"{os.environ['EXPLICIT_PREFIX']}/fold-{fold}/v5-explicit-fold-{fold}-oof.parquet"
              teacher=f"{os.environ['TEACHER2_PREFIX']}/fold-{fold}/v5g-teacher2-fold-{fold}-oof.parquet"
              print('download', hf_hub_download(repo_id=repo,repo_type='dataset',filename=sparse,token=token,local_dir=os.path.join(root,'sparse')))
              print('download', hf_hub_download(repo_id=repo,repo_type='dataset',filename=explicit,token=token,local_dir=os.path.join(root,'explicit')))
              print('download', hf_hub_download(repo_id=repo,repo_type='dataset',filename=teacher,token=token,local_dir=os.path.join(root,'teacher2')))
          PY
      - name: Evaluate predeclared label-free fusions
        shell: bash
        run: |
          set -euo pipefail
          python -m ecup_matching.ml.run_v5_fixed_blend \
            --items "$RUNNER_TEMP/data/items_human.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --category-oof "$RUNNER_TEMP/private/$CATEGORY_PREFIX/v5b-category-oof.parquet" \
            --weak-oof "$RUNNER_TEMP/private/$WEAK_PREFIX/v5e-weak-specialist-oof.parquet" \
            --sparse-fold-dir "$RUNNER_TEMP/sparse" \
            --explicit-fold-dir "$RUNNER_TEMP/explicit" \
            --contrastive-oof "$RUNNER_TEMP/private/$CONTRASTIVE_PREFIX/v5d-contrastive-sprint-oof.parquet" \
            --teacher2-fold-dir "$RUNNER_TEMP/teacher2" \
            --weighted-oof "$RUNNER_TEMP/private/$WEIGHTED_PREFIX/v5b-weighted-specialist-oof.parquet" \
            --pretrained-oof "$RUNNER_TEMP/private/$PRETRAINED_PREFIX/v5c-pretrained-oof.parquet" \
            --output-dir "$RUNNER_TEMP/out" \
            --expected-split-sha "$SPLIT_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'out'/'v5-fixed-blend-metrics.json').read_text())
          assert m['gold_metric_opened'] is False and m['gold_rows_scored']==0
          assert m['target_fitted_blender'] is False
          print('sources',m['source_metrics'])
          print('orthogonal_sources',m['orthogonal_source_metrics'])
          print('current_clean',m['current_clean_name'],m['current_clean_macro_average_precision'])
          for name, report in m['orthogonal_rank_candidates'].items():
              print('orthogonal',name,report['macro_average_precision'],'delta_current',report['delta_vs_current_clean'],'min_fold_delta',report['min_fold_delta_vs_current_clean'],'eligible',report['keep_eligible'])
          print('best',m['best_observed_name'],m['best_observed_macro_average_precision'],'delta_current',m['best_observed_delta_vs_current_clean'])
          print('orthogonal_eligible',m['orthogonal_keep_eligible_candidates'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecup-v5-fixed-blend-metrics
          path: ${{ runner.temp }}/out/v5-fixed-blend-metrics.json
          retention-days: 14
      - name: Persist fixed-blend OOF privately
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN']); out=Path(os.environ['RUNNER_TEMP'])/'out'
          prefix=f"experiments/v5/fixed-blend/{os.environ['GITHUB_SHA'][:12]}"
          for name in ('v5-fixed-blend-metrics.json','v5-fixed-blend-oof.parquet'):
              api.upload_file(path_or_fileobj=str(out/name),path_in_repo=f'{prefix}/{name}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'Store v5 fixed blend {name}')
          print('private_prefix',prefix)
          PY
      - if: always()
        run: rm -rf "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/sparse" "$RUNNER_TEMP/explicit" "$RUNNER_TEMP/teacher2" "$RUNNER_TEMP/out"
