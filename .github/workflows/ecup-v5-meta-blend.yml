name: E-CUP v5 strict cross-fitted meta blend

on:
  push:
    branches: [ecup-v5-meta-060]
    paths:
      - .github/workflows/ecup-v5-meta-blend.yml
      - ecup_matching/ml/v5_meta_blend.py
      - ecup_matching/ml/run_v5_meta_blend.py
      - ecup_matching/tests/test_v5_meta_blend.py

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  ANCHOR_PREFIX: experiments/v5/fixed-blend/8a017cc12776
  TYPED_FUSION_PREFIX: experiments/v5/typed-explicit-fusion/681ce53c6967
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching

jobs:
  meta-blend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Install CI stack
        run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Verify strict meta-blend contract
        run: python -m pytest ecup_matching/tests/test_v5_meta_blend.py ecup_matching/tests/test_metrics.py -q

      - name: Download immutable OOF inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; root=os.environ['RUNNER_TEMP']
          files=(
              f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",
              f"{os.environ['ANCHOR_PREFIX']}/v5-fixed-blend-oof.parquet",
              f"{os.environ['TYPED_FUSION_PREFIX']}/v5-typed-explicit-fusion-oof.parquet",
          )
          for filename in files:
              path=hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=os.path.join(root,'private'))
              print(path)
          PY

      - name: Run strict outer-fold meta OOF
        shell: bash
        run: |
          set -euo pipefail
          python -u -m ecup_matching.ml.run_v5_meta_blend \
            --items "$RUNNER_TEMP/data/items_human.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --anchor-oof "$RUNNER_TEMP/private/$ANCHOR_PREFIX/v5-fixed-blend-oof.parquet" \
            --typed-fusion-oof "$RUNNER_TEMP/private/$TYPED_FUSION_PREFIX/v5-typed-explicit-fusion-oof.parquet" \
            --output-dir "$RUNNER_TEMP/out" \
            --expected-split-sha "$SPLIT_SHA"

      - name: Print metric gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'out'/'v5-meta-blend-metrics.json'
          m=json.loads(p.read_text(encoding='utf-8'))
          print('equal_six_anchor', m['equal_six_anchor_macro_ap'])
          print('strict_crossfit_global', m['strict_crossfit_global_macro_ap'])
          print('delta', m['delta_vs_equal_six_anchor'])
          print('target_0_60_reached', m['target_0_60_reached'])
          print('full_fit_weights', m['full_fit_weights'])
          PY

      - name: Upload safe meta metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v5-strict-meta-blend
          path: |
            ${{ runner.temp }}/out/v5-meta-blend-metrics.json
            ${{ runner.temp }}/out/v5-meta-blend-oof.parquet
          if-no-files-found: error
          retention-days: 14

      - name: Persist strict meta OOF privately
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN']); out=Path(os.environ['RUNNER_TEMP'])/'out'
          prefix=f"experiments/v5/meta-blend/{os.environ['GITHUB_SHA'][:12]}"
          for name in ('v5-meta-blend-metrics.json','v5-meta-blend-oof.parquet'):
              api.upload_file(path_or_fileobj=str(out/name),path_in_repo=f'{prefix}/{name}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'Store strict v5 meta blend {name}')
          print('private_prefix',prefix)
          PY

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
