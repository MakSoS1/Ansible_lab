name: E-CUP v5 frozen meta-logistic fusion

on:
  push:
    branches: [ecup-v5-meta-060]
    paths:
      - .github/workflows/ecup-v5-meta-logistic-fusion.yml
      - ecup_matching/ml/run_v5_meta_logistic_fusion.py

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  GLOBAL_META_PREFIX: experiments/v5/meta-blend/b576270ddd70
  CATEGORY_LOGISTIC_PREFIX: experiments/v5/category-logistic/ae52afcbcf24
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching

jobs:
  fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - name: Install CI stack
        run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Run core metric tests
        run: python -m pytest ecup_matching/tests/test_metrics.py -q
      - name: Download immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; root=os.environ['RUNNER_TEMP']
          files=(
              f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",
              f"{os.environ['GLOBAL_META_PREFIX']}/v5-meta-blend-oof.parquet",
              f"{os.environ['CATEGORY_LOGISTIC_PREFIX']}/v5-category-logistic-oof.parquet",
          )
          for filename in files:
              print(hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=os.path.join(root,'private')))
          PY
      - name: Score frozen equal-rank fusion
        shell: bash
        run: |
          set -euo pipefail
          python -u -m ecup_matching.ml.run_v5_meta_logistic_fusion \
            --items "$RUNNER_TEMP/data/items_human.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --global-meta-oof "$RUNNER_TEMP/private/$GLOBAL_META_PREFIX/v5-meta-blend-oof.parquet" \
            --category-logistic-oof "$RUNNER_TEMP/private/$CATEGORY_LOGISTIC_PREFIX/v5-category-logistic-oof.parquet" \
            --output-dir "$RUNNER_TEMP/out" \
            --expected-split-sha "$SPLIT_SHA"
      - name: Print metric gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'out'/'v5-meta-logistic-fusion-metrics.json').read_text())
          print('global_meta',m['global_meta_macro_ap'])
          print('category_logistic',m['category_logistic_macro_ap'])
          print('frozen_fusion',m['frozen_equal_rank_fusion_macro_ap'])
          print('delta_vs_global_meta',m['delta_vs_global_meta'])
          print('target_0_60_reached',m['target_0_60_reached'])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v5-frozen-meta-logistic-fusion
          path: |
            ${{ runner.temp }}/out/v5-meta-logistic-fusion-metrics.json
            ${{ runner.temp }}/out/v5-meta-logistic-fusion-oof.parquet
          if-no-files-found: error
          retention-days: 14
      - name: Persist privately
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          out=Path(os.environ['RUNNER_TEMP'])/'out'; api=HfApi(token=os.environ['HF_TOKEN'])
          prefix=f"experiments/v5/meta-logistic-fusion/{os.environ['GITHUB_SHA'][:12]}"
          for name in ('v5-meta-logistic-fusion-metrics.json','v5-meta-logistic-fusion-oof.parquet'):
              api.upload_file(path_or_fileobj=str(out/name),path_in_repo=f'{prefix}/{name}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'Store frozen v5 meta-logistic fusion {name}')
          print('private_prefix',prefix)
          PY
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
