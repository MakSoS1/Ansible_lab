name: E-CUP v5 recover package and smoke

on:
  workflow_dispatch:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v5-recover-package.yml

permissions:
  contents: read
  actions: read

env:
  MAIN_RUN_ID: '31503176262'
  TEACHER_RUN_ID: '31504431386'
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Wait for and download production component artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts/structured" "$RUNNER_TEMP/artifacts/contrastive" "$RUNNER_TEMP/artifacts/teacher"
          fetch_named_artifact() {
            local run_id="$1" name="$2" dest="$3"
            local artifact_id=""
            for attempt in $(seq 1 300); do
              artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq ".artifacts[] | select(.name == \"$name\") | .id" | head -n1 || true)"
              if [[ -n "$artifact_id" ]]; then break; fi
              echo "artifact $name not ready (attempt $attempt)"
              sleep 20
            done
            test -n "$artifact_id"
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/$name.zip"
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$dest"
            echo "downloaded $name artifact_id=$artifact_id"
          }
          fetch_named_artifact "$MAIN_RUN_ID" v5-prod-structured "$RUNNER_TEMP/artifacts/structured"
          fetch_named_artifact "$MAIN_RUN_ID" v5-prod-contrastive "$RUNNER_TEMP/artifacts/contrastive"
          fetch_named_artifact "$TEACHER_RUN_ID" v5-prod-teacher-exact "$RUNNER_TEMP/artifacts/teacher"
          find "$RUNNER_TEMP/artifacts" -maxdepth 3 -type f -printf '%p %s\n' | head -100
      - name: Full test suite before packaging
        run: python -m pytest ecup_matching/tests -q
      - name: Build final submission ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final"
          python -m ecup_matching.build_submission_v5 \
            --structured-model "$RUNNER_TEMP/artifacts/structured/model_v5_structured.joblib" \
            --contrastive-model-dir "$RUNNER_TEMP/artifacts/contrastive" \
            --teacher-model-dir "$RUNNER_TEMP/artifacts/teacher" \
            --legacy-runtime-dir "$RUNNER_TEMP/artifacts/structured/legacy_ecup" \
            --output "$RUNNER_TEMP/final/ecup-v5-best-submission.zip"
          sha256sum "$RUNNER_TEMP/final/ecup-v5-best-submission.zip" | tee "$RUNNER_TEMP/final/SHA256SUMS.txt"
          stat -c 'submission_bytes=%s' "$RUNNER_TEMP/final/ecup-v5-best-submission.zip"
          unzip -t "$RUNNER_TEMP/final/ecup-v5-best-submission.zip" >/dev/null
      - name: Prepare organizer smoke inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-out" "$RUNNER_TEMP/submission"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/smoke/matches-full.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/smoke/items-full.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os, pandas as pd
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'smoke'
          pairs=pd.read_parquet(root/'matches-full.parquet',columns=['id1','id2']).head(32).copy()
          ids=set(pairs.id1)|set(pairs.id2)
          items=pd.read_parquet(root/'items-full.parquet',columns=['id','name','attributes','category'])
          items=items[items.id.isin(ids)].copy()
          assert ids <= set(items.id)
          pairs.to_parquet(root/'matches.parquet',index=False)
          items.to_parquet(root/'items.parquet',index=False)
          PY
          unzip -q "$RUNNER_TEMP/final/ecup-v5-best-submission.zip" -d "$RUNNER_TEMP/submission"
      - name: Exact organizer-image offline smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,size=2g \
            -v "$RUNNER_TEMP/submission:/submission:ro" \
            -v "$RUNNER_TEMP/smoke:/data:ro" \
            -v "$RUNNER_TEMP/smoke-out:/out:rw" \
            odsai/ecup26-matching-baseline:1.0 \
            python -u /submission/run.py \
              --output_path /out/submit.csv \
              --items_path /data/items.parquet \
              --matches_path /data/matches.parquet
          python - <<'PY'
          import os, numpy as np, pandas as pd
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          inp=pd.read_parquet(root/'smoke'/'matches.parquet',columns=['id1','id2'])
          out=pd.read_csv(root/'smoke-out'/'submit.csv')
          assert list(out.columns)==['id1','id2','predict']
          assert len(out)==len(inp)==32
          assert out[['id1','id2']].equals(inp[['id1','id2']])
          score=out.predict.to_numpy(float)
          assert np.isfinite(score).all() and ((score>=0)&(score<=1)).all()
          assert len(np.unique(score))>1
          print('organizer_smoke_rows',len(out),'unique_predictions',len(np.unique(score)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecup-v5-best-submission-recovered
          path: |
            ${{ runner.temp }}/final/ecup-v5-best-submission.zip
            ${{ runner.temp }}/final/SHA256SUMS.txt
          retention-days: 14
