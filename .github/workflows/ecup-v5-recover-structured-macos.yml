name: E-CUP v5 recover structured on macOS

on:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/ecup-v5-recover-structured-macos.yml

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
  LEGACY_COMMIT: cb350b4e7ba6

jobs:
  structured:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact structured dependencies
        run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Build exact legacy runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/legacy/legacy_ecup"
          mkdir -p "$root/ml"
          : > "$root/__init__.py"
          : > "$root/ml/__init__.py"
          for file in textnorm.py features.py category_attrs.py features_v2.py v5_item_text.py v5_sparse.py; do
            git show "$LEGACY_COMMIT:ecup_matching/ml/$file" > "$root/ml/$file"
          done
      - name: Download sealed development inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
          for file in matches.parquet items_human.parquet matches_llm.parquet items.parquet; do
            curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/$file" "$BASE_URL/$file"
            test -s "$RUNNER_TEMP/data/$file"
          done
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          root=os.environ['RUNNER_TEMP']; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; prefix=os.environ['VALIDATION_PREFIX']
          for name in ('split-manifest.json','development-oof.parquet'):
              hf_hub_download(repo_id=repo,repo_type='dataset',filename=f'{prefix}/{name}',token=token,local_dir=os.path.join(root,'private'))
          PY
      - name: Train persistent structured bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m ecup_matching.ml.train_v5_production_structured \
            --human-items "$RUNNER_TEMP/data/items_human.parquet" \
            --full-items "$RUNNER_TEMP/data/items.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --weak-matches "$RUNNER_TEMP/data/matches_llm.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --base-oof "$RUNNER_TEMP/private/$VALIDATION_PREFIX/development-oof.parquet" \
            --legacy-package-dir "$RUNNER_TEMP/legacy/legacy_ecup" \
            --output "$RUNNER_TEMP/out/model_v5_structured.joblib" \
            --expected-split-sha "$SPLIT_SHA"
          ls -lh "$RUNNER_TEMP/out/model_v5_structured.joblib"
      - uses: actions/upload-artifact@v4
        with:
          name: v5-prod-structured-macos
          path: |
            ${{ runner.temp }}/out/model_v5_structured.joblib
            ${{ runner.temp }}/legacy/legacy_ecup
          retention-days: 3
