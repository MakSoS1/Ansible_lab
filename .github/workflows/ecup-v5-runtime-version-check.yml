name: E-CUP organizer runtime version check

on:
  push:
    branches: [ecup-v5-meta-060]
    paths:
      - .github/workflows/ecup-v5-runtime-version-check.yml

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CI stack
        run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Compare sklearn versions
        shell: bash
        run: |
          set -euo pipefail
          host="$(python -c 'import sklearn; print(sklearn.__version__)')"
          image="$(docker run --rm --network none odsai/ecup26-matching-baseline:1.0 python -c 'import sklearn; print(sklearn.__version__)')"
          echo "ci_sklearn=$host"
          echo "organizer_sklearn=$image"
          if [ "$host" = "$image" ]; then
            echo "compatible_exact=true"
          else
            echo "compatible_exact=false"
            exit 2
          fi
