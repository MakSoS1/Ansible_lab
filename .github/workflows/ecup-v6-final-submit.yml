name: E-CUP v6 fast gate95 final submit

on:
  push:
    branches: [ecup-v6-fast]
    paths:
      - .github/workflows/ecup-v6-final-submit.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  ANCHOR_PREFIX: experiments/v5/fixed-blend/8a017cc12776
  TYPED_FUSION_PREFIX: experiments/v5/typed-explicit-fusion/681ce53c6967
  GATE_PREFIX: experiments/v6/teacher-gate/95/fb15ec43a90c
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  SELECTED_OOF: '0.6006003614522999'
  COVERAGE: '0.95'
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
  FALLBACK_ARTIFACT_ID: '9112337546'
  FALLBACK_INNER_ZIP: ecup-v5-six-signal-0.5975445721-submission.zip
  FALLBACK_SHA: ee6fec40fe7e79095c33b5a2ed8a1c6cb40e01c3a8e90850c7459d5f1afad06e
  FINAL_NAME: ecup-v6-fast-gate95-0.6006003615-submission.zip
  HF_SUBMISSION_PREFIX: submissions/v6/fast-gate95-0.6006003615

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt

      - name: Install CI stack
        run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Verify selected v6 contracts
        run: |
          python -m pytest \
            ecup_matching/tests/test_v6_teacher_gate.py \
            ecup_matching/tests/test_v6_fast_inference.py \
            ecup_matching/tests/test_v5_category_shrunk.py \
            ecup_matching/tests/test_v5_hgb_stack.py \
            ecup_matching/tests/test_v5_production.py \
            ecup_matching/tests/test_metrics.py -q

      - name: Download immutable selection evidence and development inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/final" "$RUNNER_TEMP/fallback" "$RUNNER_TEMP/submission" "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          root=os.environ['RUNNER_TEMP']; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']
          for filename in (
              f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",
              f"{os.environ['ANCHOR_PREFIX']}/v5-fixed-blend-oof.parquet",
              f"{os.environ['TYPED_FUSION_PREFIX']}/v5-typed-explicit-fusion-oof.parquet",
              f"{os.environ['GATE_PREFIX']}/v6-teacher-gate-95-metrics.json",
          ):
              print(hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=os.path.join(root,'private')))
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'private'/os.environ['GATE_PREFIX']/'v6-teacher-gate-95-metrics.json'
          m=json.loads(p.read_text(encoding='utf-8'))
          assert abs(m['fusion_macro_ap']-float(os.environ['SELECTED_OOF'])) < 1e-15
          assert m['coverage']==0.95 and m['target_0_60_reached'] is True
          assert m['gold_metric_opened'] is False and m['gold_rows_scored']==0
          assert m['fully_outer_cross_fitted_meta'] is True
          print('selected_oof',m['fusion_macro_ap'],'teacher_fraction',m['actual_teacher_fraction'])
          PY

      - name: Fit production meta models for exact gate95 architecture
        shell: bash
        run: |
          set -euo pipefail
          python -u -m ecup_matching.ml.run_v6_gate_production \
            --coverage "$COVERAGE" \
            --selected-oof-macro-ap "$SELECTED_OOF" \
            --items "$RUNNER_TEMP/data/items_human.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --anchor-oof "$RUNNER_TEMP/private/$ANCHOR_PREFIX/v5-fixed-blend-oof.parquet" \
            --typed-fusion-oof "$RUNNER_TEMP/private/$TYPED_FUSION_PREFIX/v5-typed-explicit-fusion-oof.parquet" \
            --category-output "$RUNNER_TEMP/final/model_v6_category_shrunk.json" \
            --hgb-output "$RUNNER_TEMP/final/model_v6_hgb_meta.joblib" \
            --metadata-output "$RUNNER_TEMP/final/model_v6_gate_metadata.json" \
            --expected-split-sha "$SPLIT_SHA"
          python - <<'PY'
          import json, joblib, os, sklearn
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'final'
          meta=json.loads((root/'model_v6_gate_metadata.json').read_text())
          hgb=joblib.load(root/'model_v6_hgb_meta.joblib')
          assert meta['coverage']==0.95
          assert abs(meta['strict_selected_oof_macro_ap']-float(os.environ['SELECTED_OOF'])) < 1e-15
          assert meta['selection_gold_metric_opened'] is False and meta['selection_gold_rows_scored']==0
          assert hgb['sklearn_version']==sklearn.__version__=='1.9.0'
          print('production_meta_ok',meta['strict_selected_oof_macro_ap'])
          PY

      - name: Download exact verified six-signal base package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$FALLBACK_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/fallback/actions-artifact.zip"
          mkdir -p "$RUNNER_TEMP/fallback/outer"
          unzip -q "$RUNNER_TEMP/fallback/actions-artifact.zip" -d "$RUNNER_TEMP/fallback/outer"
          test -f "$RUNNER_TEMP/fallback/outer/$FALLBACK_INNER_ZIP"
          observed="$(sha256sum "$RUNNER_TEMP/fallback/outer/$FALLBACK_INNER_ZIP" | awk '{print $1}')"
          echo "base_sha=$observed"
          test "$observed" = "$FALLBACK_SHA"
          unzip -q "$RUNNER_TEMP/fallback/outer/$FALLBACK_INNER_ZIP" -d "$RUNNER_TEMP/submission"

      - name: Patch v6 gated runtime over verified base
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/submission/model_v5_structured.joblib"
          test -d "$RUNNER_TEMP/submission/model_v5_contrastive"
          test -d "$RUNNER_TEMP/submission/model_v5_teacher"
          mkdir -p "$RUNNER_TEMP/submission/ecup_matching/ml" "$RUNNER_TEMP/submission/ecup_matching/submission"
          cp ecup_matching/ml/v5_fixed_blend.py "$RUNNER_TEMP/submission/ecup_matching/ml/v5_fixed_blend.py"
          cp ecup_matching/ml/v5_meta_blend.py "$RUNNER_TEMP/submission/ecup_matching/ml/v5_meta_blend.py"
          cp ecup_matching/ml/v5_production.py "$RUNNER_TEMP/submission/ecup_matching/ml/v5_production.py"
          cp ecup_matching/ml/v6_teacher_gate.py "$RUNNER_TEMP/submission/ecup_matching/ml/v6_teacher_gate.py"
          cp ecup_matching/submission/v6_fast.py "$RUNNER_TEMP/submission/ecup_matching/submission/v6_fast.py"
          cp ecup_matching/submission/predict_v6.py "$RUNNER_TEMP/submission/ecup_matching/submission/predict_v6.py"
          cp ecup_matching/submission/run_v6.py "$RUNNER_TEMP/submission/run.py"
          cp "$RUNNER_TEMP/final/model_v6_category_shrunk.json" "$RUNNER_TEMP/submission/model_v6_category_shrunk.json"
          cp "$RUNNER_TEMP/final/model_v6_hgb_meta.joblib" "$RUNNER_TEMP/submission/model_v6_hgb_meta.joblib"
          cp "$RUNNER_TEMP/final/model_v6_gate_metadata.json" "$RUNNER_TEMP/submission/model_v6_gate_metadata.json"
          python -m py_compile \
            "$RUNNER_TEMP/submission/run.py" \
            "$RUNNER_TEMP/submission/ecup_matching/ml/v6_teacher_gate.py" \
            "$RUNNER_TEMP/submission/ecup_matching/submission/v6_fast.py" \
            "$RUNNER_TEMP/submission/ecup_matching/submission/predict_v6.py"
          cd "$RUNNER_TEMP/submission"
          zip -qr "$RUNNER_TEMP/final/$FINAL_NAME" .
          cd - >/dev/null
          unzip -t "$RUNNER_TEMP/final/$FINAL_NAME" >/dev/null
          sha256sum "$RUNNER_TEMP/final/$FINAL_NAME" | tee "$RUNNER_TEMP/final/SHA256SUMS.txt"
          stat -c 'submission_bytes=%s' "$RUNNER_TEMP/final/$FINAL_NAME"

      - name: Prepare 64-row organizer smoke
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          root=Path(os.environ['RUNNER_TEMP'])
          pairs=pd.read_parquet(root/'data'/'matches.parquet',columns=['id1','id2']).head(64).copy()
          ids=set(pairs.id1.tolist())|set(pairs.id2.tolist())
          items=pd.read_parquet(root/'data'/'items_human.parquet',columns=['id','name','attributes','category'])
          items=items[items.id.isin(ids)].copy(); assert ids <= set(items.id.tolist())
          pairs.to_parquet(root/'smoke'/'matches.parquet',index=False)
          items.to_parquet(root/'smoke'/'items.parquet',index=False)
          PY

      - name: Exact organizer-image offline read-only smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,size=2g \
            -v "$RUNNER_TEMP/submission:/submission:ro" \
            -v "$RUNNER_TEMP/smoke:/data:ro" \
            -v "$RUNNER_TEMP/smoke-out:/out:rw" \
            odsai/ecup26-matching-baseline:1.0 \
            python -u /submission/run.py --output_path /out/submit.csv \
              --items_path /data/items.parquet --matches_path /data/matches.parquet
          python - <<'PY'
          import os
          from pathlib import Path
          import numpy as np, pandas as pd
          root=Path(os.environ['RUNNER_TEMP'])
          expected=pd.read_parquet(root/'smoke'/'matches.parquet',columns=['id1','id2'])
          actual=pd.read_csv(root/'smoke-out'/'submit.csv')
          assert list(actual.columns)==['id1','id2','predict'] and len(actual)==len(expected)==64
          assert actual[['id1','id2']].equals(expected[['id1','id2']])
          score=actual.predict.to_numpy(float)
          assert np.isfinite(score).all() and ((score>=0)&(score<=1)).all() and len(np.unique(score))>1
          print('organizer_smoke_ok',len(actual),len(np.unique(score)))
          PY

      - name: Full repository tests after exact smoke
        run: python -m pytest ecup_matching/tests -q

      - name: Write provenance and upload exact ZIP to private HF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from huggingface_hub import HfApi
          root=Path(os.environ['RUNNER_TEMP'])/'final'; z=root/os.environ['FINAL_NAME']
          sha=hashlib.sha256(z.read_bytes()).hexdigest()
          p={
            'version':'v6-fast-gate95',
            'strict_outer_oof_macro_ap':float(os.environ['SELECTED_OOF']),
            'coverage':float(os.environ['COVERAGE']),
            'split_sha256':os.environ['SPLIT_SHA'],
            'sealed_gold_opened':False,'sealed_gold_rows_scored':0,
            'base_artifact_id':int(os.environ['FALLBACK_ARTIFACT_ID']),
            'base_zip_sha256':os.environ['FALLBACK_SHA'],
            'submission_filename':z.name,'submission_sha256':sha,
            'organizer_image':'odsai/ecup26-matching-baseline:1.0',
            'offline_readonly_smoke_passed':True,'source_commit':os.environ['GITHUB_SHA'],
            'inference_optimizations':['target-free 95% teacher gate','length bucketing','larger CUDA batches','CUDA OOM batch fallback','SDPA when supported'],
            'mixed_precision':False,
          }
          prov=root/'PROVENANCE.json'; prov.write_text(json.dumps(p,ensure_ascii=False,indent=2,sort_keys=True))
          api=HfApi(token=os.environ['HF_TOKEN']); prefix=os.environ['HF_SUBMISSION_PREFIX']; repo=os.environ['HF_REPO_ID']
          for path in (z,root/'SHA256SUMS.txt',prov,root/'model_v6_gate_metadata.json'):
            api.upload_file(path_or_fileobj=str(path),path_in_repo=f'{prefix}/{path.name}',repo_id=repo,repo_type='dataset',commit_message=f'Upload final v6 {path.name}')
          print('final_sha256',sha,'hf_prefix',prefix)
          PY

      - name: Publish temporary public benchmark release asset
        shell: bash
        run: |
          set -euo pipefail
          TAG="ecup-v6-benchmark-${GITHUB_SHA::12}"
          cp "$RUNNER_TEMP/final/SHA256SUMS.txt" "$RUNNER_TEMP/final/SHA256SUMS-v6.txt"
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$RUNNER_TEMP/final/$FINAL_NAME" \
            "$RUNNER_TEMP/final/SHA256SUMS-v6.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Temporary v6 GPU benchmark $TAG" \
            --notes "Temporary benchmark transport for ecup-rtx2060; exact organizer-smoked v6 archive."
          echo "benchmark_tag=$TAG" >> "$GITHUB_ENV"
          echo "benchmark_url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FINAL_NAME" >> "$GITHUB_ENV"

      - name: Upload final Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v6-fast-gate95-final
          path: |
            ${{ runner.temp }}/final/${{ env.FINAL_NAME }}
            ${{ runner.temp }}/final/SHA256SUMS.txt
            ${{ runner.temp }}/final/PROVENANCE.json
            ${{ runner.temp }}/final/model_v6_gate_metadata.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Final summary
        shell: bash
        run: |
          echo "selected_oof=$SELECTED_OOF"
          echo "final_name=$FINAL_NAME"
          sha256sum "$RUNNER_TEMP/final/$FINAL_NAME"
          echo "benchmark_tag=${benchmark_tag:-missing}"
          echo "benchmark_url=${benchmark_url:-missing}"

      - name: Cleanup sensitive working data
        if: always()
        run: rm -rf "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/fallback" "$RUNNER_TEMP/submission" "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-out"
