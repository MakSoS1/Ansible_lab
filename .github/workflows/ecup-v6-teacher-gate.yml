name: E-CUP v6 teacher gate OOF

on:
  push:
    branches: [ecup-v6-fast]
    paths:
      - .github/workflows/ecup-v6-teacher-gate.yml
      - ecup_matching/ml/v6_teacher_gate.py
      - ecup_matching/ml/run_v6_teacher_gate.py
      - ecup_matching/tests/test_v6_teacher_gate.py
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  ANCHOR_PREFIX: experiments/v5/fixed-blend/8a017cc12776
  TYPED_FUSION_PREFIX: experiments/v5/typed-explicit-fusion/681ce53c6967
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - coverage: '0.25'
            tag: '25'
          - coverage: '0.40'
            tag: '40'
          - coverage: '0.55'
            tag: '55'
          - coverage: '0.70'
            tag: '70'
          - coverage: '0.85'
            tag: '85'
          - coverage: '0.95'
            tag: '95'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Verify gate contract
        run: python -m pytest ecup_matching/tests/test_v6_teacher_gate.py ecup_matching/tests/test_v5_category_shrunk.py ecup_matching/tests/test_v5_hgb_stack.py ecup_matching/tests/test_metrics.py -q
      - name: Download immutable OOF inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']; root=os.environ['RUNNER_TEMP']
          for filename in (
              f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",
              f"{os.environ['ANCHOR_PREFIX']}/v5-fixed-blend-oof.parquet",
              f"{os.environ['TYPED_FUSION_PREFIX']}/v5-typed-explicit-fusion-oof.parquet",
          ):
              print(hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=os.path.join(root,'private')))
          PY
      - name: Evaluate target-free teacher gate
        shell: bash
        run: |
          set -euo pipefail
          python -u -m ecup_matching.ml.run_v6_teacher_gate \
            --coverage "${{ matrix.coverage }}" \
            --items "$RUNNER_TEMP/data/items_human.parquet" \
            --matches "$RUNNER_TEMP/data/matches.parquet" \
            --manifest "$RUNNER_TEMP/private/$VALIDATION_PREFIX/split-manifest.json" \
            --anchor-oof "$RUNNER_TEMP/private/$ANCHOR_PREFIX/v5-fixed-blend-oof.parquet" \
            --typed-fusion-oof "$RUNNER_TEMP/private/$TYPED_FUSION_PREFIX/v5-typed-explicit-fusion-oof.parquet" \
            --output-dir "$RUNNER_TEMP/out" \
            --expected-split-sha "$SPLIT_SHA"
      - name: Print quality/runtime gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          tag='${{ matrix.tag }}'
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'out'/f'v6-teacher-gate-{tag}-metrics.json').read_text())
          print('coverage',m['coverage'])
          print('actual_teacher_fraction',m['actual_teacher_fraction'])
          print('category_shrunk',m['category_shrunk_macro_ap'])
          print('hgb',m['hgb_macro_ap'])
          print('fusion',m['fusion_macro_ap'])
          print('target_0_60_reached',m['target_0_60_reached'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v6-teacher-gate-${{ matrix.tag }}
          path: |
            ${{ runner.temp }}/out/v6-teacher-gate-${{ matrix.tag }}-metrics.json
            ${{ runner.temp }}/out/v6-teacher-gate-${{ matrix.tag }}-oof.parquet
          if-no-files-found: error
          retention-days: 14
      - name: Persist private evidence
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          tag='${{ matrix.tag }}'; out=Path(os.environ['RUNNER_TEMP'])/'out'; api=HfApi(token=os.environ['HF_TOKEN'])
          prefix=f"experiments/v6/teacher-gate/{tag}/{os.environ['GITHUB_SHA'][:12]}"
          for suffix in ('metrics.json','oof.parquet'):
              name=f'v6-teacher-gate-{tag}-{suffix}'
              api.upload_file(path_or_fileobj=str(out/name),path_in_repo=f'{prefix}/{name}',repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',commit_message=f'Store v6 teacher gate {tag} {suffix}')
          print('private_prefix',prefix)
          PY
      - if: always()
        run: rm -rf "$RUNNER_TEMP/data" "$RUNNER_TEMP/private" "$RUNNER_TEMP/out"
