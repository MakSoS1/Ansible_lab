name: E-CUP v6 teacher hybrid CI

on:
  push:
    branches: [ecup-v6-fast]
    paths:
      - .github/workflows/ecup-v6-teacher-hybrid-ci.yml
      - ecup_matching/ml/v6_teacher_hybrid.py
      - ecup_matching/tests/test_v6_teacher_hybrid.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - run: python -m pytest ecup_matching/tests/test_v6_teacher_hybrid.py -q
