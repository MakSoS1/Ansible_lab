name: E-CUP v7 candidate full CI

on:
  push:
    branches: [ecup-v7-category-token, ecup-v7-identity2]
    paths:
      - ".github/workflows/ecup-v7-candidate-full-ci.yml"
      - "ecup_matching/**"
      - "scripts/memory_policy.py"

permissions:
  contents: read

concurrency:
  group: ecup-v7-candidate-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Complete repository tests
        run: python -m pytest ecup_matching/tests -q
      - name: Memory policy
        run: python scripts/memory_policy.py
