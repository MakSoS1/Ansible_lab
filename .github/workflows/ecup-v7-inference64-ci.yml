name: E-CUP v7 inference batch CI

on:
  push:
    branches: [ecup-v7-inference64]

permissions:
  contents: read

concurrency:
  group: ecup-v7-inference64-ci
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Inference-batch RED/GREEN tests
        run: python -m pytest ecup_matching/tests/test_v7_inference_batch.py -q
      - name: Existing v7 regressions
        run: python -m pytest ecup_matching/tests/test_v7_frozen_split.py ecup_matching/tests/test_v7_neural_training.py ecup_matching/tests/test_v7_identity2.py -q
      - name: Memory policy
        run: python scripts/memory_policy.py
