name: E-CUP v7 locate frozen split manifest

on:
  workflow_dispatch:
  push:
    branches: [ecup-v7-neural]
    paths:
      - ".github/workflows/ecup-v7-locate-split.yml"

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub>=0.34,<1"
      - name: Locate and verify split-manifest candidates
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download

          repo = os.environ['HF_REPO_ID']
          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)
          paths = api.list_repo_files(repo_id=repo, repo_type='dataset')
          candidates = [p for p in paths if 'split' in p.lower() and p.lower().endswith('.json')]
          print('split_candidate_count', len(candidates))
          for path in candidates[:200]:
              try:
                  local = Path(hf_hub_download(repo_id=repo, repo_type='dataset', filename=path, token=token))
                  raw = local.read_bytes()
                  payload = json.loads(raw)
                  summary = {'path': path, 'file_sha256': hashlib.sha256(raw).hexdigest()}
                  if isinstance(payload, dict):
                      for key in ('development_rows', 'gold_rows', 'folds', 'split_sha256', 'manifest_sha256'):
                          value = payload.get(key)
                          if isinstance(value, list):
                              summary[key + '_len'] = len(value)
                          elif value is not None and not isinstance(value, (dict, list)):
                              summary[key] = value
                  print(json.dumps(summary, sort_keys=True))
              except Exception as exc:
                  print(json.dumps({'path': path, 'error': type(exc).__name__}, sort_keys=True))
          PY