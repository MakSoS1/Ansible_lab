name: E-CUP v7 locate private item data

on:
  push:
    branches: [ecup-v7-neural]
    paths:
      - ".github/workflows/ecup-v7-private-data-index.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub>=0.34,<1"
      - name: Print only candidate data paths
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          paths=api.list_repo_files(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset')
          keys=('items_human','items.parquet','matches.parquet','full_items','items_full','data/')
          selected=[p for p in paths if p.lower().endswith('.parquet') and any(k in p.lower() for k in keys)]
          print('candidate_count',len(selected))
          for p in selected[:200]: print(p)
          PY
