name: E-CUP v12 inspect historical submission artifacts

on:
  workflow_dispatch:
  push:
    branches: [ecup-v12-puregpu-main]
    paths:
      - ".github/workflows/ecup-v7-private-index.yml"

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub>=0.34,<1"
      - name: List safe historical archives and model evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          paths=api.list_repo_files(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset')
          selected=[]
          for p in paths:
              low=p.lower()
              if (low.startswith('submissions/') and low.endswith(('.zip','.json'))) or low.endswith('.safetensors') or 'production' in low or 'checkpoint' in low and not low.startswith('agent-memory/'):
                  selected.append(p)
          print('V12_ARCHIVE_PATH_COUNT',len(selected))
          for p in sorted(selected)[:2000]: print(p)
          PY
