name: E-CUP v12 inspect private v7 evidence

on:
  workflow_dispatch:
  push:
    branches: [ecup-v12-puregpu-main]
    paths:
      - ".github/workflows/ecup-v7-private-index.yml"

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub>=0.34,<1"
      - name: List only safe v7 model/OOF paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          paths = api.list_repo_files(repo_id=os.environ['HF_REPO_ID'], repo_type='dataset')
          keys = ('v7', 'identity-v2', 'identity_v2', 'rubert', 'crossencoder')
          selected = [p for p in paths if any(k in p.lower() for k in keys)]
          print('V12_V7_PATH_COUNT', len(selected))
          for path in selected[:1000]:
              print(path)
          PY
