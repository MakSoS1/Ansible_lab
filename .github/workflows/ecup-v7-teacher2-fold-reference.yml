name: E-CUP v7 recover v5 teacher2 fold reference

on:
  workflow_dispatch:
  push:
    branches: [ecup-v7-neural]
    paths:
      - ".github/workflows/ecup-v7-teacher2-fold-reference.yml"

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  TEACHER2_PREFIX: experiments/v5/teacher2/411a5349fe73

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub>=0.34,<1"
      - name: Print safe teacher2 fold metrics only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download

          safe = []
          for fold in range(5):
              path = f"{os.environ['TEACHER2_PREFIX']}/fold-{fold}/v5g-teacher2-fold-{fold}-metrics.json"
              local = hf_hub_download(
                  repo_id=os.environ['HF_REPO_ID'],
                  repo_type='dataset',
                  filename=path,
                  token=os.environ['HF_TOKEN'],
              )
              payload = json.load(open(local, encoding='utf-8'))
              row = {'fold': fold}
              for key in (
                  'macro_average_precision',
                  'strict_oof_macro_average_precision',
                  'validation_rows',
                  'held_rows',
                  'train_rows',
                  'per_category_ap',
              ):
                  if key in payload:
                      row[key] = payload[key]
              # Some historical metrics nested the score under evaluation/report.
              for nested_key in ('evaluation', 'metrics', 'report'):
                  nested = payload.get(nested_key)
                  if isinstance(nested, dict):
                      for key in ('macro_average_precision', 'per_category_ap'):
                          if key in nested and key not in row:
                              row[key] = nested[key]
              safe.append(row)
          print(json.dumps({'teacher2_reference': safe}, ensure_ascii=False, sort_keys=True))
          PY