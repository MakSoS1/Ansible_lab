name: E-CUP v7 inspect retained v5 OOF schema

on:
  push:
    branches: [ecup-v7-neural]
    paths:
      - ".github/workflows/ecup-v7-v5-oof-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  OOF_PATH: experiments/v5/category-hgb-fusion/79de99434912/v5-category-hgb-fusion-oof.parquet

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub>=0.34,<1" "pyarrow>=17,<24"
      - name: Print schema only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python - <<'PY'
          import os
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id=os.environ['HF_REPO_ID'],
              repo_type='dataset',
              filename=os.environ['OOF_PATH'],
              token=os.environ['HF_TOKEN'],
          )
          pf = pq.ParquetFile(path)
          print('rows', pf.metadata.num_rows)
          print('columns', pf.schema_arrow.names)
          print(pf.schema_arrow)
          PY
