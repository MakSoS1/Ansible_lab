name: E-CUP v8 final v5+graph submission

on:
  push:
    branches: [ecup-v8-hardsku]
    paths:
      - .github/workflows/ecup-v8-build-final.yml
      - ecup_matching/ml/v8_graph.py
      - ecup_matching/ml/v8_submission_graph.py
      - ecup_matching/submission/build_submission_v8_graph.py
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  V5_ZIP_PATH: submissions/v5/0.6018115534/ecup-v5-category-hgb-fusion-0.6018115534-submission.zip
  FIXTURE_PREFIX: experiments/v8/testlike/fixture-50k-seed2026
  FINAL_NAME: ecup-v8-v5graph-submission.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Download exact v5 best and real test-like fixture
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/v8-final/fixture"
          curl -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/datasets/${HF_REPO_ID}/resolve/main/${V5_ZIP_PATH}?download=true" \
            -o "$RUNNER_TEMP/v8-final/v5.zip"
          for f in test.parquet test_items.parquet labels.parquet metadata.json; do
            curl -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/${HF_REPO_ID}/resolve/main/${FIXTURE_PREFIX}/${f}?download=true" \
              -o "$RUNNER_TEMP/v8-final/fixture/$f"
          done
      - name: Build v8 from exact v5 payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ecup_matching.submission.build_submission_v8_graph import build_v8_from_v5_zip
          root=Path(os.environ['RUNNER_TEMP'])/'v8-final'
          result=build_v8_from_v5_zip(
              root/'v5.zip', root/os.environ['FINAL_NAME'],
              v8_graph_source=Path('ecup_matching/ml/v8_graph.py'),
              v8_submission_graph_source=Path('ecup_matching/ml/v8_submission_graph.py'),
              source_v5_metric=0.6018115534135564,
              graph_oof_delta=0.00046740999622918444,
              source_commit=os.environ['GITHUB_SHA'],
          )
          (root/'build-result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('V8_BUILD_RESULT='+json.dumps(result,sort_keys=True))
          PY
      - name: Verify archive safety and exact runtime additions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, stat, zipfile, os
          from pathlib import Path, PurePosixPath
          root=Path(os.environ['RUNNER_TEMP'])/'v8-final'; z=root/os.environ['FINAL_NAME']
          with zipfile.ZipFile(z) as f:
              infos=f.infolist(); names=[i.filename for i in infos]
              if len(names)!=len(set(names)): raise RuntimeError('duplicate archive members')
              required={'run.py','ecup_matching/submission/predict_v5.py','ecup_matching/ml/v8_graph.py','ecup_matching/ml/v8_submission_graph.py','v8_metadata.json','model_v5_structured.joblib','model_v5_hgb_meta.joblib'}
              missing=required-set(names)
              if missing: raise RuntimeError(f'missing required members: {sorted(missing)}')
              for info in infos:
                  p=PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in info.filename: raise RuntimeError(f'unsafe member {info.filename}')
                  mode=(info.external_attr>>16)&0xFFFF
                  if stat.S_IFMT(mode)==stat.S_IFLNK: raise RuntimeError(f'symlink member {info.filename}')
              run=f.read('run.py').decode('utf-8')
              for token in ('--output_path','--items_path','--matches_path','predict_to_csv_v5','apply_graph_to_prediction','dtype=np.float64'):
                  if token not in run: raise RuntimeError(f'run.py missing {token}')
              post=f.read('ecup_matching/ml/v8_submission_graph.py').decode('utf-8')
              if 'astype(np.float64' not in post or 'astype(np.float32' in post:
                  raise RuntimeError('v8 graph runtime does not preserve float64 precision')
              meta=json.loads(f.read('v8_metadata.json'))
              if meta['version']!='v8-v5-best-plus-graph' or meta['sealed_gold_opened'] is not False or meta['gold_rows_scored']!=0:
                  raise RuntimeError('v8 metadata contract failed')
          size=z.stat().st_size
          if size>=5*1024**3: raise RuntimeError(f'archive too large: {size}')
          h=hashlib.sha256()
          with z.open('rb') as fh:
              for chunk in iter(lambda:fh.read(1024*1024),b''): h.update(chunk)
          payload={'bytes':size,'sha256':h.hexdigest(),'members':len(infos),'predict_dtype':'float64'}
          (root/'archive-verification.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print('V8_ARCHIVE_VERIFIED='+json.dumps(payload,sort_keys=True))
          PY
      - name: Static organizer CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v8-final/unpacked"
          mkdir "$RUNNER_TEMP/v8-final/unpacked"
          unzip -q "$RUNNER_TEMP/v8-final/$FINAL_NAME" -d "$RUNNER_TEMP/v8-final/unpacked"
          PYTHONPATH="$RUNNER_TEMP/v8-final/unpacked" python "$RUNNER_TEMP/v8-final/unpacked/run.py" --help | grep -q -- '--matches_path'
      - name: Publish final v8 privately on HF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          root=Path(os.environ['RUNNER_TEMP'])/'v8-final'
          api=HfApi(token=os.environ['HF_TOKEN'])
          path=f"submissions/v8/v5graph/{os.environ['GITHUB_RUN_ID']}"
          for name in (os.environ['FINAL_NAME'],'build-result.json','archive-verification.json'):
              api.upload_file(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',path_or_fileobj=str(root/name),path_in_repo=f'{path}/{name}',commit_message='v8: publish verified float64 v5+graph submission')
          print('V8_PRIVATE_HF_PATH='+path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecup-v8-v5graph-submission
          path: |
            ${{ runner.temp }}/v8-final/${{ env.FINAL_NAME }}
            ${{ runner.temp }}/v8-final/build-result.json
            ${{ runner.temp }}/v8-final/archive-verification.json
          compression-level: 0
          retention-days: 14
