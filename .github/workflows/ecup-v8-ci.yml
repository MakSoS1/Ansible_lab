name: E-CUP v8 HardSKU CI

on:
  push:
    branches: [ecup-v8-hardsku]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecup-v8-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: v8 targeted unit tests
        run: |
          python -m pytest \
            ecup_matching/tests/test_v8_distribution.py \
            ecup_matching/tests/test_v8_graph.py \
            ecup_matching/tests/test_v8_testlike.py \
            ecup_matching/tests/test_v8_hardneg.py \
            ecup_matching/tests/test_v8_hardneg_probe_wrapper.py \
            ecup_matching/tests/test_v8_selection.py \
            -q
      - name: retained v7 regression tests
        run: |
          python -m pytest \
            ecup_matching/tests/test_v7_frozen_split.py \
            ecup_matching/tests/test_v7_identity2.py \
            ecup_matching/tests/test_v7_runtime_parallel.py \
            -q
      - name: memory policy
        run: python scripts/memory_policy.py
