name: E-CUP v8 fast ablation graph

on:
  push:
    branches: [ecup-v8-hardsku]
    paths:
      - .github/workflows/ecup-v8-fast-ablation-graph.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt

      - name: Download canonical human inputs and immutable ablation OOF artifacts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v8-fast-graph"; mkdir -p "$root"
          for f in matches.parquet items_human.parquet; do
            curl -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/${HF_REPO_ID}/resolve/main/${f}?download=true" \
              -o "$root/$f"
          done
          for spec in \
            'no_teacher:9116709489' \
            'no_contrastive:9116725871' \
            'structured_only:9116704276'; do
            name="${spec%%:*}"; id="${spec##*:}"
            curl -fL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$root/${name}.zip"
            mkdir "$root/${name}"
            unzip -q "$root/${name}.zip" -d "$root/${name}"
            test -n "$(find "$root/${name}" -name '*-oof.parquet' -print -quit)"
          done
          echo "diag_root=$root" >> "$GITHUB_ENV"

      - name: Evaluate graph separately inside each outer fold
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from ecup_matching.ml.v5_evaluation import macro_ap_report
          from ecup_matching.ml.v8_graph import graph_features, graph_rescore

          EXPECTED = {
              'no_teacher': 0.5931387077244183,
              'no_contrastive': 0.5928725263319,
              'structured_only': 0.5808404005946962,
          }
          CONFIG = dict(
              reciprocal_best_bonus=0.0,
              reciprocal_top3_bonus=0.0,
              endpoint_rank_weight=0.02,
              ambiguity_penalty=0.01,
          )
          root=Path(os.environ['diag_root'])
          matches=pd.read_parquet(root/'matches.parquet',columns=['id1','id2','target'])
          items=pd.read_parquet(root/'items_human.parquet',columns=['id','category']).drop_duplicates('id')
          catmap=dict(zip(items.id.tolist(),items.category.astype(str).tolist()))
          results=[]
          for name, expected in EXPECTED.items():
              oof_path=next((root/name).glob('*-oof.parquet'))
              oof=pd.read_parquet(oof_path)
              print(f'OOF_COLUMNS[{name}]={oof.columns.tolist()}',flush=True)
              score_col='fusion_oof_score' if 'fusion_oof_score' in oof.columns else ('fusion_score' if 'fusion_score' in oof.columns else None)
              required={'row_index','fold'}
              if score_col is None or not required.issubset(oof.columns):
                  raise RuntimeError(f'{name} OOF contract unsupported: {oof.columns.tolist()}')
              rows=oof.row_index.to_numpy(np.int64)
              folds=oof.fold.to_numpy(np.int8)
              score=oof[score_col].to_numpy(np.float64)
              if len(np.unique(rows)) != len(rows) or not np.isfinite(score).all(): raise RuntimeError(f'{name} invalid OOF')
              work=matches.iloc[rows].reset_index(drop=True)
              work['fold']=folds
              work['category']=work.id1.map(catmap)
              right=work.id2.map(catmap)
              if work.category.isna().any() or right.isna().any(): raise RuntimeError(f'{name} missing category')
              if not np.array_equal(work.category.astype(str).to_numpy(),right.astype(str).to_numpy()): raise RuntimeError(f'{name} cross-category pair')
              base=float(macro_ap_report(work,score,strict_official=True)['macro_average_precision'])
              if abs(base-expected)>1e-10: raise RuntimeError(f'{name} base reproduction failed {base} != {expected}')
              rescored=np.empty_like(score)
              per_fold=[]
              for fold in sorted(np.unique(folds).tolist()):
                  mask=folds==fold
                  fw=work.loc[mask,['id1','id2','category','target']].reset_index(drop=True)
                  bs=score[mask]
                  gf=graph_features(fw[['id1','id2','category']],bs)
                  gs=graph_rescore(bs,gf,**CONFIG)
                  rescored[mask]=gs
                  b=float(macro_ap_report(fw,bs)['macro_average_precision'])
                  g=float(macro_ap_report(fw,gs)['macro_average_precision'])
                  per_fold.append({'fold':int(fold),'base':b,'graph':g,'delta':g-b})
              gap=float(macro_ap_report(work,rescored,strict_official=True)['macro_average_precision'])
              result={'candidate':name,'base_macro_ap':base,'graph_macro_ap':gap,'graph_delta':gap-base,'clears_060':gap>=0.60,'all_folds_positive':all(x['delta']>0 for x in per_fold),'per_fold':per_fold,'fold_local_graph':True,'gold_opened':False}
              results.append(result)
              print('V8_FAST_GRAPH='+json.dumps(result,sort_keys=True),flush=True)
          summary={'results':results,'best':max(results,key=lambda x:x['graph_macro_ap'])['candidate'],'gold_opened':False}
          (root/'fast-ablation-graph.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('V8_FAST_GRAPH_SUMMARY='+json.dumps(summary,sort_keys=True),flush=True)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v8-fast-ablation-graph
          path: ${{ env.diag_root }}/fast-ablation-graph.json
          retention-days: 14
