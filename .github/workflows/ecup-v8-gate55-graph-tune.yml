name: E-CUP v8 gate55 graph tune

on:
  push:
    branches: [ecup-v8-hardsku]
    paths: [.github/workflows/ecup-v8-gate55-graph-tune.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Download immutable gate55 OOF and human inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v8-g55-tune"; mkdir -p "$root/oof"
          for f in matches.parquet items_human.parquet; do
            curl -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/${HF_REPO_ID}/resolve/main/${f}?download=true" -o "$root/$f"
          done
          curl -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9117904493/zip" -o "$root/oof.zip"
          unzip -q "$root/oof.zip" -d "$root/oof"
          test -s "$root/oof/v6-teacher-gate-55-oof.parquet"
          echo "diag_root=$root" >> "$GITHUB_ENV"
      - name: Tune on folds 0-1 and confirm once on 2-4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import itertools,json,os
          from pathlib import Path
          import numpy as np,pandas as pd
          from ecup_matching.ml.v5_evaluation import macro_ap_report
          from ecup_matching.ml.v8_graph import graph_features,graph_rescore

          root=Path(os.environ['diag_root'])
          oof=pd.read_parquet(root/'oof/v6-teacher-gate-55-oof.parquet')
          matches=pd.read_parquet(root/'matches.parquet',columns=['id1','id2','target'])
          items=pd.read_parquet(root/'items_human.parquet',columns=['id','category']).drop_duplicates('id')
          rows=oof.row_index.to_numpy(np.int64); folds=oof.fold.to_numpy(np.int8); base=oof.fusion_oof_score.to_numpy(np.float64)
          work=matches.iloc[rows].reset_index(drop=True); work['fold']=folds
          cmap=dict(zip(items.id.tolist(),items.category.astype(str).tolist()))
          work['category']=work.id1.map(cmap); right=work.id2.map(cmap)
          if work.category.isna().any() or right.isna().any() or not np.array_equal(work.category.astype(str),right.astype(str)):
              raise RuntimeError('category contract failed')
          base_ap=float(macro_ap_report(work,base,strict_official=True)['macro_average_precision'])
          if abs(base_ap-0.5966896566149946)>1e-10: raise RuntimeError('gate55 base reproduction failed')

          # Build graph features independently inside each outer fold once.
          feat_by_fold={}
          for fold in sorted(np.unique(folds)):
              mask=folds==fold
              fw=work.loc[mask,['id1','id2','category']].reset_index(drop=True)
              feat_by_fold[int(fold)]=graph_features(fw,base[mask])

          tune=np.isin(folds,[0,1]); confirm=np.isin(folds,[2,3,4])
          grid=[]
          for ep,ap in itertools.product([0.0,0.005,0.01,0.015,0.02,0.03,0.04,0.06],[0.0,0.0025,0.005,0.01,0.015,0.02,0.03,0.05]):
              score=np.empty_like(base)
              for fold in sorted(np.unique(folds)):
                  mask=folds==fold
                  score[mask]=graph_rescore(base[mask],feat_by_fold[int(fold)],reciprocal_best_bonus=0.0,reciprocal_top3_bonus=0.0,endpoint_rank_weight=ep,ambiguity_penalty=ap)
              tune_ap=float(macro_ap_report(work.loc[tune].reset_index(drop=True),score[tune])['macro_average_precision'])
              grid.append({'ep':ep,'ap':ap,'tune_01':tune_ap})
          chosen=max(grid,key=lambda r:(r['tune_01'],-r['ep']-r['ap']))
          score=np.empty_like(base); per_fold=[]
          for fold in sorted(np.unique(folds)):
              mask=folds==fold
              score[mask]=graph_rescore(base[mask],feat_by_fold[int(fold)],reciprocal_best_bonus=0.0,reciprocal_top3_bonus=0.0,endpoint_rank_weight=chosen['ep'],ambiguity_penalty=chosen['ap'])
              b=float(macro_ap_report(work.loc[mask].reset_index(drop=True),base[mask])['macro_average_precision'])
              g=float(macro_ap_report(work.loc[mask].reset_index(drop=True),score[mask])['macro_average_precision'])
              per_fold.append({'fold':int(fold),'base':b,'graph':g,'delta':g-b})
          confirm_ap=float(macro_ap_report(work.loc[confirm].reset_index(drop=True),score[confirm])['macro_average_precision'])
          full_ap=float(macro_ap_report(work,score,strict_official=True)['macro_average_precision'])
          payload={'chosen':chosen,'confirm_234_macro_ap':confirm_ap,'full_macro_ap':full_ap,'full_delta':full_ap-base_ap,'clears_060_full':full_ap>=0.60,'clears_060_confirm':confirm_ap>=0.60,'all_folds_positive':all(x['delta']>0 for x in per_fold),'per_fold':per_fold,'gold_opened':False}
          (root/'gate55-graph-tune.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print('V8_GATE55_TUNE='+json.dumps(payload,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v8-gate55-graph-tune
          path: ${{ env.diag_root }}/gate55-graph-tune.json
          retention-days: 14
