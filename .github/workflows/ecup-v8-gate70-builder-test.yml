name: E-CUP v8 gate70 builder test

on:
  push:
    branches: [ecup-v8-hardsku]
    paths:
      - .github/workflows/ecup-v8-gate70-builder-test.yml
      - ecup_matching/submission/build_submission_v8_gate70.py
      - ecup_matching/tests/test_build_submission_v8_gate70.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - run: python -m pytest ecup_matching/tests/test_build_submission_v8_gate70.py -q
