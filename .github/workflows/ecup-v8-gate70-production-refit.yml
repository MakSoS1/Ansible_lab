name: E-CUP v8 gate70 production refit

on:
  push:
    branches: [ecup-v8-hardsku]
    paths: [.github/workflows/ecup-v8-gate70-production-refit.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  ANCHOR_PREFIX: experiments/v5/fixed-blend/8a017cc12776
  TYPED_FUSION_PREFIX: experiments/v5/typed-explicit-fusion/681ce53c6967
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  COVERAGE: '0.70'
  BASE_OOF: '0.598287140395421'
  GRAPH_OOF: '0.6000750225512788'
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
  HF_PREFIX: experiments/v8/production/gate70

jobs:
  refit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Verify v8 graph-gated production contract
        run: |
          python -m pytest \
            ecup_matching/tests/test_v8_gate_production.py \
            ecup_matching/tests/test_v6_teacher_gate.py \
            ecup_matching/tests/test_v5_category_shrunk.py \
            ecup_matching/tests/test_v5_hgb_stack.py -q
      - name: Download immutable dev data and OOF inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          root="$RUNNER_TEMP/v8-g70"; mkdir -p "$root/data" "$root/private" "$root/out"
          curl -fL --retry 5 --retry-all-errors -o "$root/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$root/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          root=os.environ['RUNNER_TEMP']+'/v8-g70/private'; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']
          for filename in (
              f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",
              f"{os.environ['ANCHOR_PREFIX']}/v5-fixed-blend-oof.parquet",
              f"{os.environ['TYPED_FUSION_PREFIX']}/v5-typed-explicit-fusion-oof.parquet",
          ):
              print(hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=root))
          PY
          echo "refit_root=$root" >> "$GITHUB_ENV"
      - name: Fit exact gate70 production meta models using frozen graph quality gate
        shell: bash
        run: |
          set -euo pipefail
          root="$refit_root"
          python -u -m ecup_matching.ml.run_v8_gate_production \
            --coverage "$COVERAGE" \
            --base-oof-macro-ap "$BASE_OOF" \
            --graph-oof-macro-ap "$GRAPH_OOF" \
            --items "$root/data/items_human.parquet" \
            --matches "$root/data/matches.parquet" \
            --manifest "$root/private/$VALIDATION_PREFIX/split-manifest.json" \
            --anchor-oof "$root/private/$ANCHOR_PREFIX/v5-fixed-blend-oof.parquet" \
            --typed-fusion-oof "$root/private/$TYPED_FUSION_PREFIX/v5-typed-explicit-fusion-oof.parquet" \
            --category-output "$root/out/model_v6_category_shrunk.json" \
            --hgb-output "$root/out/model_v6_hgb_meta.joblib" \
            --metadata-output "$root/out/model_v6_gate_metadata.json" \
            --expected-split-sha "$SPLIT_SHA"
          python - <<'PY'
          import json,joblib,os
          from pathlib import Path
          root=Path(os.environ['refit_root'])/'out'
          meta=json.loads((root/'model_v6_gate_metadata.json').read_text())
          hgb=joblib.load(root/'model_v6_hgb_meta.joblib')
          assert meta['version']=='v8-gate-production-refit'
          assert abs(meta['coverage']-0.70)<1e-12
          assert abs(meta['base_strict_oof_macro_ap']-float(os.environ['BASE_OOF']))<1e-12
          assert abs(meta['fold_local_graph_strict_oof_macro_ap']-float(os.environ['GRAPH_OOF']))<1e-12
          assert meta['selection_gold_metric_opened'] is False and meta['selection_gold_rows_scored']==0
          assert hgb['coverage']==0.70 and hgb['split_sha256']==os.environ['SPLIT_SHA']
          print('GATE70_REFIT_OK',meta['fold_local_graph_strict_oof_macro_ap'])
          PY
      - name: Publish immutable gate70 refit to private HF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from huggingface_hub import HfApi
          root=Path(os.environ['refit_root'])/'out'; api=HfApi(token=os.environ['HF_TOKEN'])
          prefix=f"{os.environ['HF_PREFIX']}/{os.environ['GITHUB_SHA'][:12]}"
          manifest={}
          for path in sorted(root.iterdir()):
              h=hashlib.sha256(path.read_bytes()).hexdigest(); manifest[path.name]={'sha256':h,'bytes':path.stat().st_size}
              api.upload_file(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',path_or_fileobj=str(path),path_in_repo=f'{prefix}/{path.name}',commit_message=f'v8 gate70 refit {path.name}')
          m=root/'REFIT_MANIFEST.json'; m.write_text(json.dumps({'coverage':0.70,'base_oof':float(os.environ['BASE_OOF']),'graph_oof':float(os.environ['GRAPH_OOF']),'split_sha':os.environ['SPLIT_SHA'],'files':manifest,'gold_opened':False},indent=2,sort_keys=True)+'\n')
          api.upload_file(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',path_or_fileobj=str(m),path_in_repo=f'{prefix}/{m.name}',commit_message='v8 gate70 refit manifest')
          print('V8_GATE70_HF_PREFIX='+prefix)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v8-gate70-production-refit
          path: ${{ env.refit_root }}/out/
          retention-days: 14
