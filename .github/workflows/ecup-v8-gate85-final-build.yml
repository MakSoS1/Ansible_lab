name: E-CUP v8 gate85 final build

on:
  push:
    branches: [ecup-v8-hardsku]
    paths:
      - .github/workflows/ecup-v8-gate85-final-build.yml
      - ecup_matching/submission/build_submission_v8_gate85.py
      - ecup_matching/submission/predict_v5.py
      - ecup_matching/submission/predict_v6.py
      - ecup_matching/submission/v6_text_cache.py
      - ecup_matching/submission/v6_fast.py
      - ecup_matching/submission/v6_parallel.py
      - ecup_matching/ci/runtime_closure.py
      - ecup_matching/ml/v6_teacher_gate.py
      - ecup_matching/ml/v8_graph.py
      - ecup_matching/ml/v8_submission_graph.py
      - ecup_matching/tests/test_build_submission_v8_gate85.py
      - ecup_matching/tests/test_v6_parallel_text_cache.py
      - ecup_matching/tests/test_v8_measured_worker_policy.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_V6_URL: https://github.com/MakSoS1/Ansible_lab/releases/download/ecup-v6-benchmark-e2cad181b088/ecup-v6-fast-gate95-0.6006003615-submission.zip
  SOURCE_V6_SHA: d94f696d47f2924b2e6a9e26a6b8e19e0642dae8cef4e964ddce6a4c3398941c
  GATE85_ARTIFACT_ID: '9154027959'
  FINAL_NAME: ecup-v8-gate85-fp16-dualcache-graph-0.6021573019-submission.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Exact builder, dual-cache and measured-worker regressions
        run: |
          python -m pytest \
            ecup_matching/tests/test_build_submission_v8_gate85.py \
            ecup_matching/tests/test_v6_parallel_text_cache.py \
            ecup_matching/tests/test_v8_measured_worker_policy.py -q
      - name: Download exact source weights and immutable gate85 refit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v8-g85-final"; mkdir -p "$root/refit" "$root/out"
          curl -fL --retry 5 --retry-all-errors "$SOURCE_V6_URL" -o "$root/source-v6.zip"
          test "$(sha256sum "$root/source-v6.zip" | awk '{print $1}')" = "$SOURCE_V6_SHA"
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$GATE85_ARTIFACT_ID/zip" \
            -o "$root/refit-artifact.zip"
          unzip -q "$root/refit-artifact.zip" -d "$root/refit"
          for f in model_v6_category_shrunk.json model_v6_hgb_meta.joblib model_v6_gate_metadata.json REFIT_MANIFEST.json; do test -s "$root/refit/$f"; done
          echo "final_root=$root" >> "$GITHUB_ENV"
      - name: Build exact gate85 FP16 dual-cache graph ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from ecup_matching.submission.build_submission_v8_gate85 import build_v8_gate85
          root=Path(os.environ['final_root'])
          result=build_v8_gate85(
              source_v6_zip=root/'source-v6.zip',
              gate85_category_path=root/'refit/model_v6_category_shrunk.json',
              gate85_hgb_path=root/'refit/model_v6_hgb_meta.joblib',
              gate85_metadata_path=root/'refit/model_v6_gate_metadata.json',
              output_zip=root/'out'/os.environ['FINAL_NAME'],
              v8_graph_source=Path('ecup_matching/ml/v8_graph.py'),
              v8_submission_graph_source=Path('ecup_matching/ml/v8_submission_graph.py'),
              source_commit=os.environ['GITHUB_SHA'],
          )
          (root/'out/BUILD_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('FINAL_BUILD='+json.dumps(result,sort_keys=True))
          PY
      - name: Deep exact archive verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['final_root']); z=root/'out'/os.environ['FINAL_NAME']
          assert z.stat().st_size < 5*1024**3
          h=hashlib.sha256(z.read_bytes()).hexdigest()
          with zipfile.ZipFile(z) as f:
              infos=f.infolist(); names=[x.filename for x in infos]
              assert len(names)==len(set(names))
              for info in infos:
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  assert not stat.S_ISLNK((info.external_attr>>16)&0xffff)
              required={'run.py','model_v5_structured.joblib','model_v6_category_shrunk.json','model_v6_hgb_meta.joblib','model_v6_gate_metadata.json','v8_metadata.json','ecup_matching/submission/predict_v5.py','ecup_matching/submission/predict_v6.py','ecup_matching/submission/v6_text_cache.py','ecup_matching/submission/v6_parallel.py','ecup_matching/submission/v6_fast.py','ecup_matching/ml/v8_graph.py','ecup_matching/ml/v8_submission_graph.py'}
              assert required <= set(names)
              meta=json.loads(f.read('model_v6_gate_metadata.json')); v8=json.loads(f.read('v8_metadata.json'))
              assert abs(meta['coverage']-.85)<1e-12
              assert abs(meta['base_strict_oof_macro_ap']-0.5999300791828578)<1e-12
              assert abs(meta['fold_local_graph_strict_oof_macro_ap']-0.6021573018691804)<1e-12
              assert meta['graph_config']=={'rb':0.0,'rt':0.0,'ep':0.02,'ap':0.01}
              assert meta['split_sha256']=='aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b'
              assert meta['selection_gold_metric_opened'] is False and meta['selection_gold_rows_scored']==0
              assert v8['version']=='v8-gate85-fp16-dualcache-graph'
              assert v8['base']['fold_local_graph_strict_oof_macro_ap'] > 0.6018115534135564
              assert v8['runtime']['structured_worker_cap']==8 and v8['runtime']['cuda_autocast']=='float16'
              assert v8['runtime']['dual_text_cache_exact'] is True
              p5=f.read('ecup_matching/submission/predict_v5.py').decode(); p6=f.read('ecup_matching/submission/predict_v6.py').decode(); tc=f.read('ecup_matching/submission/v6_text_cache.py').decode()
              assert 'norm_cache' in p5 and '_structured_scores_streaming' in p6 and 'torch_autocast' in p6 and 'build_dual_text_cache' in p6 and 'build_dual_text_cache' in tc
              assert 'structured_workers = resolve_worker_count(8)' in p6
              run=f.read('run.py').decode(); assert 'EXPECTED_COVERAGE = 0.85' in run and 'apply_graph_to_prediction' in run
          (root/'out/SHA256SUMS.txt').write_text(f'{h}  {z.name}\n')
          print('FINAL_ARCHIVE_OK',z.stat().st_size,h)
          PY
          unzip -t "$final_root/out/$FINAL_NAME" >/dev/null
      - name: Publish exact candidate release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ecup-v8-gate85-final-${GITHUB_SHA::12}"
          gh release delete "$tag" --yes >/dev/null 2>&1 || true
          gh release create "$tag" \
            "$final_root/out/$FINAL_NAME" "$final_root/out/SHA256SUMS.txt" "$final_root/out/BUILD_RESULT.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "E-CUP v8 gate85 exact final candidate" \
            --notes "Exact gate85 + FP16 + measured worker8 + exact parallel dual text-cache + leakage-free graph candidate. Must pass separate full 275k GPU hard gate before submission."
          echo "release_tag=$tag" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v8-gate85-final-candidate
          path: |
            ${{ env.final_root }}/out/${{ env.FINAL_NAME }}
            ${{ env.final_root }}/out/SHA256SUMS.txt
            ${{ env.final_root }}/out/BUILD_RESULT.json
          retention-days: 14
