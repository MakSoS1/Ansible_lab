name: E-CUP v8 graph vs exact v5 OOF

on:
  push:
    branches: [ecup-v8-hardsku]
    paths:
      - ".github/workflows/ecup-v8-graph-v5-oof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  V5_OOF: experiments/v5/category-hgb-fusion/79de99434912/v5-category-hgb-fusion-oof.parquet

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Download exact OOF inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/v8-graph"
          for f in matches.parquet items_human.parquet "$V5_OOF"; do
            base=$(basename "$f")
            curl -fL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/${HF_REPO_ID}/resolve/main/${f}?download=true" \
              -o "$RUNNER_TEMP/v8-graph/$base"
          done
      - name: Sweep graph rescoring with untouched confirmatory folds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from sklearn.metrics import average_precision_score
          from ecup_matching.ml.v5_evaluation import macro_ap_report
          from ecup_matching.ml.v7_frozen_split import load_frozen_manifest
          from ecup_matching.ml.run_v5_pretrained_biencoder import development_rows_and_folds
          from ecup_matching.ml.v8_graph import graph_features, graph_rescore
          from ecup_matching.ml.metrics import OFFICIAL_CATEGORIES

          root=Path(os.environ['RUNNER_TEMP'])/'v8-graph'
          matches=pd.read_parquet(root/'matches.parquet', columns=['id1','id2','target'])
          items=pd.read_parquet(root/'items_human.parquet', columns=['id','category']).drop_duplicates('id')
          oof=pd.read_parquet(root/'v5-category-hgb-fusion-oof.parquet')
          print('V8_GRAPH_OOF_SCHEMA='+json.dumps({c:str(oof[c].dtype) for c in oof.columns},ensure_ascii=False,sort_keys=True))

          manifest=load_frozen_manifest(Path('ecup_matching/validation/v5_immutable_split_manifest.json'))
          dev_rows, fold_ids=development_rows_and_folds(manifest, total_rows=len(matches))
          dev_rows=np.asarray(dev_rows,dtype=np.int64); fold_ids=np.asarray(fold_ids,dtype=np.int64)

          # Resolve exact score and row alignment conservatively.
          score_candidates=[c for c in oof.columns if c.lower() not in {'row_index','fold','target','id1','id2','category'} and pd.api.types.is_numeric_dtype(oof[c])]
          if len(score_candidates)!=1:
              named=[c for c in score_candidates if 'score' in c.lower() or 'predict' in c.lower()]
              if len(named)==1: score_col=named[0]
              else: raise RuntimeError(f'ambiguous OOF score columns: {score_candidates}')
          else: score_col=score_candidates[0]

          if 'row_index' in oof:
              row_to_pos={int(r):i for i,r in enumerate(dev_rows.tolist())}
              if set(map(int,oof['row_index']))!=set(map(int,dev_rows)):
                  raise RuntimeError('OOF row_index set does not equal immutable development rows')
              order=np.asarray([row_to_pos[int(r)] for r in oof['row_index']],dtype=np.int64)
              expected_fold=fold_ids[order]
              work=matches.iloc[oof['row_index'].astype(int).to_numpy()].reset_index(drop=True)
          elif len(oof)==len(dev_rows):
              order=np.arange(len(dev_rows),dtype=np.int64); expected_fold=fold_ids
              work=matches.iloc[dev_rows].reset_index(drop=True)
          else:
              raise RuntimeError('cannot align OOF rows')
          if 'fold' in oof and not np.array_equal(oof['fold'].to_numpy(int), expected_fold):
              raise RuntimeError('OOF fold ids disagree with immutable split')
          work['fold']=expected_fold
          cats=dict(zip(items['id'].tolist(),items['category'].astype(str).tolist()))
          work['category']=work['id1'].map(cats)
          if work['category'].isna().any(): raise RuntimeError('missing category for OOF endpoint')
          right=work['id2'].map(cats).astype(str)
          if not np.array_equal(work['category'].astype(str).to_numpy(),right.to_numpy()): raise RuntimeError('cross-category human pair')
          score=oof[score_col].to_numpy(float)
          if not np.isfinite(score).all(): raise RuntimeError('nonfinite base score')

          base=macro_ap_report(work,score,strict_official=True)
          print('V8_GRAPH_BASE='+json.dumps({'score_col':score_col,**base},ensure_ascii=False,sort_keys=True))
          if abs(base['macro_average_precision']-0.6018115534135564)>1e-9:
              raise RuntimeError(f'exact v5 OOF metric mismatch: {base["macro_average_precision"]}')

          started=time.perf_counter(); features=graph_features(work[['id1','id2','category']],score); feature_sec=time.perf_counter()-started
          print('V8_GRAPH_FEATURE_TIMING='+json.dumps({'rows':len(work),'seconds':feature_sec,'rows_per_second':len(work)/feature_sec},sort_keys=True))

          configs=[]
          for rb in [0.0,0.005,0.01,0.02,0.03,0.05]:
            for rt in [0.0,0.005,0.01]:
              for ep in [0.0,0.005,0.01,0.02]:
                for ap in [0.0,0.002,0.005,0.01]:
                  configs.append((rb,rt,ep,ap))

          def macro_on(mask,s):
              rep=macro_ap_report(work.loc[mask].reset_index(drop=True),np.asarray(s)[mask],strict_official=False)
              return float(rep['macro_average_precision'])

          tune_mask=work['fold'].isin([0,1]).to_numpy()
          confirm_mask=work['fold'].isin([2,3,4]).to_numpy()
          rows=[]
          started=time.perf_counter()
          for cfg in configs:
              rb,rt,ep,ap=cfg
              s=graph_rescore(score,features,reciprocal_best_bonus=rb,reciprocal_top3_bonus=rt,endpoint_rank_weight=ep,ambiguity_penalty=ap)
              rows.append({'rb':rb,'rt':rt,'ep':ep,'ap':ap,'tune':macro_on(tune_mask,s)})
          sweep_sec=time.perf_counter()-started
          rows.sort(key=lambda x:(-x['tune'],x['rb'],x['rt'],x['ep'],x['ap']))
          # Only best config chosen on folds 0-1 is evaluated on untouched 2-4.
          best=rows[0]
          selected=graph_rescore(score,features,reciprocal_best_bonus=best['rb'],reciprocal_top3_bonus=best['rt'],endpoint_rank_weight=best['ep'],ambiguity_penalty=best['ap'])
          selected_full=macro_ap_report(work,selected,strict_official=True)
          base_tune=macro_on(tune_mask,score); base_confirm=macro_on(confirm_mask,score)
          selected_confirm=macro_on(confirm_mask,selected)
          per_fold=[]
          for fold in range(5):
              m=(work['fold'].to_numpy()==fold)
              per_fold.append({'fold':fold,'base':macro_on(m,score),'graph':macro_on(m,selected),'delta':macro_on(m,selected)-macro_on(m,score)})
          payload={
            'diagnostic_only':True,
            'selection_folds':[0,1], 'confirmatory_folds':[2,3,4],
            'base_full_macro_ap':float(base['macro_average_precision']),
            'base_tune_macro_ap':base_tune,'base_confirm_macro_ap':base_confirm,
            'selected_config':best,
            'selected_confirm_macro_ap':selected_confirm,
            'confirm_delta':selected_confirm-base_confirm,
            'selected_full_macro_ap':float(selected_full['macro_average_precision']),
            'full_delta':float(selected_full['macro_average_precision']-base['macro_average_precision']),
            'per_fold':per_fold,
            'graph_feature_seconds':feature_sec,'sweep_seconds':sweep_sec,
            'reciprocal_best_fraction':float(features['reciprocal_best'].mean()),
            'degree_gt1_fraction':float((features['max_endpoint_degree']>1).mean()),
            'top10_tune_configs':rows[:10],
            'sealed_gold_opened':False,
          }
          print('V8_GRAPH_V5_RESULT='+json.dumps(payload,ensure_ascii=False,sort_keys=True))
          (root/'v8-graph-v5-result.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v8-graph-v5-result
          path: ${{ runner.temp }}/v8-graph/v8-graph-v5-result.json
          retention-days: 14
