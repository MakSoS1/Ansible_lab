name: E-CUP v8 reusable HF asset inventory

on:
  push:
    branches: [ecup-v8-hardsku]
    paths: [.github/workflows/ecup-v8-hf-inventory.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub>=1.0,<2'
      - name: List reusable experiment and submission assets
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          files=api.list_repo_files(os.environ['HF_REPO_ID'],repo_type='dataset')
          keys=('experiments/v5/','experiments/v6/','experiments/v7/','submissions/v5/','submissions/v6/','submissions/v7/')
          keep=[f for f in files if f.startswith(keys)]
          for f in keep:
              low=f.lower()
              if any(k in low for k in ('production','submission','model','bundle','metrics','oof','zip','teacher','contrastive','hgb','structured')):
                  print('V8_HF_ASSET',f)
          print('V8_HF_ASSET_COUNT',len(keep))
          PY
