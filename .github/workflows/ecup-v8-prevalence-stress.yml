name: E-CUP v8 prevalence stress test

on:
  push:
    branches: [ecup-v8-hardsku]
    paths:
      - ".github/workflows/ecup-v8-prevalence-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  V5_OOF: experiments/v5/category-hgb-fusion/79de99434912/v5-category-hgb-fusion-oof.parquet

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Download exact v5 OOF inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/v8-prev"
          for f in matches.parquet items_human.parquet "$V5_OOF"; do
            curl -fL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/${HF_REPO_ID}/resolve/main/${f}?download=true" \
              -o "$RUNNER_TEMP/v8-prev/$(basename "$f")"
          done
      - name: Monte Carlo prevalence stress
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from sklearn.metrics import average_precision_score
          from ecup_matching.ml.v7_frozen_split import load_frozen_split_manifest
          from ecup_matching.ml.run_v5_pretrained_biencoder import development_rows_and_folds
          from ecup_matching.ml.v5_evaluation import macro_ap_report

          RETRIEVAL_PREVALENCE_RATIO=0.566880890615799
          root=Path(os.environ['RUNNER_TEMP'])/'v8-prev'
          matches=pd.read_parquet(root/'matches.parquet',columns=['id1','id2','target'])
          items=pd.read_parquet(root/'items_human.parquet',columns=['id','category']).drop_duplicates('id')
          oof=pd.read_parquet(root/'v5-category-hgb-fusion-oof.parquet')
          manifest=load_frozen_split_manifest()
          dev_rows,fold_ids=development_rows_and_folds(manifest,total_rows=len(matches))
          dev_rows=np.asarray(dev_rows,dtype=int)
          if 'row_index' in oof:
            rows=oof['row_index'].to_numpy(int)
            if set(rows.tolist())!=set(dev_rows.tolist()): raise RuntimeError('OOF row mismatch')
          else:
            rows=dev_rows
            if len(oof)!=len(rows): raise RuntimeError('OOF length mismatch')
          work=matches.iloc[rows].reset_index(drop=True)
          cats=dict(zip(items.id.tolist(),items.category.astype(str).tolist()))
          work['category']=work.id1.map(cats)
          if work.category.isna().any(): raise RuntimeError('category mapping missing')
          right=work.id2.map(cats).astype(str)
          if not np.array_equal(work.category.astype(str).to_numpy(),right.to_numpy()): raise RuntimeError('cross category pair')
          score_cols=[c for c in oof.columns if c not in {'row_index','fold','target','category','id1','id2'} and pd.api.types.is_numeric_dtype(oof[c])]
          named=[c for c in score_cols if 'score' in c.lower() or 'predict' in c.lower()]
          score_col=named[0] if len(named)==1 else score_cols[0]
          score=oof[score_col].to_numpy(float)
          base=macro_ap_report(work,score,strict_official=True)['macro_average_precision']
          if abs(base-0.6018115534135564)>1e-9: raise RuntimeError(f'base mismatch {base}')

          categories=sorted(work.category.unique())
          cat_stats={}
          for cat in categories:
            idx=np.flatnonzero(work.category.to_numpy()==cat)
            y=work.target.to_numpy(int)[idx]
            p=float(y.mean()); target_p=float(p*RETRIEVAL_PREVALENCE_RATIO)
            neg=int(np.sum(y==0)); pos=int(np.sum(y==1))
            keep_pos=int(round(target_p*neg/max(1e-12,1-target_p)))
            keep_pos=min(pos,max(1,keep_pos))
            achieved=keep_pos/(keep_pos+neg)
            cat_stats[str(cat)]={'original_prevalence':p,'target_prevalence':target_p,'planned_achieved_prevalence':achieved,'pos':pos,'neg':neg,'keep_pos':keep_pos}

          trials=[]
          per_cat_acc={cat:[] for cat in categories}
          for seed in range(2026,2126):
            rng=np.random.default_rng(seed)
            cat_aps=[]
            for cat in categories:
              idx=np.flatnonzero(work.category.to_numpy()==cat)
              y=work.target.to_numpy(int)[idx]
              neg_idx=idx[y==0]; pos_idx=idx[y==1]
              k=cat_stats[str(cat)]['keep_pos']
              selected_pos=rng.choice(pos_idx,size=k,replace=False)
              selected=np.concatenate([neg_idx,selected_pos])
              ap=float(average_precision_score(work.target.to_numpy(int)[selected],score[selected]))
              cat_aps.append(ap); per_cat_acc[cat].append(ap)
            trials.append(float(np.mean(cat_aps)))

          arr=np.asarray(trials,float)
          payload={
            'diagnostic_only':True,
            'question':'How much can AP fall if ranking scores stay fixed but category prevalence is reduced?',
            'base_v5_oof_macro_ap':float(base),
            'retrieval_pseudo_prevalence_ratio_used':RETRIEVAL_PREVALENCE_RATIO,
            'ratio_source':'LLM extreme pseudo-positive fraction / human binary prevalence; not claimed as true test prevalence',
            'trials':int(len(arr)),
            'stressed_macro_ap_mean':float(arr.mean()),
            'stressed_macro_ap_std':float(arr.std(ddof=1)),
            'stressed_macro_ap_p05':float(np.quantile(arr,.05)),
            'stressed_macro_ap_p50':float(np.quantile(arr,.50)),
            'stressed_macro_ap_p95':float(np.quantile(arr,.95)),
            'mean_drop':float(base-arr.mean()),
            'mean_ratio_to_base':float(arr.mean()/base),
            'category_plan':cat_stats,
            'per_category_stressed_mean':{str(c):float(np.mean(v)) for c,v in per_cat_acc.items()},
            'sealed_gold_opened':False,
            'true_test_prevalence_claimed':False,
          }
          print('V8_PREVALENCE_STRESS='+json.dumps(payload,ensure_ascii=False,sort_keys=True))
          (root/'v8-prevalence-stress.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v8-prevalence-stress
          path: ${{ runner.temp }}/v8-prev/v8-prevalence-stress.json
          retention-days: 14
