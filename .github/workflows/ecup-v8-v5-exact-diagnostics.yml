name: E-CUP v8 exact v5 transfer diagnostics

on:
  push:
    branches: [ecup-v8-hardsku]
    paths:
      - ".github/workflows/ecup-v8-v5-exact-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  V5_OOF: experiments/v5/category-hgb-fusion/79de99434912/v5-category-hgb-fusion-oof.parquet

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Download exact v5 OOF inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/v8-v5diag"
          for f in matches.parquet items_human.parquet "$V5_OOF"; do
            curl -fL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/${HF_REPO_ID}/resolve/main/${f}?download=true" \
              -o "$RUNNER_TEMP/v8-v5diag/$(basename "$f")"
          done
      - name: Exact metric reproduction then graph and prevalence diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from sklearn.metrics import average_precision_score
          from ecup_matching.ml.v5_evaluation import macro_ap_report
          from ecup_matching.ml.v7_frozen_split import load_frozen_split_manifest
          from ecup_matching.ml.run_v5_pretrained_biencoder import development_rows_and_folds
          from ecup_matching.ml.v8_graph import graph_features, graph_rescore

          EXPECTED=0.6018115534135564
          PREV_RATIO=0.566880890615799
          SCORE_COL='equal_rank_fusion_score'
          root=Path(os.environ['RUNNER_TEMP'])/'v8-v5diag'
          matches=pd.read_parquet(root/'matches.parquet',columns=['id1','id2','target'])
          items=pd.read_parquet(root/'items_human.parquet',columns=['id','category']).drop_duplicates('id')
          oof=pd.read_parquet(root/'v5-category-hgb-fusion-oof.parquet')
          if SCORE_COL not in oof.columns:
              raise RuntimeError(f'exact score column missing: {SCORE_COL}; columns={list(oof.columns)}')
          manifest=load_frozen_split_manifest()
          dev_rows,fold_ids=development_rows_and_folds(manifest,total_rows=len(matches))
          dev_rows=np.asarray(dev_rows,dtype=np.int64); fold_ids=np.asarray(fold_ids,dtype=np.int64)
          if 'row_index' not in oof or set(oof.row_index.astype(int).tolist())!=set(dev_rows.tolist()):
              raise RuntimeError('exact OOF row_index set mismatch')
          row_to_fold={int(r):int(f) for r,f in zip(dev_rows.tolist(),fold_ids.tolist())}
          rows=oof.row_index.to_numpy(int)
          expected_fold=np.asarray([row_to_fold[int(r)] for r in rows],dtype=np.int64)
          if 'fold' in oof and not np.array_equal(oof.fold.to_numpy(int),expected_fold):
              raise RuntimeError('exact OOF fold mismatch')
          work=matches.iloc[rows].reset_index(drop=True)
          work['fold']=expected_fold
          cats=dict(zip(items.id.tolist(),items.category.astype(str).tolist()))
          work['category']=work.id1.map(cats)
          right=work.id2.map(cats)
          if work.category.isna().any() or right.isna().any(): raise RuntimeError('missing category')
          if not np.array_equal(work.category.astype(str).to_numpy(),right.astype(str).to_numpy()):
              raise RuntimeError('cross-category pair')
          score=oof[SCORE_COL].to_numpy(np.float64)
          base=macro_ap_report(work,score,strict_official=True)
          if abs(base['macro_average_precision']-EXPECTED)>1e-12:
              raise RuntimeError(f'exact v5 reproduction failed: {base["macro_average_precision"]}')
          print('V8_EXACT_V5_REPRO='+json.dumps({'score_col':SCORE_COL,'macro_ap':base['macro_average_precision'],'rows':len(work)},sort_keys=True))

          # Prevalence stress: score ordering is frozen; only positive sampling rate changes.
          y_all=work.target.to_numpy(np.int8); cat_arr=work.category.astype(str).to_numpy()
          categories=sorted(np.unique(cat_arr).tolist())
          plan={}
          for cat in categories:
              idx=np.flatnonzero(cat_arr==cat); y=y_all[idx]
              p=float(y.mean()); target_p=p*PREV_RATIO
              neg=int(np.sum(y==0)); pos=int(np.sum(y==1))
              keep_pos=min(pos,max(1,int(round(target_p*neg/max(1e-12,1-target_p)))))
              plan[cat]={'original_prevalence':p,'target_prevalence':target_p,'pos':pos,'neg':neg,'keep_pos':keep_pos,'achieved_prevalence':keep_pos/(keep_pos+neg)}
          trials=[]
          per_cat_acc={cat:[] for cat in categories}
          for seed in range(2026,2126):
              rng=np.random.default_rng(seed); aps=[]
              for cat in categories:
                  idx=np.flatnonzero(cat_arr==cat); y=y_all[idx]
                  neg_idx=idx[y==0]; pos_idx=idx[y==1]
                  selected=np.concatenate([neg_idx,rng.choice(pos_idx,size=plan[cat]['keep_pos'],replace=False)])
                  ap=float(average_precision_score(y_all[selected],score[selected])); aps.append(ap); per_cat_acc[cat].append(ap)
              trials.append(float(np.mean(aps)))
          pa=np.asarray(trials,float)
          prevalence={
              'diagnostic_only':True,'base_macro_ap':EXPECTED,'retrieval_pseudo_prevalence_ratio':PREV_RATIO,
              'ratio_is_not_true_test_prevalence':True,'trials':len(pa),
              'stressed_mean':float(pa.mean()),'stressed_std':float(pa.std(ddof=1)),
              'p05':float(np.quantile(pa,.05)),'p50':float(np.quantile(pa,.5)),'p95':float(np.quantile(pa,.95)),
              'mean_drop':float(EXPECTED-pa.mean()),'ratio_to_base':float(pa.mean()/EXPECTED),
              'category_plan':plan,'per_category_mean':{c:float(np.mean(v)) for c,v in per_cat_acc.items()},
          }

          # Graph selection uses folds 0-1 only; 2-4 untouched confirmatory.
          t0=time.perf_counter(); gf=graph_features(work[['id1','id2','category']],score); graph_seconds=time.perf_counter()-t0
          def macro(mask,s):
              return float(macro_ap_report(work.loc[mask].reset_index(drop=True),np.asarray(s)[mask])['macro_average_precision'])
          tune=work.fold.isin([0,1]).to_numpy(); confirm=work.fold.isin([2,3,4]).to_numpy()
          configs=[(rb,rt,ep,ap) for rb in [0,.005,.01,.02,.03,.05] for rt in [0,.005,.01] for ep in [0,.005,.01,.02] for ap in [0,.002,.005,.01]]
          sweep=[]; t1=time.perf_counter()
          for rb,rt,ep,ap in configs:
              s=graph_rescore(score,gf,reciprocal_best_bonus=rb,reciprocal_top3_bonus=rt,endpoint_rank_weight=ep,ambiguity_penalty=ap)
              sweep.append({'rb':rb,'rt':rt,'ep':ep,'ap':ap,'tune':macro(tune,s)})
          sweep_seconds=time.perf_counter()-t1
          sweep.sort(key=lambda r:(-r['tune'],r['rb'],r['rt'],r['ep'],r['ap']))
          best=sweep[0]
          gs=graph_rescore(score,gf,reciprocal_best_bonus=best['rb'],reciprocal_top3_bonus=best['rt'],endpoint_rank_weight=best['ep'],ambiguity_penalty=best['ap'])
          base_confirm=macro(confirm,score); graph_confirm=macro(confirm,gs)
          graph_full=float(macro_ap_report(work,gs,strict_official=True)['macro_average_precision'])
          pf=[]
          for f in range(5):
              m=(work.fold.to_numpy()==f); b=macro(m,score); g=macro(m,gs); pf.append({'fold':f,'base':b,'graph':g,'delta':g-b})
          graph={
              'diagnostic_only':True,'selection_folds':[0,1],'confirmatory_folds':[2,3,4],
              'selected_config':best,'base_confirm':base_confirm,'graph_confirm':graph_confirm,'confirm_delta':graph_confirm-base_confirm,
              'graph_full':graph_full,'full_delta':graph_full-EXPECTED,'per_fold':pf,
              'feature_seconds':graph_seconds,'sweep_seconds':sweep_seconds,'rows':len(work),
              'reciprocal_best_fraction':float(gf.reciprocal_best.mean()),'degree_gt1_fraction':float((gf.max_endpoint_degree>1).mean()),
              'top10_tune':sweep[:10],
          }
          payload={'exact_v5_reproduced':True,'prevalence_stress':prevalence,'graph_ablation':graph,'sealed_gold_opened':False}
          print('V8_V5_EXACT_DIAGNOSTICS='+json.dumps(payload,ensure_ascii=False,sort_keys=True))
          (root/'v8-v5-exact-diagnostics.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v8-v5-exact-diagnostics
          path: ${{ runner.temp }}/v8-v5diag/v8-v5-exact-diagnostics.json
          retention-days: 14
