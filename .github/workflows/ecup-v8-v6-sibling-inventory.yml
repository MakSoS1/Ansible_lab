name: E-CUP v8 exact v6 sibling inventory

on:
  push:
    branches: [ecup-v8-hardsku]
    paths: [.github/workflows/ecup-v8-v6-sibling-inventory.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
      PREFIX: experiments/v6/teacher-gate/95/0202787447cc/
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install 'huggingface_hub>=1.0,<2'
      - name: List exact experiment siblings
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          files=api.list_repo_files(os.environ['HF_REPO_ID'],repo_type='dataset')
          siblings=[f for f in files if f.startswith(os.environ['PREFIX'])]
          for f in siblings: print('V8_V6_SIBLING='+f)
          if not siblings: raise RuntimeError('no siblings found')
          PY
