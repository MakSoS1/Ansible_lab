name: E-CUP v9 compact TDD

on:
  push:
    branches: [ecup-v9-compact]
    paths:
      - ecup_matching/tests/test_build_submission_v9_compact.py
      - ecup_matching/submission/build_submission_v9_compact.py
      - .github/workflows/ecup-v9-compact-tdd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy safetensors
      - name: Run compact builder contract
        run: python -m pytest -q ecup_matching/tests/test_build_submission_v9_compact.py
