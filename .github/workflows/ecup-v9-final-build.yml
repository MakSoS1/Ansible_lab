name: E-CUP v9 gate40 final build

on:
  push:
    branches: [ecup-v9-leaderboard-adapt]
    paths:
      - .github/workflows/ecup-v9-final-build.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_V6_URL: https://github.com/MakSoS1/Ansible_lab/releases/download/ecup-v6-benchmark-e2cad181b088/ecup-v6-fast-gate95-0.6006003615-submission.zip
  SOURCE_V6_SHA: d94f696d47f2924b2e6a9e26a6b8e19e0642dae8cef4e964ddce6a4c3398941c
  GATE40_ARTIFACT_ID: '9158411928'
  FINAL_NAME: ecup-v9-gate40-fp16-graph-0.5970059311-submission.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: V9 builder regression
        run: python -m pytest ecup_matching/tests/test_build_submission_v9_gate40.py -q
      - name: Download exact source weights and gate40 production refit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v9-final"; mkdir -p "$root/refit" "$root/out"
          curl -fL --retry 5 --retry-all-errors "$SOURCE_V6_URL" -o "$root/source-v6.zip"
          test "$(sha256sum "$root/source-v6.zip" | awk '{print $1}')" = "$SOURCE_V6_SHA"
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$GATE40_ARTIFACT_ID/zip" \
            -o "$root/refit-artifact.zip"
          unzip -q "$root/refit-artifact.zip" -d "$root/refit"
          for f in model_v6_category_shrunk.json model_v6_hgb_meta.joblib model_v6_gate_metadata.json REFIT_MANIFEST.json; do test -s "$root/refit/$f"; done
          echo "final_root=$root" >> "$GITHUB_ENV"
      - name: Build exact v9 gate40 FP16 graph ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ecup_matching.submission.build_submission_v9_gate40 import build_v9_gate40
          root=Path(os.environ['final_root'])
          result=build_v9_gate40(
              source_v6_zip=root/'source-v6.zip',
              gate40_category_path=root/'refit/model_v6_category_shrunk.json',
              gate40_hgb_path=root/'refit/model_v6_hgb_meta.joblib',
              gate40_metadata_path=root/'refit/model_v6_gate_metadata.json',
              output_zip=root/'out'/os.environ['FINAL_NAME'],
              v8_graph_source=Path('ecup_matching/ml/v8_graph.py'),
              v8_submission_graph_source=Path('ecup_matching/ml/v8_submission_graph.py'),
              source_commit=os.environ['GITHUB_SHA'],
          )
          (root/'out/BUILD_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('FINAL_BUILD='+json.dumps(result,sort_keys=True))
          PY
      - name: Deep archive contract verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['final_root']); z=root/'out'/os.environ['FINAL_NAME']
          assert z.stat().st_size < 5*1024**3
          h=hashlib.sha256()
          with z.open('rb') as fh:
              for chunk in iter(lambda:fh.read(1024*1024),b''): h.update(chunk)
          digest=h.hexdigest()
          with zipfile.ZipFile(z) as f:
              names=f.namelist(); assert len(names)==len(set(names))
              for info in f.infolist():
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  assert not stat.S_ISLNK((info.external_attr>>16)&0xFFFF)
              required={'run.py','model_v5_structured.joblib','model_v6_category_shrunk.json','model_v6_hgb_meta.joblib','model_v6_gate_metadata.json','v9_metadata.json','ecup_matching/submission/predict_v5.py','ecup_matching/submission/predict_v6.py','ecup_matching/submission/v6_parallel.py','ecup_matching/submission/v6_fast.py','ecup_matching/ml/v8_graph.py','ecup_matching/ml/v8_submission_graph.py'}
              assert required <= set(names)
              meta=json.loads(f.read('model_v6_gate_metadata.json'))
              v9=json.loads(f.read('v9_metadata.json'))
              assert meta['version']=='v9-gate40-production-refit'
              assert abs(meta['coverage']-.40)<1e-12
              assert abs(meta['base_strict_oof_macro_ap']-0.595505427416499)<1e-12
              assert abs(meta['fold_local_graph_strict_oof_macro_ap']-0.597005931143384)<1e-12
              assert abs(meta['target_stress_mean']-0.4515676235464289)<1e-12
              assert meta['graph_config']=={'rb':0.0,'rt':0.0,'ep':0.02,'ap':0.01}
              assert meta['leaderboard_anchor_used_for_fitting'] is False
              assert meta['selection_gold_metric_opened'] is False and meta['selection_gold_rows_scored']==0
              assert v9['version']=='v9-gate40-fp16-graph'
              assert v9['runtime']['structured_worker_cap']==8
              assert v9['runtime']['cuda_autocast']=='float16'
              assert v9['runtime']['outer_wall_acceptance_seconds']==700.0
              assert v9['runtime']['watchdog_seconds']==720.0
              assert v9['sealed_gold_opened'] is False and v9['gold_rows_scored']==0
              p5=f.read('ecup_matching/submission/predict_v5.py').decode(); p6=f.read('ecup_matching/submission/predict_v6.py').decode()
              assert 'norm_cache' in p5 and '_structured_scores_streaming' in p6 and 'run_structured_chunks' in p6 and 'torch_autocast' in p6
              assert b'STALE=True' not in f.read('ecup_matching/submission/predict_v6.py')
          (root/'out/SHA256SUMS.txt').write_text(f'{digest}  {z.name}\n')
          print('FINAL_ARCHIVE_OK',z.stat().st_size,digest)
          PY
          unzip -t "$final_root/out/$FINAL_NAME" >/dev/null
      - name: Publish exact candidate for corrected GPU hard gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ecup-v9-gate40-final-${GITHUB_SHA::12}"
          gh release delete "$tag" --yes >/dev/null 2>&1 || true
          gh release create "$tag" \
            "$final_root/out/$FINAL_NAME" "$final_root/out/SHA256SUMS.txt" "$final_root/out/BUILD_RESULT.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "E-CUP v9 gate40 final candidate" \
            --notes "Gate40+FP16+cap8+fold-local graph candidate. Selection evidence: graph strict OOF 0.597005931143384, target-stress mean 0.4515676235464289. Must pass corrected outer-wall RTX hard gate before submission. Leaderboard score is not claimed."
          echo "release_tag=$tag" >> "$GITHUB_ENV"
          echo "release_url=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$FINAL_NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v9-gate40-final-candidate
          path: |
            ${{ env.final_root }}/out/${{ env.FINAL_NAME }}
            ${{ env.final_root }}/out/SHA256SUMS.txt
            ${{ env.final_root }}/out/BUILD_RESULT.json
          retention-days: 14
