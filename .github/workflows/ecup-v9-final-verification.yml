name: E-CUP v9 full verification

on:
  push:
    branches: [ecup-v9-leaderboard-adapt]
    paths: [.github/workflows/ecup-v9-final-verification.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Full repository E-CUP test suite
        run: python -m pytest ecup_matching/tests -q
      - name: Canonical memory policy
        run: python scripts/memory_policy.py
