name: E-CUP v9 gate25 fallback production refit

on:
  push:
    branches: [ecup-v9-gate25-fallback]
    paths: [.github/workflows/ecup-v9-gate25-production-refit.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  ANCHOR_PREFIX: experiments/v5/fixed-blend/8a017cc12776
  TYPED_FUSION_PREFIX: experiments/v5/typed-explicit-fusion/681ce53c6967
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  COVERAGE: '0.25'
  BASE_OOF: '0.5947115591000889'
  GRAPH_OOF: '0.5961903713277379'
  TARGET_STRESS: '0.45077792061326727'
  BASE_URL: https://storage.yandexcloud.net/ozon-ecup-2026/Matching
  HF_PREFIX: experiments/v9/production/gate25-fallback

jobs:
  refit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Download immutable development inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          root="$RUNNER_TEMP/v9-g25"; mkdir -p "$root/data" "$root/private" "$root/out"
          curl -fL --retry 5 --retry-all-errors -o "$root/data/matches.parquet" "$BASE_URL/matches.parquet"
          curl -fL --retry 5 --retry-all-errors -o "$root/data/items_human.parquet" "$BASE_URL/items_human.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          root=os.environ['RUNNER_TEMP']+'/v9-g25/private'; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']
          for filename in (
              f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",
              f"{os.environ['ANCHOR_PREFIX']}/v5-fixed-blend-oof.parquet",
              f"{os.environ['TYPED_FUSION_PREFIX']}/v5-typed-explicit-fusion-oof.parquet",
          ):
              hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=root)
          PY
          echo "refit_root=$root" >> "$GITHUB_ENV"
      - name: Fit exact predeclared gate25 fallback meta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from ecup_matching.ml.run_v9_gate_production import fit_v6_gate_production
          root=Path(os.environ['refit_root'])
          meta=fit_v6_gate_production(
              coverage=float(os.environ['COVERAGE']),
              selected_oof_macro_ap=float(os.environ['GRAPH_OOF']),
              quality_gate_macro_ap=float(os.environ['GRAPH_OOF']),
              items_path=root/'data/items_human.parquet',
              matches_path=root/'data/matches.parquet',
              manifest_path=root/'private'/os.environ['VALIDATION_PREFIX']/'split-manifest.json',
              anchor_oof_path=root/'private'/os.environ['ANCHOR_PREFIX']/'v5-fixed-blend-oof.parquet',
              typed_fusion_oof_path=root/'private'/os.environ['TYPED_FUSION_PREFIX']/'v5-typed-explicit-fusion-oof.parquet',
              category_output_path=root/'out/model_v6_category_shrunk.json',
              hgb_output_path=root/'out/model_v6_hgb_meta.joblib',
              metadata_output_path=root/'out/model_v6_gate_metadata.json',
              expected_split_sha=os.environ['SPLIT_SHA'],
          )
          meta.update({
              'version':'v9-gate25-production-refit',
              'base_strict_oof_macro_ap':float(os.environ['BASE_OOF']),
              'fold_local_graph_strict_oof_macro_ap':float(os.environ['GRAPH_OOF']),
              'target_stress_mean':float(os.environ['TARGET_STRESS']),
              'target_stress_ratio':0.566880890615799,
              'graph_config':{'rb':0.0,'rt':0.0,'ep':0.02,'ap':0.01},
              'leaderboard_anchor_v7_observed_by_owner':0.36,
              'leaderboard_anchor_used_for_fitting':False,
              'selection_basis':'predeclared gate25 fallback; only activated if gate40 runtime veto fires',
              'selection_gold_metric_opened':False,
              'selection_gold_rows_scored':0,
          })
          (root/'out/model_v6_gate_metadata.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          assert abs(meta['coverage']-.25)<1e-12 and meta['selection_gold_rows_scored']==0
          print('V9_GATE25_FALLBACK_REFIT='+json.dumps(meta,sort_keys=True))
          PY
      - name: Publish fallback refit to private HF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from huggingface_hub import HfApi
          root=Path(os.environ['refit_root'])/'out'; api=HfApi(token=os.environ['HF_TOKEN']); prefix=f"{os.environ['HF_PREFIX']}/{os.environ['GITHUB_SHA'][:12]}"
          files={}
          for path in sorted(root.iterdir()):
              files[path.name]={'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size}
              api.upload_file(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',path_or_fileobj=str(path),path_in_repo=f'{prefix}/{path.name}',commit_message=f'v9 gate25 fallback {path.name}')
          m=root/'REFIT_MANIFEST.json'; m.write_text(json.dumps({'coverage':.25,'base_oof':float(os.environ['BASE_OOF']),'graph_oof':float(os.environ['GRAPH_OOF']),'target_stress_mean':float(os.environ['TARGET_STRESS']),'split_sha':os.environ['SPLIT_SHA'],'files':files,'gold_opened':False},indent=2,sort_keys=True)+'\n')
          api.upload_file(repo_id=os.environ['HF_REPO_ID'],repo_type='dataset',path_or_fileobj=str(m),path_in_repo=f'{prefix}/{m.name}',commit_message='v9 gate25 fallback manifest')
          print('V9_GATE25_HF_PREFIX='+prefix)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v9-gate25-fallback-production-refit
          path: ${{ env.refit_root }}/out/
          retention-days: 14
