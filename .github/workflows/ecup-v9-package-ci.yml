name: E-CUP v9 package CI

on:
  push:
    branches: [ecup-v9-leaderboard-adapt]
    paths:
      - .github/workflows/ecup-v9-package-ci.yml
      - ecup_matching/submission/build_submission_v9_gate40.py
      - ecup_matching/tests/test_build_submission_v9_gate40.py
      - ecup_matching/ci/runtime_closure.py
      - ecup_matching/submission/predict_v5.py
      - ecup_matching/submission/predict_v6.py
      - ecup_matching/submission/v6_parallel.py
      - ecup_matching/submission/v6_fast.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Run v9 package regression and runtime-closure tests
        run: |
          python -m pytest \
            ecup_matching/tests/test_build_submission_v9_gate40.py \
            ecup_matching/tests/test_v6_parallel.py \
            ecup_matching/tests/test_v6_fast.py -q
