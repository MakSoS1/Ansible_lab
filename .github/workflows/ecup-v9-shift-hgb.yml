name: E-CUP v9 fixed prevalence-shift HGB

on:
  push:
    branches: [ecup-v9-leaderboard-adapt]
    paths:
      - .github/workflows/ecup-v9-shift-hgb.yml
      - ecup_matching/ml/v9_shift_hgb.py
      - ecup_matching/tests/test_v9_shift_hgb.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  VALIDATION_PREFIX: experiments/v5/validation/93e439633099
  ANCHOR_PREFIX: experiments/v5/fixed-blend/8a017cc12776
  TYPED_FUSION_PREFIX: experiments/v5/typed-explicit-fusion/681ce53c6967
  SPLIT_SHA: aae58fb40f7cd481995bfa46b8bc5602134ad8779efb939a68a0ea0fbabeb55b
  POSITIVE_WEIGHT: '0.566880890615799'
  GATE40_ARTIFACT_ID: '9117908809'

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: TDD contract
        run: python -m pytest ecup_matching/tests/test_v9_shift_hgb.py -q
      - name: Download immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v9-shift-hgb"; mkdir -p "$root/private" "$root/gate40" "$root/out"
          test -n "${HF_TOKEN:-}"
          for f in matches.parquet items_human.parquet; do
            curl -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/${HF_REPO_ID}/resolve/main/${f}?download=true" -o "$root/$f"
          done
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          root=os.environ['RUNNER_TEMP']+'/v9-shift-hgb/private'; repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']
          for filename in (f"{os.environ['VALIDATION_PREFIX']}/split-manifest.json",f"{os.environ['ANCHOR_PREFIX']}/v5-fixed-blend-oof.parquet",f"{os.environ['TYPED_FUSION_PREFIX']}/v5-typed-explicit-fusion-oof.parquet"):
              hf_hub_download(repo_id=repo,repo_type='dataset',filename=filename,token=token,local_dir=root)
          PY
          curl -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GATE40_ARTIFACT_ID}/zip" -o "$root/gate40.zip"
          unzip -q "$root/gate40.zip" -d "$root/gate40"
          test -s "$root/gate40/v6-teacher-gate-40-oof.parquet"
          echo "shift_root=$root" >> "$GITHUB_ENV"
      - name: Cross-fit fixed prior-shift HGB and compare exact baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          import numpy as np,pandas as pd
          from sklearn.metrics import average_precision_score
          from ecup_matching.ml.data_subset import select_items_by_ids
          from ecup_matching.ml.run_v5_fixed_blend import align_oof_frame
          from ecup_matching.ml.run_v5_pretrained_biencoder import development_rows_and_folds
          from ecup_matching.ml.run_v5_typed_explicit_fusion import CURRENT5_COLUMNS
          from ecup_matching.ml.v5_evaluation import macro_ap_report
          from ecup_matching.ml.v5_fixed_blend import percentile_rank
          from ecup_matching.ml.v5_validation import manifest_sha256
          from ecup_matching.ml.v6_teacher_gate import build_teacher_gated_scores
          from ecup_matching.ml.v8_graph import graph_features,graph_rescore
          from ecup_matching.ml.v9_shift_hgb import crossfit_shift_hgb_stack

          root=Path(os.environ['shift_root']); ratio=float(os.environ['POSITIVE_WEIGHT']); split_sha=os.environ['SPLIT_SHA']
          manifest=json.loads((root/'private'/os.environ['VALIDATION_PREFIX']/'split-manifest.json').read_text()); assert manifest_sha256(manifest)==split_sha
          matches=pd.read_parquet(root/'matches.parquet',columns=['id1','id2','target']); rows,folds=development_rows_and_folds(manifest,total_rows=len(matches)); rows=np.asarray(rows,np.int64); folds=np.asarray(folds,np.int16)
          anchor=align_oof_frame([root/'private'/os.environ['ANCHOR_PREFIX']/'v5-fixed-blend-oof.parquet'],expected_rows=rows,expected_folds=folds,required_columns=tuple(CURRENT5_COLUMNS.values()),source_name='v9-shift-anchor')
          typed=align_oof_frame([root/'private'/os.environ['TYPED_FUSION_PREFIX']/'v5-typed-explicit-fusion-oof.parquet'],expected_rows=rows,expected_folds=folds,required_columns=('typed_explicit_score',),source_name='v9-shift-typed')
          dev=matches.iloc[rows].reset_index(drop=True); ids=pd.unique(pd.concat([dev.id1,dev.id2],ignore_index=True)); items=select_items_by_ids(root/'items_human.parquet',ids,include_attributes=False); cmap=items.set_index('id').category.astype(str); dev['category']=dev.id1.map(cmap); assert not dev.category.isna().any()
          six={**{name:anchor[col].to_numpy(float) for name,col in CURRENT5_COLUMNS.items()},'typed_explicit':typed.typed_explicit_score.to_numpy(float)}
          categories=dev.category.astype(str).to_numpy(); target=dev.target.to_numpy(np.int8); gated,mask=build_teacher_gated_scores(six,categories,coverage=.40)
          old=pd.read_parquet(root/'gate40/v6-teacher-gate-40-oof.parquet').sort_values('row_index').reset_index(drop=True)
          order=np.argsort(rows); inv=np.empty_like(order); inv[order]=np.arange(len(order))
          # Artifact row order is canonical dev row order; assert rather than silently align.
          assert np.array_equal(old.row_index.to_numpy(np.int64),rows)
          assert np.array_equal(old.fold.to_numpy(np.int16),folds)
          category_oof=old.category_shrunk_oof_score.to_numpy(float); baseline=old.fusion_oof_score.to_numpy(float)
          result=crossfit_shift_hgb_stack(gated,target,categories,folds,positive_weight=ratio)
          shifted_hgb=np.asarray(result['oof_score'],float); fusion=.5*percentile_rank(category_oof)+.5*percentile_rank(shifted_hgb)
          baseline_ap=float(macro_ap_report(dev,baseline,strict_official=True)['macro_average_precision']); shift_ap=float(macro_ap_report(dev,fusion,strict_official=True)['macro_average_precision'])
          cfg=dict(reciprocal_best_bonus=0.0,reciprocal_top3_bonus=0.0,endpoint_rank_weight=.02,ambiguity_penalty=.01)
          def fold_graph(score):
            out=np.empty_like(score); deltas=[]
            for fold in sorted(np.unique(folds).tolist()):
              m=folds==fold; frame=dev.loc[m,['id1','id2','category','target']].reset_index(drop=True); base=score[m]; gf=graph_features(frame[['id1','id2','category']],base); gs=graph_rescore(base,gf,**cfg); out[m]=gs
              b=float(macro_ap_report(frame,base)['macro_average_precision']); g=float(macro_ap_report(frame,gs)['macro_average_precision']); deltas.append({'fold':int(fold),'base':b,'graph':g,'delta':g-b})
            return out,deltas
          baseline_graph,_=fold_graph(baseline); shift_graph,shift_deltas=fold_graph(fusion)
          base_graph_ap=float(macro_ap_report(dev,baseline_graph,strict_official=True)['macro_average_precision']); shift_graph_ap=float(macro_ap_report(dev,shift_graph,strict_official=True)['macro_average_precision'])
          cats=categories; y=target
          plans={}
          for cat in sorted(np.unique(cats).tolist()):
            idx=np.flatnonzero(cats==cat); cy=y[idx]; p=float(cy.mean()); tp=p*ratio; neg=int(np.sum(cy==0)); pos=int(np.sum(cy==1)); keep=min(pos,max(1,int(round(tp*neg/max(1e-12,1-tp))))); plans[cat]=(idx,cy,keep)
          def stress(score):
            vals=[]
            for seed in range(2026,2126):
              rng=np.random.default_rng(seed); aps=[]
              for cat in sorted(plans):
                idx,cy,k=plans[cat]; neg=idx[cy==0]; pos=idx[cy==1]; sel=np.concatenate([neg,rng.choice(pos,size=k,replace=False)]); aps.append(float(average_precision_score(y[sel],score[sel])))
              vals.append(float(np.mean(aps)))
            a=np.asarray(vals); return {'mean':float(a.mean()),'std':float(a.std(ddof=1)),'p05':float(np.quantile(a,.05)),'p95':float(np.quantile(a,.95))}
          base_stress=stress(baseline_graph); shift_stress=stress(shift_graph)
          payload={'version':'v9-fixed-prior-shift-hgb-v1','positive_weight':ratio,'teacher_coverage':.40,'strict_baseline':baseline_ap,'strict_shift_hgb':shift_ap,'strict_delta':shift_ap-baseline_ap,'graph_baseline':base_graph_ap,'graph_shift_hgb':shift_graph_ap,'graph_delta_vs_baseline':shift_graph_ap-base_graph_ap,'shift_graph_per_fold':shift_deltas,'all_shift_graph_folds_positive':all(x['delta']>0 for x in shift_deltas),'stress_baseline':base_stress,'stress_shift_hgb':shift_stress,'stress_mean_delta':shift_stress['mean']-base_stress['mean'],'post_result_weight_search':False,'leaderboard_anchor_used_for_fitting':False,'sealed_gold_opened':False,'gold_rows_scored':0}
          (root/'out/v9-shift-hgb.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n'); print('V9_SHIFT_HGB='+json.dumps(payload,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v9-shift-hgb
          path: ${{ env.shift_root }}/out/v9-shift-hgb.json
          retention-days: 14
