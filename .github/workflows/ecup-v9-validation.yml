name: E-CUP v9 leaderboard-shift validation

on:
  push:
    branches: [ecup-v9-leaderboard-adapt]
    paths: [.github/workflows/ecup-v9-validation.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HF_REPO_ID: Maksim123321/e-cup-2026-matching-private
  RETRIEVAL_PREVALENCE_RATIO: '0.566880890615799'

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ecup_matching/requirements-ci.txt
      - run: python -m pip install -r ecup_matching/requirements-ci.txt
      - name: Verify graph and metric contracts
        run: python -m pytest ecup_matching/tests/test_v8_graph.py ecup_matching/tests/test_metrics.py -q
      - name: Download immutable gate25/gate40 OOF and canonical human inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v9-validation"; mkdir -p "$root"; test -n "${HF_TOKEN:-}"
          for f in matches.parquet items_human.parquet; do
            curl -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/${HF_REPO_ID}/resolve/main/${f}?download=true" -o "$root/$f"
          done
          for spec in '25:9117863396' '40:9117908809'; do
            gate="${spec%%:*}"; id="${spec##*:}"
            curl -fL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$root/gate-${gate}.zip"
            mkdir "$root/gate-${gate}"; unzip -q "$root/gate-${gate}.zip" -d "$root/gate-${gate}"
          done
          echo "v9_validation_root=$root" >> "$GITHUB_ENV"
      - name: Evaluate strict OOF, fold-local graph and target prevalence stress
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from sklearn.metrics import average_precision_score
          from ecup_matching.ml.v5_evaluation import macro_ap_report
          from ecup_matching.ml.v8_graph import graph_features, graph_rescore

          EXPECTED={25:0.5947115591000889,40:0.595505427416499}
          CONFIG=dict(reciprocal_best_bonus=0.0,reciprocal_top3_bonus=0.0,endpoint_rank_weight=0.02,ambiguity_penalty=0.01)
          ratio=float(os.environ['RETRIEVAL_PREVALENCE_RATIO'])
          root=Path(os.environ['v9_validation_root'])
          matches=pd.read_parquet(root/'matches.parquet',columns=['id1','id2','target'])
          items=pd.read_parquet(root/'items_human.parquet',columns=['id','category']).drop_duplicates('id')
          catmap=dict(zip(items.id.tolist(),items.category.astype(str).tolist()))
          results=[]
          for gate, expected in EXPECTED.items():
            oof=pd.read_parquet(root/f'gate-{gate}'/f'v6-teacher-gate-{gate}-oof.parquet')
            rows=oof.row_index.to_numpy(np.int64); folds=oof.fold.to_numpy(np.int8); base_score=oof.fusion_oof_score.to_numpy(float)
            if len(np.unique(rows))!=len(rows) or not np.isfinite(base_score).all(): raise RuntimeError('invalid OOF contract')
            work=matches.iloc[rows].reset_index(drop=True)
            work['category']=work.id1.map(catmap)
            if work.category.isna().any(): raise RuntimeError('missing category')
            if not np.array_equal(work.category.astype(str).to_numpy(),work.id2.map(catmap).astype(str).to_numpy()): raise RuntimeError('cross-category pair')
            base=float(macro_ap_report(work,base_score,strict_official=True)['macro_average_precision'])
            if abs(base-expected)>1e-10: raise RuntimeError(f'base reproduction failed gate{gate}: {base}')
            graph=np.empty_like(base_score); per_fold=[]
            for fold in sorted(np.unique(folds).tolist()):
              mask=folds==fold; fw=work.loc[mask,['id1','id2','category','target']].reset_index(drop=True); fs=base_score[mask]
              gf=graph_features(fw[['id1','id2','category']],fs); gs=graph_rescore(fs,gf,**CONFIG); graph[mask]=gs
              b=float(macro_ap_report(fw,fs)['macro_average_precision']); g=float(macro_ap_report(fw,gs)['macro_average_precision'])
              per_fold.append({'fold':int(fold),'base':b,'graph':g,'delta':g-b})
            graph_ap=float(macro_ap_report(work,graph,strict_official=True)['macro_average_precision'])

            cats=work.category.astype(str).to_numpy(); y=work.target.to_numpy(np.int8)
            plans={}
            for cat in sorted(np.unique(cats).tolist()):
              idx=np.flatnonzero(cats==cat); cy=y[idx]; p=float(cy.mean()); tp=float(p*ratio); neg=int(np.sum(cy==0)); pos=int(np.sum(cy==1))
              keep=min(pos,max(1,int(round(tp*neg/max(1e-12,1-tp)))))
              plans[cat]={'keep_pos':keep,'pos':pos,'neg':neg,'original_prevalence':p,'target_prevalence':tp}
            trials=[]
            for seed in range(2026,2126):
              rng=np.random.default_rng(seed); aps=[]
              for cat in sorted(plans):
                idx=np.flatnonzero(cats==cat); cy=y[idx]; neg_idx=idx[cy==0]; pos_idx=idx[cy==1]; k=plans[cat]['keep_pos']
                sel=np.concatenate([neg_idx,rng.choice(pos_idx,size=k,replace=False)])
                aps.append(float(average_precision_score(y[sel],graph[sel])))
              trials.append(float(np.mean(aps)))
            arr=np.asarray(trials,float)
            result={
              'gate':gate,'teacher_fraction':float(oof.teacher_selected.mean()),
              'strict_oof_macro_ap':base,'fold_local_graph_macro_ap':graph_ap,'graph_delta':graph_ap-base,
              'all_graph_folds_positive':all(x['delta']>0 for x in per_fold),'per_fold':per_fold,
              'target_stress_ratio':ratio,'target_stress_mean':float(arr.mean()),'target_stress_std':float(arr.std(ddof=1)),
              'target_stress_p05':float(np.quantile(arr,.05)),'target_stress_p95':float(np.quantile(arr,.95)),
              'leaderboard_anchor_v7_observed_by_owner':0.36,'leaderboard_anchor_used_for_fitting':False,
              'sealed_gold_opened':False,'gold_rows_scored':0,
            }
            print('V9_CANDIDATE='+json.dumps(result,ensure_ascii=False,sort_keys=True),flush=True); results.append(result)
          summary={'version':'v9-validation-v2','graph_config':{'rb':0.0,'rt':0.0,'ep':0.02,'ap':0.01},'retrieval_prevalence_ratio':ratio,
                   'results':results,'leaderboard_anchor_v7_observed_by_owner':0.36,'leaderboard_anchor_used_for_fitting':False,
                   'sealed_gold_opened':False,'gold_rows_scored':0}
          (root/'v9-validation.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('V9_VALIDATION='+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecup-v9-validation
          path: ${{ env.v9_validation_root }}/v9-validation.json
          retention-days: 14
