name: One-time secret RSA bridge

on:
  push:
    branches: [ecup-matching-2026]
    paths: ['V13_HF_BRIDGE_REQUEST.json']

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Validate public key request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import base64,hashlib,json
          from pathlib import Path
          p=json.load(open('V13_HF_BRIDGE_REQUEST.json'))
          assert set(p)=={'public_pem_b64','public_key_sha256','purpose'}
          assert p['purpose']=='private-hf-upload'
          data=base64.b64decode(p['public_pem_b64'],validate=True)
          assert hashlib.sha256(data).hexdigest()==p['public_key_sha256']
          Path('/tmp/bridge-public.pem').write_bytes(data)
          print('PUBLIC_KEY_SHA256='+p['public_key_sha256'])
          PY
          openssl pkey -pubin -in /tmp/bridge-public.pem -noout
      - name: Encrypt repository secret to supplied public key
        shell: bash
        env:
          BRIDGE_SECRET: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_SECRET"
          printf '%s' "$BRIDGE_SECRET" > /tmp/bridge-secret
          openssl pkeyutl -encrypt -pubin -inkey /tmp/bridge-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/bridge-secret -out /tmp/bridge-secret.enc
          install -d -m 700 bridge-output
          base64 -w0 /tmp/bridge-secret.enc > bridge-output/ciphertext.b64
          printf '%s\n' "$PUBLIC_KEY_SHA256" > bridge-output/public-key-sha256.txt
          rm -f /tmp/bridge-secret /tmp/bridge-secret.enc /tmp/bridge-public.pem
          echo BRIDGE_CIPHERTEXT_READY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: one-time-rsa-ciphertext-${{ github.run_id }}
          path: bridge-output
          retention-days: 1
          if-no-files-found: error
