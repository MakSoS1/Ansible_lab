name: Patch v4 memory preparation order

on:
  push:
    branches:
      - ecup-matching-2026
    paths:
      - .github/workflows/patch-v4-memory-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Move BERT load after CPU-heavy preparation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ecup_matching/ml/train_v4_reranker.py')
          text = path.read_text(encoding='utf-8')
          old_start = '''    _verify_model_revision(model_name, base_model_revision)\n    torch, tokenizer, model = _load_local_model(\n        model_name, gradient_checkpointing=gradient_checkpointing\n    )\n    cuda_device = torch.cuda.get_device_name(0)\n\n    # Reproduce the retained structured anchor from raw competition data so the\n'''
          new_start = '''    _verify_model_revision(model_name, base_model_revision)\n\n    # Reproduce the retained structured anchor from raw competition data so the\n'''
          old_insert = '''    aligned = _align_structured_validation(valid, structured_validation_path)\n    structured_scores = aligned[STRUCTURED_COLUMN].to_numpy(float)\n\n    stages_runtime: dict[str, Any] = {}\n'''
          new_insert = '''    aligned = _align_structured_validation(valid, structured_validation_path)\n    structured_scores = aligned[STRUCTURED_COLUMN].to_numpy(float)\n\n    # Keep the large transformer out of RAM while structured/weak preprocessing\n    # materializes its bounded CPU-side frames. This preserves the exact data\n    # recipe while avoiding the WSL peak that previously killed the runner.\n    torch, tokenizer, model = _load_local_model(\n        model_name, gradient_checkpointing=gradient_checkpointing\n    )\n    cuda_device = torch.cuda.get_device_name(0)\n\n    stages_runtime: dict[str, Any] = {}\n'''
          if text.count(old_start) != 1:
              raise SystemExit(f'expected start anchor once, got {text.count(old_start)}')
          if text.count(old_insert) != 1:
              raise SystemExit(f'expected insert anchor once, got {text.count(old_insert)}')
          text = text.replace(old_start, new_start, 1)
          text = text.replace(old_insert, new_insert, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify focused RED becomes GREEN
        run: |
          python -m pip install -r ecup_matching/requirements-ci.txt
          python -m pytest ecup_matching/tests/test_train_v4_reranker.py::test_train_v4_prepares_memory_heavy_inputs_before_loading_bert ecup_matching/tests/test_train_v2_structured.py::test_streaming_prefilter_matches_in_memory_sampling_exactly -q

      - name: Commit exact patch
        run: |
          git config user.name 'E-CUP trusted automation'
          git config user.email '90937209+MakSoS1@users.noreply.github.com'
          git add ecup_matching/ml/train_v4_reranker.py
          git commit -m 'fix: prepare v4 data before loading bert'
          git push origin HEAD:ecup-matching-2026
