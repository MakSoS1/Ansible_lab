name: Patch v4 organizer smoke output permissions

on:
  push:
    branches: [ecup-matching-2026]
    paths:
      - .github/workflows/patch-v4-smoke-output.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Patch ephemeral smoke output directory only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ecup-v4-retain-shrunk-blend.yml')
          text = path.read_text(encoding='utf-8')
          old = '          mkdir -p "$ROOT/runtime" "$ROOT/out"\n          python - <<\'PY\'\n'
          new = (
              '          mkdir -p "$ROOT/runtime" "$ROOT/out"\n'
              '          # The organizer image runs under its own UID. Only this ephemeral\n'
              '          # hosted-runner output directory is writable; submission/model inputs remain read-only.\n'
              '          chmod 0777 "$ROOT/out"\n'
              '          python - <<\'PY\'\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected smoke output anchor once, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify workflow contains one scoped chmod
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ecup-v4-retain-shrunk-blend.yml').read_text(encoding='utf-8')
          assert text.count('chmod 0777 "$ROOT/out"') == 1
          assert 'chmod -R 0777' not in text
          print('scoped_smoke_permission_patch_ok')
          PY

      - name: Commit exact patch
        run: |
          git config user.name 'E-CUP trusted automation'
          git config user.email '90937209+MakSoS1@users.noreply.github.com'
          git add .github/workflows/ecup-v4-retain-shrunk-blend.yml
          git commit -m 'fix: allow organizer smoke output write'
          git push origin HEAD:ecup-matching-2026
