name: HITCON SPI TPM - offline client unit tests

on:
  push:
    branches: [ctf/spi-tpm-2026]
    paths:
      - .github/workflows/spi-tpm-client-tests.yml
      - ctf/spi-tpm-2026/client.py
      - ctf/spi-tpm-2026/test_client.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout only repository data without persisted token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile standalone protocol client
        shell: bash
        run: python3 -m py_compile ctf/spi-tpm-2026/client.py ctf/spi-tpm-2026/test_client.py
      - name: Run purely offline STP1 parsing and scrypt handshake tests
        shell: bash
        run: python3 -m unittest discover -v -s ctf/spi-tpm-2026 -p 'test_client.py'
