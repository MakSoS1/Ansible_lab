name: HITCON 2026 SPI TPM - decompile verified firmware and service

on:
  push:
    branches: [ctf/spi-tpm-2026]
    paths:
      - .github/workflows/spi-tpm-decompile.yml

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify archive and extract only four selected ELF files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsS --proto '=https' --max-redirs 0 --connect-timeout 15 --max-time 120 --max-filesize 30000000 \
            'https://ctf2026attach.hitconctf.com/654627eea204ea708368d11d316e6555/spi-tpm-rev-e15a21887cc92581.tar.gz' -o challenge.tar.gz
          echo 'e15a21887cc925818a5bdb0e6b669028bc30c94bbfc1fe0a06f4c5a4c543ad94  challenge.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile,pathlib,os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'elffiles';out.mkdir()
          allowed={'libspi_tpm_firmware.so','spi-tpm-service','spi_tpm_client.ko','spi_tpm_dma.ko'}
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'challenge.tar.gz') as tar:
              for entry in tar:
                  if pathlib.PurePosixPath(entry.name).name in allowed:
                      assert entry.isfile() and entry.size<800000
                      (out/pathlib.PurePosixPath(entry.name).name).write_bytes(tar.extractfile(entry).read())
          assert len(list(out.iterdir()))==4
          PY
      - name: Download SHA256-pinned official Ghidra distribution
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --proto '=https' --proto-redir '=https' \
            --connect-timeout 12 --retry 2 --max-time 300 --max-filesize 650000000 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip' -o ghidra.zip
          echo '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  ghidra.zip' | sha256sum -c -
          unzip -q ghidra.zip
          java -version
      - name: Prepare own read-only Ghidra analysis script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/DumpRelevant.java" <<'JAVA'
          import ghidra.app.script.GhidraScript;
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.program.model.listing.*;
          import ghidra.program.model.symbol.*;
          import ghidra.program.model.address.*;
          import java.util.*;

          public class DumpRelevant extends GhidraScript {
              private void pick(Map<String,Function> funcs, Map<String,String> why, Function f, String reason) {
                  if (f == null) return;
                  String key = f.getEntryPoint().toString();
                  if (!funcs.containsKey(key)) {
                      funcs.put(key, f);
                      why.put(key, reason);
                  }
              }
              @Override
              public void run() throws Exception {
                  String pname = currentProgram.getName();
                  println("=== DECOMPILER TARGET === " + pname);
                  DecompInterface decomp = new DecompInterface();
                  decomp.openProgram(currentProgram);
                  Listing listing=currentProgram.getListing();
                  FunctionManager fm=currentProgram.getFunctionManager();
                  TreeMap<String,Function> selected=new TreeMap<>();
                  Map<String,String> reasons=new HashMap<>();
                  if (pname.endsWith(".so")) {
                      FunctionIterator it=fm.getFunctions(true);
                      while (it.hasNext()) {
                          Function f=it.next();
                          long addr=f.getEntryPoint().getOffset();
                          if (addr>=0x1200 && addr<=0x3fff) pick(selected,reasons,f,"firmware function");
                      }
                  } else if (pname.endsWith(".ko")) {
                      FunctionIterator it=fm.getFunctions(true);
                      while (it.hasNext()) {
                          Function f=it.next();
                          if (f.getName().contains("spi_tpm")) pick(selected,reasons,f,"named driver function");
                      }
                  } else {
                      String[] needles={"SPI-TPM reverse service","get_flag","encrypt flag", "gen_new_key",
                                        "commands: get_flag","budget %lu","error syntax","plaintext ",
                                        "ciphertext ", "genkey", "encrypt", "decrypt", "budget "};
                      int count=0;
                      DataIterator iter=listing.getDefinedData(true);
                      while (iter.hasNext() && count<110) {
                          Data data=iter.next();
                          Object v=data.getValue();
                          if (v==null) continue;
                          String s=v.toString();
                          boolean match=false;
                          for(String needle:needles) if(s.contains(needle)){match=true;break;}
                          if(!match) continue;
                          count++;
                          println("RELEVANT STRING "+data.getAddress()+" "+s.substring(0,Math.min(200,s.length())));
                          Reference[] refs=currentProgram.getReferenceManager().getReferencesTo(data.getAddress());
                          for (Reference ref: refs)
                              pick(selected,reasons,fm.getFunctionContaining(ref.getFromAddress()),"xref "+s.substring(0,Math.min(40,s.length())));
                      }
                      println("Selected candidate functions: "+selected.size());
                      Function f=fm.getFunctionAt(currentProgram.getEntryPoint());
                      pick(selected,reasons,f,"entrypoint");
                  }
                  int n=0;
                  for(String key:selected.keySet()) {
                      if(n++>=32) break;
                      Function f=selected.get(key);
                      DecompileResults res=decomp.decompileFunction(f,30,monitor);
                      println("<<< FUNCTION "+f.getName()+" "+f.getEntryPoint()+" "+reasons.get(key)+" >>>");
                      if(res.decompileCompleted() && res.getDecompiledFunction()!=null){
                          String c=res.getDecompiledFunction().getC();
                          println(c.substring(0,Math.min(27000,c.length())));
                      }else println("DECOMPILATION FAILED: "+res.getErrorMessage());
                  }
                  decomp.dispose();
              }
          }
          JAVA
          find "$RUNNER_TEMP" -maxdepth 2 -name 'analyzeHeadless' -type f -print
      - name: Decompile firmware x86-64
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          GHIDRA_ROOT="$(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)"
          mkdir -p "$RUNNER_TEMP/ghidra_projects"
          "$GHIDRA_ROOT/support/analyzeHeadless" "$RUNNER_TEMP/ghidra_projects" firmware \
            -import "$RUNNER_TEMP/elffiles/libspi_tpm_firmware.so" -analysisTimeoutPerFile 90 \
            -scriptPath "$RUNNER_TEMP" -postScript DumpRelevant.java -deleteProject
      - name: Decompile kernel client driver ARM64
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          GHIDRA_ROOT="$(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)"
          "$GHIDRA_ROOT/support/analyzeHeadless" "$RUNNER_TEMP/ghidra_projects" module \
            -import "$RUNNER_TEMP/elffiles/spi_tpm_client.ko" -analysisTimeoutPerFile 90 \
            -scriptPath "$RUNNER_TEMP" -postScript DumpRelevant.java -deleteProject
      - name: Decompile ARM64 service main and command handlers
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          GHIDRA_ROOT="$(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)"
          "$GHIDRA_ROOT/support/analyzeHeadless" "$RUNNER_TEMP/ghidra_projects" service \
            -import "$RUNNER_TEMP/elffiles/spi-tpm-service" -analysisTimeoutPerFile 180 \
            -scriptPath "$RUNNER_TEMP" -postScript DumpRelevant.java -deleteProject
      - name: Diagnose remote reachability without sending commands
        shell: bash
        run: |
          python3 - <<'PY'
          import time,socket
          host='spi-tpm-rev.chal.hitconctf.com'
          print('DNS')
          try: print([(x[0],x[4]) for x in socket.getaddrinfo(host,1337,proto=socket.IPPROTO_TCP)])
          except Exception as e: print('DNS fail',str(e))
          t=time.monotonic()
          try:
              with socket.create_connection((host,1337),timeout=7) as s:
                  print('TCP connected after %.2fs'%(time.monotonic()-t))
                  s.settimeout(18)
                  print('REMOTE BANNER:',repr(s.recv(2000)))
          except Exception as e: print('TCP/READ problem',type(e).__name__,str(e),'time',time.monotonic()-t)
          PY
