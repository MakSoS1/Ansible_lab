name: HITCON SPI TPM pwn - publish verified public challenge bytes
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths: [.github/workflows/spi-tpm-pwn-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact contest archive and confirm pinned SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' --max-redirs 0 --max-time 100 --max-filesize 50000000 \
            'https://ctf2026attach.hitconctf.com/d72ad1da709d0aca3b881f11a651420a/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz' \
            -o "$RUNNER_TEMP/pwn.tar.gz"
          echo "db1d27f883a2e5e8f73c2b1c6b4b77e0ebfe14642676cce6cadfca4c9d9e173d  $RUNNER_TEMP/pwn.tar.gz" | sha256sum -c -
          mkdir -p checked
          cp "$RUNNER_TEMP/pwn.tar.gz" checked/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz
      - name: Upload only preverified public competition attachment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spi-tpm-pwn-public-archive
          path: checked/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
