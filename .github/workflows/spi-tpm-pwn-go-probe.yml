name: HITCON SPI TPM Pwn - offline ARM64 Go concurrency probe
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths:
      - .github/workflows/spi-tpm-pwn-go-probe.yml

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Cross compile ARM64 static diagnostic from reviewed Go source
        shell: bash
        run: |
          set -euo pipefail
          go version
          GO111MODULE=off GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/payload" ctf/spi-tpm-pwn-2026/go_probe.go
          file "$RUNNER_TEMP/payload"
          sha256sum "$RUNNER_TEMP/payload"
      - name: Fetch and verify only contest files needed for offline VM
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' --max-redirs 0 --connect-timeout 12 --max-time 110 --max-filesize 50000000 \
            'https://ctf2026attach.hitconctf.com/d72ad1da709d0aca3b881f11a651420a/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz' \
            -o "$RUNNER_TEMP/challenge.tar.gz"
          echo "db1d27f883a2e5e8f73c2b1c6b4b77e0ebfe14642676cce6cadfca4c9d9e173d  $RUNNER_TEMP/challenge.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import os,hashlib,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          target=root/'guest';target.mkdir()
          expected={
            'run.sh':'5ebb883eb5fd3b0154fc4f4d7e4fbb9c1218c2a067197017d917bfbbc5292e7f',
            'qemu-system-aarch64':'6291b5b075f7e0cedcff4e46cb135f0b8d6e93d94c5973784c034c16eba662bb',
            'Image':'5d696920c82c11ae4a6921834f65b6d92118d74088176e4c41c8e56f2a237953',
            'initramfs.cpio.gz':'6a680f86b790bb592229da80feab14baf723b3dc5a0ebcdc77d7bb82aa13356a',
            'libspi_tpm_firmware.so':'1bd76fdd713d7c1003e27e418813e0444c3a2a780bf895836f093048b5cc7a40'
          }
          with tarfile.open(root/'challenge.tar.gz') as tf:
            for name,sha in expected.items():
              full=('spi-tpm-pwn/' if name=='run.sh' else 'spi-tpm-pwn/src/')+name
              member=tf.getmember(full)
              assert member.isfile() and 0<member.size<16000000
              data=tf.extractfile(member).read()
              assert hashlib.sha256(data).hexdigest()==sha,(name,'unexpected SHA256')
              p=target/name;p.write_bytes(data);p.chmod(0o755 if name in ('run.sh','qemu-system-aarch64') else 0o644)
          (target/'flag').write_text('hitcon{ONLY_LOCAL_FAKE_FLAG}\n')
          PY
      - name: Construct signed-package offline container without using contest Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'FROM archlinux:base' \
            'RUN pacman -Syu --noconfirm --needed cpio dtc && pacman -Scc --noconfirm' \
            'USER 1000:1000' \
            'WORKDIR /opt/guest' \
            'ENTRYPOINT ["/bin/bash", "/opt/guest/run.sh"]' > "$RUNNER_TEMP/Dockerfile"
          docker build --pull -q -t spi-tpm-pwn-go-sandbox:local -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
      - name: Execute cross-compiled diagnostic ONLY inside network-disabled synthetic flag VM
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import base64,os,subprocess,select,time
          root=os.environ['RUNNER_TEMP']
          argv=['docker','run','--rm','-i','--network=none','--read-only',
                '--cap-drop=ALL','--security-opt=no-new-privileges',
                '--pids-limit=128','--memory=1g','--cpus=2',
                '--tmpfs=/tmp:rw,nosuid,nodev,size=128m',
                '-v',root+'/guest:/opt/guest:ro',
                '-e','VM_TIMEOUT=130','spi-tpm-pwn-go-sandbox:local']
          p=subprocess.Popen(argv,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,bufsize=0)
          start=time.monotonic()
          deadline=start+115
          output=bytearray()
          phase=0
          try:
            while time.monotonic()<deadline and p.poll() is None:
              r,_,_=select.select([p.stdout],[],[],.35)
              if not r:continue
              data=os.read(p.stdout.fileno(),32768)
              if not data:break
              output.extend(data)
              print(data.decode('utf8','replace')[-6000:],end='',flush=True)
              if phase==0 and b'Base64 payload' in output:
                raw=open(root+'/payload','rb').read()
                assert 150000<len(raw)<10000000
                p.stdin.write(base64.b64encode(raw)+b'\n')
                p.stdin.flush()
                phase=1
                print('UPLOAD_OK length=',len(raw),flush=True)
              if phase==1 and b'SPI TPM challenge' in output:
                p.stdin.write(b'/home/spi-tpm/payload\n')
                p.stdin.flush()
                phase=2
                print('STARTED_UNPRIV_GO_PROBE',flush=True)
              if b'PROBE_DONE' in output:
                break
            print('EXECUTION_COMPLETE phase=',phase,'done=',b'PROBE_DONE' in output,'duration=',round(time.monotonic()-start,2),flush=True)
            assert b'PROBE_DONE' in output,'payload did not finish in bound'
          finally:
            if p.poll() is None:p.kill()
            p.wait(timeout=8)
          PY
