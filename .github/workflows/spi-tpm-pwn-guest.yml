name: HITCON SPI TPM pwn - isolated guest permission audit
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths: [.github/workflows/spi-tpm-pwn-guest.yml]
permissions:
  contents: read

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download only official SHA256-pinned contest files, do not run on runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' --max-redirs 0 --max-time 110 --max-filesize 50000000 \
            'https://ctf2026attach.hitconctf.com/d72ad1da709d0aca3b881f11a651420a/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz' \
            -o "$RUNNER_TEMP/input.tar.gz"
          echo "db1d27f883a2e5e8f73c2b1c6b4b77e0ebfe14642676cce6cadfca4c9d9e173d  $RUNNER_TEMP/input.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import pathlib,tarfile,os,hashlib
          t=pathlib.Path(os.environ['RUNNER_TEMP'])
          output=t/'guest';output.mkdir()
          checks={
            'run.sh':'5ebb883eb5fd3b0154fc4f4d7e4fbb9c1218c2a067197017d917bfbbc5292e7f',
            'qemu-system-aarch64':'6291b5b075f7e0cedcff4e46cb135f0b8d6e93d94c5973784c034c16eba662bb',
            'Image':'5d696920c82c11ae4a6921834f65b6d92118d74088176e4c41c8e56f2a237953',
            'initramfs.cpio.gz':'6a680f86b790bb592229da80feab14baf723b3dc5a0ebcdc77d7bb82aa13356a',
            'libspi_tpm_firmware.so':'1bd76fdd713d7c1003e27e418813e0444c3a2a780bf895836f093048b5cc7a40',
          }
          with tarfile.open(t/'input.tar.gz') as tf:
            for name,expected in checks.items():
              path=('spi-tpm-pwn/' if name=='run.sh' else 'spi-tpm-pwn/src/')+name
              entry=tf.getmember(path)
              assert entry.isfile() and entry.size<16000000
              blob=tf.extractfile(entry).read()
              assert hashlib.sha256(blob).hexdigest()==expected, name
              target=output/name
              target.write_bytes(blob)
              target.chmod(0o755 if name in ('run.sh','qemu-system-aarch64') else 0o644)
          (output/'flag').write_text('hitcon{LOCAL_SANDBOX_FAKE}\n')
          (output/'flag').chmod(0o644)
          PY
      - name: Build independently authored Arch container with signed packages
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Dockerfile" <<'DOCKER'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed cpio dtc && pacman -Scc --noconfirm
          USER 1000:1000
          WORKDIR /opt/guest
          ENTRYPOINT ["/bin/bash", "/opt/guest/run.sh"]
          DOCKER
          docker build --pull -q -t spi-tpm-pwn-guest:local -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
      - name: Read-only inspection of guest uid, flag permissions, device and CPU
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pty,subprocess,select,time
          directory=os.environ['RUNNER_TEMP']+'/guest'
          argv=[
            'docker','run','--rm','-i','-t','--network=none','--read-only',
            '--cap-drop=ALL','--security-opt=no-new-privileges',
            '--pids-limit=64','--memory=1g','--cpus=2',
            '--tmpfs=/tmp:rw,nosuid,nodev,size=200m',
            '-v',directory+':/opt/guest:ro','-e','VM_TIMEOUT=80',
            'spi-tpm-pwn-guest:local'
          ]
          print('SAFE: offline container, fake flag, no GitHub credentials',flush=True)
          master,slave=pty.openpty()
          p=subprocess.Popen(argv,stdin=slave,stdout=slave,stderr=slave,close_fds=True)
          os.close(slave)
          t=time.monotonic();phase=0;buf=b'';nextcmd=0
          commands=[
            b'id',
            b'/bin/spi_tpm genkey',
            b'X=$(printf "%04056d" 0)',
            b'/bin/spi_tpm encrypt 1 1 "$X" >/tmp/max_cipher',
            b'wc -c /tmp/max_cipher',
            b'Y=$(cat /tmp/max_cipher)',
            b'/bin/spi_tpm decrypt "$Y" >/tmp/roundtrip',
            b'wc -c /tmp/roundtrip',
            b'echo BOUNDARY_END',
            b'exit'
          ]
          last=time.monotonic()
          while time.monotonic()-t<65 and p.poll() is None:
            rd,_,_=select.select([master],[],[],.3)
            if rd:
              try:chunk=os.read(master,5000)
              except OSError:break
              if not chunk:break
              buf+=chunk
              print(chunk.decode('utf8','replace'),end='',flush=True)
              if phase==0 and b'Base64 payload' in buf:
                os.write(master,b'\n');phase=1;print('sent blank payload',flush=True)
              if phase==1 and b'SPI TPM challenge' in buf:
                phase=2;last=time.monotonic()
            if phase==2 and nextcmd<len(commands) and time.monotonic()-last>=.8:
              cmd=commands[nextcmd]
              assert b'\n' not in cmd and len(cmd)<100
              print('COMMAND:',cmd.decode(),flush=True)
              os.write(master,cmd+b'\n')
              nextcmd+=1;last=time.monotonic()
            if nextcmd>=len(commands) and b'TEST_END' in buf and time.monotonic()-last>=1:break
          if p.poll() is None:p.kill()
          try:p.wait(timeout=5)
          except:pass
          os.close(master)
          print('FINISHED phase=',phase,'commands=',nextcmd,'exit=',p.returncode,'elapsed=',round(time.monotonic()-t,2))
          assert phase==2, 'guest was not ready'
          PY
