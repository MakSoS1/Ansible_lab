name: HITCON SPI TPM pwn - trusted offline QEMU monitor virtual physical memory
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths: [.github/workflows/spi-tpm-pwn-hmp-memory.yml]
permissions:
  contents: read

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download only official SHA256-pinned contest files, do not run on runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' --max-redirs 0 --max-time 110 --max-filesize 50000000 \
            'https://ctf2026attach.hitconctf.com/d72ad1da709d0aca3b881f11a651420a/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz' \
            -o "$RUNNER_TEMP/input.tar.gz"
          echo "db1d27f883a2e5e8f73c2b1c6b4b77e0ebfe14642676cce6cadfca4c9d9e173d  $RUNNER_TEMP/input.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import pathlib,tarfile,os,hashlib
          t=pathlib.Path(os.environ['RUNNER_TEMP'])
          output=t/'guest';output.mkdir()
          checks={
            'run.sh':'5ebb883eb5fd3b0154fc4f4d7e4fbb9c1218c2a067197017d917bfbbc5292e7f',
            'qemu-system-aarch64':'6291b5b075f7e0cedcff4e46cb135f0b8d6e93d94c5973784c034c16eba662bb',
            'Image':'5d696920c82c11ae4a6921834f65b6d92118d74088176e4c41c8e56f2a237953',
            'initramfs.cpio.gz':'6a680f86b790bb592229da80feab14baf723b3dc5a0ebcdc77d7bb82aa13356a',
            'libspi_tpm_firmware.so':'1bd76fdd713d7c1003e27e418813e0444c3a2a780bf895836f093048b5cc7a40',
          }
          with tarfile.open(t/'input.tar.gz') as tf:
            for name,expected in checks.items():
              path=('spi-tpm-pwn/' if name=='run.sh' else 'spi-tpm-pwn/src/')+name
              entry=tf.getmember(path)
              assert entry.isfile() and entry.size<16000000
              blob=tf.extractfile(entry).read()
              assert hashlib.sha256(blob).hexdigest()==expected, name
              target=output/name
              target.write_bytes(blob)
              target.chmod(0o755 if name in ('run.sh','qemu-system-aarch64') else 0o644)
          (output/'flag').write_text('hitcon{LOCAL_SANDBOX_FAKE}\n')
          (output/'flag').chmod(0o644)
          PY
      - name: Build independently authored Arch container with signed packages
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Dockerfile" <<'DOCKER'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed cpio dtc && pacman -Scc --noconfirm
          USER 1000:1000
          WORKDIR /opt/guest
          ENTRYPOINT ["/bin/bash", "/opt/guest/run.sh"]
          DOCKER
          docker build --pull -q -t spi-tpm-pwn-guest:local -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
      - name: Read QEMU monitor guest kernel virtual/physical addresses (no exploit, offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,socket,subprocess,select,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          p=root/'guest/run.sh'
          src=p.read_text()
          assert src.count('-monitor none')==1
          p.write_text(src.replace('-monitor none','-monitor unix:/opt/io/hmp.sock,server,nowait'))
          io=root/'monitor'
          io.mkdir(mode=0o777)
          io.chmod(0o777)
          args=['docker','run','--rm','-i','--network','none',
                '--read-only','--cap-drop=ALL','--security-opt=no-new-privileges',
                '--pids-limit=64','--memory=1g','--cpus=2',
                '--tmpfs','/tmp:rw,nosuid,nodev,mode=1777,size=200m',
                '-v',str(root/'guest')+':/opt/guest:ro',
                '-v',str(io)+':/opt/io:rw',
                '-e','VM_TIMEOUT=60','spi-tpm-pwn-guest:local']
          q=subprocess.Popen(args,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,bufsize=0)
          start=time.monotonic();phase=0;total=b'';monitor=None
          cmds=[
           'xp /8wx 0x40200000',
           'xp /8wx 0x405b80b0',
           'x /8gx 0xffff8000803b80b0',
           'x /8gx 0xfffffdffc1016e00',
           'x /8gx 0xfffffdffc100ee00',
           'x /8gx 0xffff800080231060',
           'info registers'
          ]
          while time.monotonic()-start<40:
              if q.poll() is not None:break
              ready,_,_=select.select([q.stdout],[],[],.20)
              if ready:
                  d=os.read(q.stdout.fileno(),4096)
                  if not d:break
                  total+=d
                  if len(total)>16000:total=total[-16000:]
                  print('GUEST',d[:400].decode('utf8','replace'),flush=True)
                  if phase==0 and b'Base64 payload' in total:
                      q.stdin.write(b'\n');q.stdin.flush();phase=1
                  if phase==1 and b'SPI TPM challenge' in total:
                      phase=2
              if monitor is None and (io/'hmp.sock').exists():
                  subprocess.run(['sudo','chmod','0666',str(io/'hmp.sock')],check=True,timeout=5)
                  monitor=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM)
                  monitor.settimeout(2)
                  monitor.connect(str(io/'hmp.sock'))
                  print('MONITOR_CONNECTED',flush=True)
                  try:print(monitor.recv(4096).decode('utf8','replace'),flush=True)
                  except socket.timeout:pass
              if monitor and phase>=2:
                  for cmd in cmds:
                      print('MONITOR_COMMAND',cmd,flush=True)
                      monitor.sendall((cmd+'\n').encode())
                      time.sleep(.10)
                      resp=b''
                      for _ in range(8):
                          try:
                              chunk=monitor.recv(4096)
                              if not chunk:break
                              resp+=chunk
                              if b'(qemu)' in resp:break
                          except socket.timeout:break
                      print('MONITOR_RESULT',resp.decode('utf8','replace')[:4000],flush=True)
                  break
          if monitor:
              monitor.close()
          if q.poll() is None:q.kill()
          try:q.wait(timeout=5)
          except:pass
          print('OFFLINE_QEMU_RESEARCH_FINISHED',phase,flush=True)
          assert phase==2 and monitor is not None
          PY
