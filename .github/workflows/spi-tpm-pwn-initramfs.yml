name: HITCON SPI TPM pwn - safely inspect embedded ARM64 rootfs
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths: [.github/workflows/spi-tpm-pwn-initramfs.yml]

permissions:
  contents: read

jobs:
  rootfs-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download and SHA256-check archived root filesystem
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' --max-redirs 0 --connect-timeout 12 --max-time 100 \
            --max-filesize 50000000 \
            'https://ctf2026attach.hitconctf.com/d72ad1da709d0aca3b881f11a651420a/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz' \
            -o "$RUNNER_TEMP/challenge.tar.gz"
          echo "db1d27f883a2e5e8f73c2b1c6b4b77e0ebfe14642676cce6cadfca4c9d9e173d  $RUNNER_TEMP/challenge.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,os,pathlib,tarfile
          b=pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(b/'challenge.tar.gz','r:gz') as tf:
              e=tf.getmember('spi-tpm-pwn/src/initramfs.cpio.gz')
              assert e.isfile() and e.size==1164830
              data=tf.extractfile(e).read()
          assert hashlib.sha256(data).hexdigest()=='6a680f86b790bb592229da80feab14baf723b3dc5a0ebcdc77d7bb82aa13356a'
          (b/'rootfs.cpio.gz').write_bytes(data)
          PY
      - name: Read list of CPIO paths, small text/configs and executable metadata, no execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,gzip,io,hashlib,re
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'rootfs.cpio.gz'
          with gzip.open(p,'rb') as f:
              data=f.read(25_000_001)
          if len(data)>25_000_000:raise ValueError("rootfs too large")
          print("DECOMPRESSED",len(data))
          off=0; count=0
          while off<len(data):
              head=data[off:off+110]
              if len(head)<110 or head[:6] not in (b'070701',b'070702'):
                  print("PARSE END",off,data[off:off+20]);break
              fields=[int(head[6+i*8:14+i*8],16) for i in range(13)]
              size,name_size,mode=fields[6],fields[11],fields[1]
              assert name_size<1024 and size<20_000_000
              name_start=off+110
              name=data[name_start:name_start+name_size].rstrip(b'\0').decode('utf8','replace')
              off=(name_start+name_size+3)&~3
              blob=data[off:off+size]
              off=(off+size+3)&~3
              assert len(blob)==size and count<1000
              count+=1
              print("\nCPIO",repr(name),'mode',oct(mode),'size',size,'sha256',hashlib.sha256(blob).hexdigest())
              if name=="TRAILER!!!":break
              if (mode & 0o170000)==0o100000 and size<=55000:
                  try:
                      txt=blob.decode('utf8')
                      if '\0' not in txt and sum(ch.isprintable() or ch in '\r\n\t' for ch in txt)/max(len(txt),1)>.84:
                          print("BEGIN UNTRUSTED TEXT",repr(name))
                          print(txt[:20000])
                          print("END UNTRUSTED TEXT")
                  except UnicodeError:pass
              if (mode & 0o170000)==0o100000 and size>55000:
                  print("ELF?",blob[:12].hex())
                  for phrase in re.findall(rb'[\x20-\x7e]{12,}',blob)[:55]:
                      print("STR",phrase[:240].decode('ascii','replace'))
          PY
