name: HITCON SPI TPM pwn - static QEMU device layout
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths: [.github/workflows/spi-tpm-pwn-qemu-static.yml]
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' --max-redirs 0 --max-time 100 --max-filesize 50000000 \
            'https://ctf2026attach.hitconctf.com/d72ad1da709d0aca3b881f11a651420a/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz' \
            -o "$RUNNER_TEMP/tar.gz"
          echo "db1d27f883a2e5e8f73c2b1c6b4b77e0ebfe14642676cce6cadfca4c9d9e173d  $RUNNER_TEMP/tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import os,pathlib,hashlib,tarfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(p/'tar.gz') as t:
             m=t.getmember('spi-tpm-pwn/src/qemu-system-aarch64')
             assert m.isfile() and m.size==11527272
             b=t.extractfile(m).read()
          assert hashlib.sha256(b).hexdigest()=='6291b5b075f7e0cedcff4e46cb135f0b8d6e93d94c5973784c034c16eba662bb'
          (p/'qemu').write_bytes(b)
          PY
          echo '=== HEADER ==='
          readelf -h "$RUNNER_TEMP/qemu" | head -45
          echo '=== SECTION INDEX ==='
          readelf -SW "$RUNNER_TEMP/qemu" | tail -48
          echo '=== CUSTOM EMBEDDED SYMBOLS ==='
          nm -C "$RUNNER_TEMP/qemu" 2>&1 | grep -iE 'spi_tpm|stm32|dma|symbol' | head -90 || true
          echo '=== CUSTOM STRINGS ==='
          strings -t x "$RUNNER_TEMP/qemu" | grep -iE 'spi.tpm|stm32.h7|dma.*backend|sram.*backend|dma.desc|dma.*error|dma.*mem|dma.*src|dma.*dst|mmio' | head -200 || true
