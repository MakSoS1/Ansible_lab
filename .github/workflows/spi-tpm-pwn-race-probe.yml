name: SPI TPM pwn - offline concurrency probe and kernel symbols
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths: [.github/workflows/spi-tpm-pwn-race-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Download exact official challenge with fixed SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsS --proto '=https' --max-redirs 0 --max-time 90 --max-filesize 50000000 'https://ctf2026attach.hitconctf.com/d72ad1da709d0aca3b881f11a651420a/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz' -o ctf.tar.gz
          echo 'db1d27f883a2e5e8f73c2b1c6b4b77e0ebfe14642676cce6cadfca4c9d9e173d  ctf.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import pathlib,tarfile
          out=pathlib.Path('guest');out.mkdir()
          with tarfile.open('ctf.tar.gz') as tf:
            for name in ['run.sh','src/Image','src/initramfs.cpio.gz','src/qemu-system-aarch64','src/libspi_tpm_firmware.so']:
              m=tf.getmember('spi-tpm-pwn/'+name)
              assert m.isfile() and m.size<16000000
              p=out/pathlib.PurePosixPath(name).name
              p.write_bytes(tf.extractfile(m).read());p.chmod(0o755 if name.endswith('run.sh') or name.endswith('qemu-system-aarch64') else 0o644)
          (out/'flag').write_text('hitcon{LOCAL_RACE_TEST_ONLY}\n')
          PY
      - name: Build own ARM64 diagnostic program and extract kernel symbols
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          mkdir -p output
          cat > "$RUNNER_TEMP/probe.c" <<'C'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <pthread.h>
          #include <signal.h>
          #include <sched.h>
          #include <time.h>
          #include <errno.h>
          #include <string.h>
          struct crypt {uint32_t key,cost,inlen,outlen,cap; int32_t status; uint64_t in,out,res[2];};
          struct gen {uint32_t key; int32_t status; uint64_t res[2];};
          static uint32_t key;
          static volatile int done;
          static pthread_t threads[2];
          static void handler(int s) {(void)s;}
          static double stamp(void){struct timespec t;clock_gettime(CLOCK_MONOTONIC,&t);return t.tv_sec+t.tv_nsec*1e-9;}
          static void *worker(void *arg){
            long id=(long)arg; cpu_set_t set;CPU_ZERO(&set);CPU_SET(id,&set);sched_setaffinity(0,sizeof(set),&set);
            int fd=open("/dev/spi-tpm0",O_RDWR); if(fd<0){perror("device");return 0;}
            unsigned char in[4000],out[4096];memset(in,0x41+id,sizeof(in));
            int errs=0;double start=stamp();
            for(int i=0;i<160;i++){
              struct crypt c={.key=key,.cost=1,.inlen=(i%2?8:4000),.cap=4096,.in=(uint64_t)in,.out=(uint64_t)out};
              double t=stamp();errno=0;int r=ioctl(fd,0xc0384302UL,&c);double dt=stamp()-t;
              if(r<0 || c.status || c.outlen!=((c.inlen+3)&~3U)+40 || memcmp(out,"STP1",4))errs++;
              if(i<3 || r<0 || c.status || dt<0.04 || i%40==0)printf("CPU%ld i=%d ioctl=%d errno=%d status=%d len=%u dt=%.5f errors=%d\n",id,i,r,errno,c.status,c.outlen,dt,errs);
            }
            printf("CPU%ld DONE errors=%d elapsed=%.3f\n",id,errs,stamp()-start);close(fd);return 0;
          }
          static void *signaler(void *arg){(void)arg;while(!done){usleep(1300);pthread_kill(threads[0],SIGUSR1);pthread_kill(threads[1],SIGUSR1);}return 0;}
          int main(void){
            setvbuf(stdout,0,_IONBF,0);printf("PROBE uid=%u pid=%d page=%ld\n",getuid(),getpid(),sysconf(_SC_PAGESIZE));
            struct sigaction sa={.sa_handler=handler};sigemptyset(&sa.sa_mask);sigaction(SIGUSR1,&sa,0);
            int fd=open("/dev/spi-tpm0",O_RDWR);struct gen g={0};if(fd<0||ioctl(fd,0xc0184301UL,&g)||g.status){perror("genkey");return 1;}key=g.key;close(fd);printf("key=%u\n",key);
            pthread_t sig;pthread_create(&threads[0],0,worker,(void*)0L);pthread_create(&threads[1],0,worker,(void*)1L);pthread_create(&sig,0,signaler,0);
            pthread_join(threads[0],0);pthread_join(threads[1],0);done=1;pthread_join(sig,0);puts("PROBE_COMPLETE");return 0;
          }
          C
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -static -pthread "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/payload"
          cp "$RUNNER_TEMP/probe.c" output/probe.c
          python3 -m pip install --quiet --disable-pip-version-check vmlinux-to-elf==1.3.6
          vmlinux-to-elf "$RUNNER_TEMP/guest/Image" output/kernel.elf
          aarch64-linux-gnu-nm -n output/kernel.elf > output/kernel.syms
          for fn in stm32h7_spi_irq_thread stm32_spi_dma_rx_cb stm32h7_spi_disable spi_transfer_wait; do
            aarch64-linux-gnu-objdump -d --no-show-raw-insn --disassemble="$fn" output/kernel.elf
          done > output/spi-kernel.dis
      - name: Build reviewed container with signed packages (never run challenge on host)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'FROM archlinux:base' 'RUN pacman -Syu --noconfirm --needed cpio dtc && pacman -Scc --noconfirm' 'USER 1000:1000' 'WORKDIR /opt/guest' 'ENTRYPOINT ["/bin/bash", "/opt/guest/run.sh"]' > "$RUNNER_TEMP/Dockerfile"
          docker build --pull -q -t spi-pwn-probe:local -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
      - name: Run unprivileged diagnostic payload only in offline constrained VM
        shell: bash
        run: |
          python3 -u - <<'PY'
          import base64,os,pathlib,subprocess,select,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          args=['docker','run','--rm','-i','--network=none','--read-only','--cap-drop=ALL','--security-opt=no-new-privileges','--pids-limit=96','--memory=1g','--cpus=2','--tmpfs=/tmp:rw,nosuid,nodev,mode=1777,size=100m','-v',str(root/'guest')+':/opt/guest:ro','-e','VM_TIMEOUT=120','spi-pwn-probe:local']
          p=subprocess.Popen(args,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,bufsize=0)
          start=time.monotonic();buf=b'';phase=0;log=pathlib.Path('output/guest.log').open('wb')
          try:
            while time.monotonic()-start<110 and p.poll() is None:
              ready,_,_=select.select([p.stdout],[],[],.25)
              if not ready:continue
              data=os.read(p.stdout.fileno(),16384)
              if not data:break
              buf+=data;log.write(data);log.flush();print(data.decode('utf8','replace'),end='',flush=True)
              if phase==0 and b'Base64 payload' in buf:
                payload=base64.b64encode((root/'payload').read_bytes())+b'\n'
                assert len(payload)<4000000
                p.stdin.write(payload);p.stdin.flush();phase=1
              elif phase==1 and b'# ' in buf:
                p.stdin.write(b'/home/spi-tpm/payload\n');p.stdin.flush();phase=2
              if b'PROBE_COMPLETE' in buf:
                p.stdin.write(b'exit\n');p.stdin.flush();break
          finally:
            log.close()
            if p.poll() is None:p.kill()
            p.wait()
          assert b'PROBE_COMPLETE' in buf,'bounded test did not finish'
          PY
      - name: Save only static kernel symbols and fake-flag diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spi-pwn-race-probe
          path: output/
          if-no-files-found: error
          retention-days: 2
