name: SPI TPM pwn - freestanding offline concurrency experiment
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths:
      - .github/workflows/spi-tpm-pwn-raw-probe.yml
      - ctf/spi-tpm-pwn-2026/raw_probe.c
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile freestanding own ARM64 source and run isolated reviewed harness
        shell: bash
        run: |
          python3 -u - <<'PY'
          import pathlib,subprocess,textwrap,hashlib,os
          p=pathlib.Path('.github/workflows/spi-tpm-pwn-race-probe.yml')
          b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='4fb55b2a7c27c6b0a5a4b0144eec58d2abc7e2cf'
          lines=b.decode().splitlines(keepends=True);blocks=[];i=0
          while i<len(lines):
            if lines[i].rstrip()=='        run: |':
              i+=1;acc=[]
              while i<len(lines) and (lines[i].startswith('          ') or not lines[i].strip()):
                acc.append(lines[i]);i+=1
              blocks.append(textwrap.dedent(''.join(acc)))
            else:i+=1
          assert len(blocks)==4
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          pathlib.Path('output').mkdir()
          subprocess.run(['clang','--target=aarch64-linux-gnu','-fuse-ld=lld','-nostdlib','-static','-ffreestanding','-fno-builtin','-fno-stack-protector','-O2','-Wl,-e,_start,-s','ctf/spi-tpm-pwn-2026/raw_probe.c','-o',str(root/'payload')],check=True,timeout=20)
          for idx in (0,2,3):
            print('=== ISOLATED PROBE STEP',idx,'===',flush=True)
            subprocess.run(['bash','-euo','pipefail','-c',blocks[idx]],check=True,timeout=150)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spi-pwn-raw-probe-observations
          path: output/
          retention-days: 2
          if-no-files-found: error
