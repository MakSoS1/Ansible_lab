name: HITCON SPI TPM pwn - validate official service protocol (read-only)
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths:
      - .github/workflows/spi-tpm-pwn-remote-read.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify pre-reviewed Python client compiles
        shell: bash
        run: python3 -m py_compile ctf/spi-tpm-pwn-2026/connect.py
      - name: Attempt bounded CTF-only TCP connect, valid PoW and read-only guest metadata
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "CTF probe attempt $attempt/3"
            if python3 -u ctf/spi-tpm-pwn-2026/connect.py \
               --read-only-probe --connect-timeout 12 --pow-timeout 275; then
              exit 0
            fi
            sleep 7
          done
          exit 1
