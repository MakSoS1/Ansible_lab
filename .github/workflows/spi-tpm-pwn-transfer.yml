name: SPI TPM Pwn - verified archive artifact for offline research
on:
  push:
    branches: [ctf/spi-tpm-pwn-2026]
    paths: [.github/workflows/spi-tpm-pwn-transfer.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact official HITCON archive and verify SHA-256 without execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwn-challenge"
          curl -fSs --proto '=https' --max-redirs 0 --connect-timeout 12 --max-time 90 --max-filesize 35000000 \
            'https://ctf2026attach.hitconctf.com/d72ad1da709d0aca3b881f11a651420a/spi-tpm-pwn-db1d27f883a2e5e8.tar.gz' \
            -o "$RUNNER_TEMP/pwn-challenge/spi-tpm-pwn.tar.gz"
          echo "db1d27f883a2e5e8f73c2b1c6b4b77e0ebfe14642676cce6cadfca4c9d9e173d  $RUNNER_TEMP/pwn-challenge/spi-tpm-pwn.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import os, tarfile, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'pwn-challenge/spi-tpm-pwn.tar.gz'
          with tarfile.open(p,mode='r:gz') as tar:
              members=tar.getmembers()
              assert len(members)<=20 and sum(m.size for m in members)<40_000_000
              for m in members:
                  pp=pathlib.PurePosixPath(m.name)
                  assert not pp.is_absolute() and '..' not in pp.parts
                  assert m.isfile() or m.isdir()
          print('SIGNED ARCHIVE HASH CHECK PASSED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spi-tpm-pwn-original-archive
          path: ${{ runner.temp }}/pwn-challenge/spi-tpm-pwn.tar.gz
          retention-days: 1
          if-no-files-found: error
