name: HITCON SPI TPM - public synthetic firmware vectors

on:
  push:
    branches: [ctf/spi-tpm-2026]
    paths:
      - .github/workflows/spi-tpm-vector.yml
      - ctf/spi-tpm-2026/vector_check.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch signed-address challenge artifact and compare exact SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lib"
          curl -fsS --proto '=https' --max-redirs 0 --max-time 90 \
            --max-filesize 30000000 \
            'https://ctf2026attach.hitconctf.com/654627eea204ea708368d11d316e6555/spi-tpm-rev-e15a21887cc92581.tar.gz' -o "$RUNNER_TEMP/ctf.tar.gz"
          echo "e15a21887cc925818a5bdb0e6b669028bc30c94bbfc1fe0a06f4c5a4c543ad94  $RUNNER_TEMP/ctf.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import os,pathlib,tarfile,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root/'ctf.tar.gz') as tf:
              entry=tf.getmember('spi-tpm-rev/src/libspi_tpm_firmware.so')
              assert entry.isfile() and entry.size==22424
              data=tf.extractfile(entry).read()
          assert hashlib.sha256(data).hexdigest()=='1bd76fdd713d7c1003e27e418813e0444c3a2a780bf895836f093048b5cc7a40'
          (root/'lib/libspi_tpm_firmware.so').write_bytes(data)
          PY
      - name: Build independently authored signed-package runtime
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'FROM archlinux:base' \
            'RUN pacman -Syu --noconfirm --needed python && pacman -Scc --noconfirm' \
            'USER 1000:1000' 'WORKDIR /opt/code' > "$RUNNER_TEMP/Dockerfile"
          docker build --pull -q -t spi-fingerprint-check:local -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
      - name: Prove mathematical leakage implementation and decryption inverses
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --cpus 2 --memory 1g \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=24m \
            -v "$RUNNER_TEMP/lib:/opt/challenge:ro" \
            -v "$GITHUB_WORKSPACE/ctf/spi-tpm-2026:/opt/code:ro" \
            spi-fingerprint-check:local python -B /opt/code/vector_check.py
