name: Experimental one-APK integration smoke test (no distribution)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tsto-apk-integrate-test.yml'
      - 'tsto-offline/build/merge_game.py'
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Checkout original archived APK from patcher source
        uses: actions/checkout@v4
        with:
          repository: bodnjenie14/Tsto_patcher
          path: _game_source
          persist-credentials: false
      - name: Checkout local Python/protobuf game server
        run: git clone --depth 1 https://github.com/sp00nznet/tsto-springfield.git _upstream_server
      - name: Create Android Chaquopy server module
        run: |
          python tsto-offline/build/create_donor.py _upstream_server _donor
          gradle --no-daemon -p _donor :app:assembleDebug
      - name: Decode and merge original game with loopback server
        run: |
          set -euo pipefail
          test -s "_game_source/Original Files/tsto_original.apk"
          test -s "_game_source/apktool_2.10.0.jar"
          mkdir -p _output reports
          python tsto-offline/build/merge_game.py \
            --original "_game_source/Original Files/tsto_original.apk" \
            --donor "_donor/app/build/outputs/apk/debug/app-debug.apk" \
            --apktool "_game_source/apktool_2.10.0.jar" \
            --out "_output/merged-unsigned.apk" | tee reports/merge-build.txt
      - name: Re-align and sign experimentally
        shell: bash
        run: |
          set -euo pipefail
          BUILDTOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILDTOOLS/zipalign" -P 16 -f 4 _output/merged-unsigned.apk _output/merged-aligned.apk
          keytool -genkeypair -v -keystore _output/key.jks -alias tsto-experimental \
            -storepass local-testing-only -keypass local-testing-only \
            -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=Local Smoke Test, O=Local Build, C=US" >/dev/null 2>&1
          "$BUILDTOOLS/apksigner" sign --ks _output/key.jks \
            --ks-key-alias tsto-experimental --ks-pass pass:local-testing-only \
            --key-pass pass:local-testing-only \
            --out _output/tsto-experimental.apk _output/merged-aligned.apk
          "$BUILDTOOLS/apksigner" verify -v _output/tsto-experimental.apk
          unzip -l _output/tsto-experimental.apk | grep -E "lib/arm64-v8a/(libscorpio|libpython|libchaquopy)|assets/chaquopy|classes[0-9]*.dex" | head -30
          ls -lh _output/tsto-experimental.apk
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Emulate Android 15 with ARM compatibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -uo pipefail
            echo "Supported ABIs:"
            adb shell getprop ro.product.cpu.abilist | tee reports/emulator-abis.txt
            adb shell getprop ro.dalvik.vm.native.bridge | tee reports/emulator-native-bridge.txt
            if ! adb install _output/tsto-experimental.apk >reports/install.txt 2>&1; then
              cat reports/install.txt
              exit 1
            fi
            adb logcat -c
            adb shell monkey -p com.ea.game.simpsons4_row -c android.intent.category.LAUNCHER 1 \
              >reports/launch.txt 2>&1 || true
            adb forward tcp:19000 tcp:9000
            OK=0
            for attempt in $(seq 1 45); do
              if curl -fsS --max-time 2 "http://127.0.0.1:19000/" >reports/backend-response.txt 2>/dev/null; then
                echo "Loopback game backend reachable in original APK" | tee reports/result.txt
                OK=1
                break
              fi
              sleep 2
            done
            adb logcat -d -v time > reports/emulator-logcat.txt
            grep -E "TSTO_OFFLINE_SERVER|FATAL EXCEPTION|AndroidRuntime|python|libscorpio" reports/emulator-logcat.txt | tail -100 > reports/relevant-logcat.txt || true
            if [ "$OK" -ne 1 ]; then
              echo "No embedded backend detected; client or Python runtime may not have launched" | tee reports/result.txt
              cat reports/relevant-logcat.txt
              exit 1
            fi
            adb shell dumpsys activity activities >reports/activity.txt || true
            echo "NOT A PLAYABILITY TEST: no game DLC packaged; no tutorial or save verified." >>reports/result.txt
      - name: Reports only, never redistribute third-party APK or server code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsto-integration-test-results
          path: reports/
          retention-days: 14
      - name: Purge all source binaries and build outputs
        if: always()
        run: rm -rf _upstream_server _donor _game_source _output
