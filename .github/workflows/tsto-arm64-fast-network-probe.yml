name: TSTO native ARM64 second-wave DLC bootstrap diagnostic (2.5GB cap)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tsto-arm64-fast-network-probe.yml'
      - 'tsto-offline/build/merge_game.py'
permissions:
  contents: read
jobs:
  native-arm64-integrated-game:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Bootstrap Android command-line SDK without deprecated tools package
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest" "$RUNNER_TEMP/android-sdk-download"
          curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/android-sdk-download/cmdline.zip"
          unzip -q "$RUNNER_TEMP/android-sdk-download/cmdline.zip" -d "$RUNNER_TEMP/android-sdk-download"
          cp -a "$RUNNER_TEMP/android-sdk-download/cmdline-tools/." "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install native ARM64 AAPT2 and other Android tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y adb unzip
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.1" > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          curl --fail --show-error --location https://raw.githubusercontent.com/Commit451/android-arm-build-tools/main/install.sh -o /tmp/tsto-arm-build-tools.sh
          bash /tmp/tsto-arm-build-tools.sh --version 35.0.1 --sdk "$ANDROID_HOME"
          "$ANDROID_HOME/build-tools/35.0.1/aapt2" version
          mkdir -p ~/.gradle
          printf 'android.aapt2FromMavenOverride=%s/build-tools/35.0.1/aapt2\n' "$ANDROID_HOME" >> ~/.gradle/gradle.properties
      - name: Retrieve game code and game server for ephemeral testing
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/bodnjenie14/Tsto_patcher.git _game_source
          git clone --depth 1 https://github.com/sp00nznet/tsto-springfield.git _upstream_server
          test -s '_game_source/Original Files/tsto_original.apk'
          test -s _game_source/apktool_2.10.0.jar
          mkdir -p reports _output
      - name: Build Scorpio-only control with external host DLC server
        shell: bash
        run: |
          set -Eeuo pipefail
          python tsto-offline/build/merge_game.py \
            --original '_game_source/Original Files/tsto_original.apk' \
            --external-server \
            --pad-native-dlc-url \
            --apktool _game_source/apktool_2.10.0.jar \
            --aapt2 "$ANDROID_HOME/build-tools/35.0.1/aapt2" \
            --out _output/game-unsigned.apk | tee reports/merge-build.txt
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -P 16 -f 4 _output/game-unsigned.apk _output/game-aligned.apk
          keytool -genkeypair -keystore _output/test-only.jks -alias ephemeral -storepass local-testing-only \
            -keypass local-testing-only -keyalg RSA -keysize 3072 -validity 1 \
            -dname 'CN=Ephemeral CI Build, O=Local Compatibility Test, C=US' >/dev/null 2>&1
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign --ks _output/test-only.jks \
            --ks-key-alias ephemeral --ks-pass pass:local-testing-only \
            --key-pass pass:local-testing-only \
            --out _output/game-ci.apk _output/game-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify -v _output/game-ci.apk
          du -h _output/game-ci.apk | tee reports/size.txt
      - name: Stage genuine archived master and subindexes only (less than 100 MB, NO game packages)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _dlc_stage/dlc reports
          python - <<'PY'
          from urllib.request import urlopen, Request
          import json
          with urlopen(Request('https://archive.org/metadata/tsto-cdn-content',
                               headers={'User-Agent':'TSTO-private-index-only-test/1.0'}), timeout=60) as response:
              files=json.load(response)['files']
          item=next((f for f in files if f['name']=='cdn/dlc.7z'),None)
          if item is None: raise SystemExit('Index-only archive unavailable')
          if int(item['size'])>100_000_000: raise SystemExit('Index-only budget exceeded')
          with open('reports/index-archive-metadata.txt','w') as report:
              print('name='+item['name'],file=report)
              print('size='+str(item['size']),file=report)
              print('sha1='+item.get('sha1',''),file=report)
          PY
          curl -fLsS --retry 3 --max-time 480 \
            https://archive.org/download/tsto-cdn-content/cdn/dlc.7z \
            -o _dlc_indexes.7z
          python - <<'PY'
          import hashlib
          from pathlib import Path
          rows=dict(line.split('=',1) for line in Path('reports/index-archive-metadata.txt').read_text().splitlines())
          filename=Path('_dlc_indexes.7z')
          if filename.stat().st_size!=int(rows['size']):
              raise SystemExit('Index-only archive length mismatch')
          if rows['sha1']:
              with filename.open('rb') as stream:
                  if hashlib.file_digest(stream,'sha1').hexdigest()!=rows['sha1']:
                      raise SystemExit('Index-only archive checksum mismatch')
          PY
          7z x -y -o_dlc_stage _dlc_indexes.7z >reports/index-extraction.log
          rm -f _dlc_indexes.7z
          curl -fLsS --retry 3 --max-time 180 \
            http://oct2018-4-35-0-uam5h44a.tstodlc.eamobile.com/netstorage/gameasset/direct/simpsons/dlc/DLCIndex.zip \
            -o _dlc_stage/dlc/DLCIndex.zip
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          master=Path('_dlc_stage/dlc/DLCIndex.zip')
          with ZipFile(master) as archive:
              xmls=[x for x in archive.namelist() if x.lower().endswith('.xml')]
              assert len(xmls)==1,xmls
          count=len(list(Path('_dlc_stage/dlc').glob('DLCIndex*.zip')))
          if count<125: raise SystemExit(f'Incomplete genuine subindex set: {count}')
          Path('reports/subindex-count.txt').write_text(str(count)+'\n')
          PY
          python tsto-offline/build/check_master_index.py \
            _dlc_stage/dlc/DLCIndex.zip _dlc_stage >reports/index-coverage.txt
          # Verify real XML while explicitly refusing to interpret this as full-gameplay coverage.
          echo 'GENUINE DLC MASTER AND SUBINDEX XML ONLY; NO GAME ASSET PACKAGES. NOT A PLAYABLE APK TEST.' \
            > reports/PROBE_ONLY_NO_DLC.txt
      - name: Restore ONLY eleven requested resource groups (hard 2.5GB compressed budget)
        shell: bash
        run: |
          set -Eeuo pipefail
          # These archive groups were identified from genuine native-arm64
          # HTTP 404 requests (run 38872464663), not guessed from DLC names.
          # No 31-GB historical corpus restore is allowed in this diagnostic.
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen, Request
          names=[
              'cdn/4_69_UntroubledVases_Patch2_O0XTYOZLM6ZN.7z',
              'cdn/4_69_UntroubledVases_02OYXL5II0UO.7z',
              'cdn/4_31_Homergeddon_PEQBELL20XW9.7z',
              'cdn/4_62_FoodWars_K7U9NJ6IH37B.7z',
              'cdn/4_16_Monorail_Takedown_26T1M9UGIXUU.7z',
              'cdn/4_6_2r1_XMAS2013_Takedown.7z',
              # Second wave: actual 404s on the previous 407MB-run.
              'cdn/4_7_2r1_FEB2014_Takedown_c0ac9bee.7z',
              'cdn/4_67_CharityCase_LXJ0SRBNF13A.7z',
              'cdn/4_4_0r2_Videos.7z',
              'cdn/4_18_XMAS2015_Takedown_WQBO2OV3G5ZU.7z',
              'cdn/4_42_HeroesOfSpringfield_5CRHS6IO8JG3.7z',
          ]
          with urlopen(Request('https://archive.org/metadata/tsto-dlc-cdn-oct2024',
                               headers={'User-Agent':'TSTO-bounded-bootstrap-diagnostic/1.0'}), timeout=60) as r:
              metadata=json.load(r)
          catalog={f['name']:f for f in metadata['files']}
          items=[{'name':n,'size':int(catalog[n]['size']),
                  'sha1':catalog[n].get('sha1','')} for n in names]
          total=sum(x['size'] for x in items)
          if total>2_500_000_000:
              raise SystemExit('Hard budget violation: '+str(total))
          print('SELECTED_ARCHIVE_BYTES',total)
          Path('reports/bootstrap-archive-manifest.json').write_text(
              json.dumps({'total_bytes':total,'archives':items,'purpose':'DIAGNOSTIC ONLY'},indent=2))
          PY
          mkdir -p _bootstrap_download
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          from urllib.parse import quote
          manifest=json.loads(Path('reports/bootstrap-archive-manifest.json').read_text())
          for i,item in enumerate(manifest['archives'],1):
              archive=Path('_bootstrap_download')/'current.7z'
              archive.unlink(missing_ok=True)
              url='https://archive.org/download/tsto-dlc-cdn-oct2024/'+quote(item['name'],safe='/')
              subprocess.run(['curl','-fLsS','--retry','3','--retry-delay','3',
                              '--connect-timeout','45','--max-time','750','-o',str(archive),url],
                             check=True,timeout=800)
              if archive.stat().st_size!=item['size']:
                  raise SystemExit('Archive length mismatch: '+item['name'])
              if item['sha1']:
                  with archive.open('rb') as fh:
                      digest=hashlib.file_digest(fh,'sha1').hexdigest()
                  if digest!=item['sha1']:
                      raise SystemExit('Archive checksum mismatch: '+item['name'])
              subprocess.run(['7z','x','-y','-aoa','-o_dlc_stage',str(archive)],
                             stdout=subprocess.DEVNULL,check=True,timeout=350)
              print('STAGED',i,'of',len(manifest['archives']),item['name'],flush=True)
              archive.unlink()
          PY
          rm -rf _bootstrap_download
          # Real game DLC packages exist now, but the ENTIRE archive is missing.
          test -s _dlc_stage/4_69_UntroubledVases_Patch2_O0XTYOZLM6ZN/gamescripts-r497432-LYOXW1QI.zip
          test -s _dlc_stage/4_69_UntroubledVases_Patch2_O0XTYOZLM6ZN/textpools-en-r497432-LYOXW1QI.zip
          echo 'PARTIAL GAME ASSETS ONLY: ELEVEN ARCHIVE GROUPS; NOT ALL QUESTS; NO SPRINGFIELD ACCEPTANCE.' \
            > reports/PROBE_ONLY_NO_DLC.txt
          du -sh _dlc_stage | tee reports/bootstrap-stage-size.txt
      - name: Start host protocol server with bounded real resource subset
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install flask==3.1.2 flask-inflate protobuf==6.33.0 PyJWT==2.10.1 Werkzeug
          nohup python -u tsto-offline/build/start_host_server.py \
            _upstream_server _dlc_stage >reports/host-game-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:9000/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:9000/gameassets/ \
            | python -c 'import sys,xml.etree.ElementTree as ET; d=sys.stdin.buffer.read(); print(ET.fromstring(d).tag, len(d))' \
            | tee reports/gameassets-master-root.txt
      - name: Boot fully native ARM64 Android 15 on the ARM runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder || true
          grep binder /proc/filesystems
          mkdir -p "$RUNNER_TEMP/tsto-android-data"
          sudo docker run -d --rm --privileged --name tsto-native-arm-game \
            -v "$RUNNER_TEMP/tsto-android-data:/data" -p 127.0.0.1:5555:5555 \
            redroid/redroid:15.0.0_64only-latest \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 \
            androidboot.redroid_dpi=420 androidboot.redroid_gpu_mode=guest androidboot.use_memfd=1
          for i in $(seq 1 45); do
            adb connect 127.0.0.1:5555 || true
            if adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | grep -q '^1'; then break; fi
            sleep 3
          done
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abilist | tee reports/abi.txt
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.release | tee reports/android-release.txt
          adb -s 127.0.0.1:5555 shell getprop sys.boot_completed | tee reports/boot.txt
          test "$(tr -d '\r\n' <reports/boot.txt)" = 1
          grep -q arm64-v8a reports/abi.txt
      - name: A/B diagnose before DLC – display dialogs, local auth, connectivity and software rendering
        shell: bash
        run: |
          set -Eeuo pipefail
          adb -s 127.0.0.1:5555 install --no-incremental _output/game-ci.apk >reports/install.txt 2>&1
          adb -s 127.0.0.1:5555 reverse tcp:9000 tcp:9000
          adb -s 127.0.0.1:5555 shell settings put secure immersive_mode_confirmations confirmed || true
          adb -s 127.0.0.1:5555 shell settings get global captive_portal_mode >reports/portal-before.txt || true
          adb -s 127.0.0.1:5555 shell dumpsys connectivity >reports/connectivity-before.txt || true
          adb -s 127.0.0.1:5555 logcat -c || true
          adb -s 127.0.0.1:5555 shell am start -W -n com.ea.game.simpsons4_row/com.ea.simpsons.SimpsonsSplashScreen >reports/baseline-start.txt 2>&1 || true
          sleep 25
          adb -s 127.0.0.1:5555 exec-out screencap -p >reports/baseline-25s.png || true
          adb -s 127.0.0.1:5555 shell ps -A | grep simpsons >reports/baseline-processes.txt || true
          adb -s 127.0.0.1:5555 logcat -d -v time >reports/baseline-logcat.txt || true
          # The app must not be expected to reach Springfield in this probe:
          # the DLC index is a deliberate dummy. Check only whether earlier
          # authentication reaches /mh/gameplayconfig.
          adb -s 127.0.0.1:5555 shell am force-stop com.ea.game.simpsons4_row || true
          adb -s 127.0.0.1:5555 shell settings put global captive_portal_mode 0 || true
          adb -s 127.0.0.1:5555 shell settings put global device_provisioned 1 || true
          adb -s 127.0.0.1:5555 shell settings put secure user_setup_complete 1 || true
          adb -s 127.0.0.1:5555 shell setprop debug.hwui.renderer skiagl || true
          adb -s 127.0.0.1:5555 shell setprop debug.renderengine.backend skiagl || true
          adb -s 127.0.0.1:5555 shell getprop debug.hwui.renderer >reports/renderer-after.txt
          adb -s 127.0.0.1:5555 shell dumpsys connectivity >reports/connectivity-after.txt || true
          adb -s 127.0.0.1:5555 shell am start -W -n com.ea.game.simpsons4_row/com.ea.simpsons.SimpsonsSplashScreen >reports/treatment-start.txt 2>&1 || true
          sleep 30
          adb -s 127.0.0.1:5555 exec-out screencap -p >reports/treatment-30s.png || true
          adb -s 127.0.0.1:5555 shell ps -A | grep simpsons >reports/treatment-processes.txt || true
          adb -s 127.0.0.1:5555 logcat -d -v time >reports/treatment-logcat.txt || true
          python - <<'PY' | tee reports/auth-AB.txt
          from pathlib import Path
          s=Path('reports/host-game-server.log').read_text(errors='replace')
          n=s.count('"GET /mh/gameplayconfig HTTP/1.1" 200')
          print('Total gameplayconfig 200 in two trials:',n)
          print('NB: This is just early authentication, NOT proof of real game.')
          print('Host log request lines:')
          for line in s.splitlines():
              if '"GET /' in line or '"POST /' in line: print(line[:260])
          PY
          echo 'ONLY ELEVEN GAME ASSET GROUPS TESTED; NOT COMPLETE DLC; SCREENSHOTS ARE DIAGNOSTIC.' >reports/result.txt
      - name: Collect native Android diagnostics, without game binaries
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          (timeout 10 adb -s 127.0.0.1:5555 logcat -d -v time >reports/final-logcat.txt 2>&1) || true
          (timeout 10 sudo docker exec tsto-native-arm-game /system/bin/getprop >reports/native-getprop.txt 2>&1) || true
          (sudo docker logs --tail 200 tsto-native-arm-game >reports/container-log.txt 2>&1) || true
          (sudo docker rm -f tsto-native-arm-game) || true
          rm -rf _game_source _upstream_server _donor _output _dlc_stage _temporary_tsto_7z
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsto-arm64-fast-auth-graphics-diagnostics-not-apk
          path: reports/
          retention-days: 5
