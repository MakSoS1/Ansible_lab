name: ARM64 JNI glCreateShader on Android 16 graphics backends
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tsto-arm64-gles-reproducer.yml'
      - 'tsto-offline/gl-probe/**'
permissions:
  contents: read
jobs:
  glcreate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        gpu: [software, swangle, swiftshader]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install cross-compiler and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build tiny ARM64-only GLES shader JNI application
        run: |
          gradle --no-daemon -p tsto-offline/gl-probe :app:assembleDebug
          test -s tsto-offline/gl-probe/app/build/outputs/apk/debug/app-debug.apk
          unzip -l tsto-offline/gl-probe/app/build/outputs/apk/debug/app-debug.apk | grep libglprobe
      - name: Enable KVM
        run: if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Run ARM64 JNI shader creation against emulator GPU backend
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu ${{ matrix.gpu }}
          script: bash tsto-offline/gl-probe/smoke.sh
      - name: Upload only shader logs, no game APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsto-arm64-shader-probe-${{ matrix.gpu }}
          path: reports/
          retention-days: 7
