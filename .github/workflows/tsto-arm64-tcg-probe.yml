name: Verify ARM64 Android 16 emulator without Hypervisor.Framework
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tsto-arm64-tcg-probe.yml'
permissions:
  contents: read
jobs:
  boot-arm64:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Show host CPU and virtualization support
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          sw_vers
      - name: Boot Android 16 arm64 via software CPU emulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          emulator-boot-timeout: 1500
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel off
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abilist
            adb shell uname -m
            adb shell getconf PAGE_SIZE
