name: TSTO master DLC index 4.69.5 exact-path contract
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tsto-dlc-path-contract.yml'
      - 'tsto-offline/build/verify_dlc_paths.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Werkzeug
        run: python -m pip install Werkzeug==3.1.3
      - name: Obtain historical master and both index collections (not game textures)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _index/_first _index/_second _index/_merged/dlc reports
          curl -fL --retry 3 --max-time 150 -sS \
            http://oct2018-4-35-0-uam5h44a.tstodlc.eamobile.com/netstorage/gameasset/direct/simpsons/dlc/DLCIndex.zip \
            -o _index/_merged/dlc/DLCIndex.zip
          curl -fL --retry 3 --max-time 200 -sS \
            https://archive.org/download/tsto-dlc-cdn-oct2024/cdn/dlc.7z -o _index/first.7z
          curl -fL --retry 3 --max-time 200 -sS \
            https://archive.org/download/tsto-cdn-content/cdn/dlc.7z -o _index/second.7z
          7z x -y -o_index/_first _index/first.7z >/dev/null
          7z x -y -o_index/_second _index/second.7z >/dev/null
          cp -a _index/_first/. _index/_merged/
          cp -an _index/_second/. _index/_merged/
          python tsto-offline/build/verify_dlc_paths.py _index/_merged \
            --output reports/complete-index-flask-path-contract.json | tee reports/index-contract.txt
          grep -iE '4-69-5|UNTROUBLED' reports/index-contract.txt || true
      - name: Publish text-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsto-469-dlc-index-file-contract
          path: reports/
          retention-days: 7
      - name: Delete archives
        if: always()
        run: rm -rf _index
