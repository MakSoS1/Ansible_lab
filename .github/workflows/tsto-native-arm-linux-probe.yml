name: Probe native ARM Linux Android 16 AVD for Scorpio game
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tsto-native-arm-linux-probe.yml'
permissions:
  contents: read
jobs:
  arm-kvm-capability:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native ARM hardware and emulation requirements
        run: |
          set -e
          uname -a
          uname -m
          lscpu | head -35
          test -c /dev/kvm && ls -l /dev/kvm || echo "No /dev/kvm on ARM runner; use software AVD if available"
          df -h
          free -h
      - name: Boot native ARM64 Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7
          emulator-boot-timeout: 850
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel off
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.dalvik.vm.native.bridge
            adb shell getconf PAGE_SIZE
      - name: Save environment report if boot failed
        if: always()
        run: |
          mkdir -p reports
          uname -a >reports/kernel.txt
          df -h >reports/disk.txt
          test -e /dev/kvm && ls -l /dev/kvm >reports/kvm.txt || echo unavailable >reports/kvm.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsto-native-arm-linux-avd-capability
          path: reports/
          retention-days: 7
