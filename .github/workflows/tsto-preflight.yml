name: TSTO Android and DLC preflight
on:
  workflow_dispatch:
  push:
    paths:
      - 'tsto-offline/**'
      - '.github/workflows/tsto-preflight.yml'
permissions:
  contents: read
jobs:
  source-and-offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test APK and DLC inspector
        run: cd tsto-offline && python -m unittest discover -s tests -v
      - name: Test Pixel 10 local server configurator
        run: cd tsto-offline/mobile && python -m unittest discover -s tests -v
      - name: Shell and Python syntax validation
        run: |
          bash -n tsto-offline/mobile/install_termux.sh
          python -m py_compile tsto-offline/tsto_prepare.py tsto-offline/mobile/configure_server.py
      - name: Publish free-code sources only (NOT a playable APK)
        uses: actions/upload-artifact@v4
        with:
          name: tsto-source-tools
          path: tsto-offline/
          retention-days: 7
