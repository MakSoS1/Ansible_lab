[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-track2"
version = "0.1.0"
description = "AIOS Track 2 multi-agent well-control system with surrogate bake-off"
readme = "aios-track2/README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "scipy>=1.12",
  "torch>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "huggingface_hub>=0.36.0",
  "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-PyYAML",
]

[project.scripts]
aios-track2 = "aios_track2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "opm: requires a real OPM Flow executable",
  "slow: longer bake-off or training jobs",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/aios_track2/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
pretty = true
packages = ["aios_track2"]
exclude = ["src/aios_track2/vendor"]
